<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="stage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">CTE 全链路：SqlWith → 作用域注册 → 内联展开 → 优化 → Enumerable</text>
  <text x="520" y="50" text-anchor="middle" font-size="12" fill="#595959">普通 WITH 不是"物化一次复用"，而是每次引用都重转一遍定义（第三阶段，橙）——这是与直觉相反的关键一步</text>

  <!-- example SQL -->
  <rect x="28" y="66" width="984" height="48" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="42" y="85" font-size="11" font-weight="700" fill="#7F6000">示例 SQL（CTE 被引用两次）</text>
  <text x="42" y="104" font-size="11" font-family="'SF Mono',Menlo,monospace" fill="#262626">WITH d AS (SELECT deptno, count(*) c FROM emp GROUP BY deptno) SELECT * FROM d d1 JOIN d d2 ON d1.deptno=d2.deptno</text>

  <!-- stage headers -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="28"  y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="228" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="428" y="130" width="184" height="26" rx="5" fill="#ED7D31" stroke="#7F3F00"/>
    <rect x="628" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="828" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="120" y="148" fill="#1F4E79">① Parse</text>
    <text x="320" y="148" fill="#1F4E79">② Validate</text>
    <text x="520" y="148" fill="#ffffff">③ Convert ★关键一步</text>
    <text x="720" y="148" fill="#1F4E79">④ Optimize</text>
    <text x="920" y="148" fill="#1F4E79">⑤ Execute</text>
  </g>

  <!-- stage 1 -->
  <rect x="28" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="44" y="186" width="152" height="50" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="120" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">SqlWith</text>
  <text x="120" y="221" text-anchor="middle" font-size="8.6" fill="#595959">{ withList, body }</text>
  <line x1="120" y1="236" x2="120" y2="252" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="44" y="252" width="152" height="58" rx="6" fill="#FFF2CC" stroke="#BF8F00"/>
  <text x="120" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#7F6000">SqlWithItem</text>
  <text x="120" y="285" text-anchor="middle" font-size="8.4" fill="#7F6000">name=d, query=…</text>
  <text x="120" y="298" text-anchor="middle" font-size="8.4" fill="#7F6000">recursive=false</text>
  <rect x="44" y="324" width="152" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="120" y="343" text-anchor="middle" font-size="9.4" fill="#262626">body = SqlSelect</text>
  <text x="120" y="356" text-anchor="middle" font-size="8.4" fill="#595959">FROM d d1 JOIN d d2</text>
  <text x="44" y="390" font-size="9" fill="#888">锚点</text>
  <text x="44" y="404" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">SqlWith / SqlWithItem</text>
  <text x="44" y="430" font-size="9" fill="#385723">RECURSIVE 关键字会把</text>
  <text x="44" y="443" font-size="9" fill="#385723">recursive 标志置真。</text>

  <!-- stage 2 -->
  <rect x="228" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="244" y="186" width="152" height="44" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="320" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#385723">WithNamespace</text>
  <text x="320" y="220" text-anchor="middle" font-size="8.4" fill="#385723">校验各 item + body</text>
  <line x1="320" y1="230" x2="320" y2="246" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="244" y="246" width="152" height="56" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="320" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#385723">registerWith → WithScope</text>
  <text x="320" y="280" text-anchor="middle" font-size="8.4" fill="#385723">CTE 名 d 注册进作用域</text>
  <text x="320" y="293" text-anchor="middle" font-size="8.4" fill="#385723">渐进可见：后序 item/body 可引</text>
  <text x="244" y="326" font-size="9" fill="#595959">递归 CTE 另建</text>
  <text x="244" y="339" font-size="9" fill="#595959">WithRecursiveScope，</text>
  <text x="244" y="352" font-size="9" fill="#595959">允许自引用。</text>
  <text x="244" y="390" font-size="9" fill="#888">锚点（→第 07 篇）</text>
  <text x="244" y="404" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">SqlValidatorImpl</text>
  <text x="244" y="416" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">.registerWith :3366</text>

  <!-- stage 3 key -->
  <rect x="428" y="170" width="184" height="380" rx="8" fill="#FBE5D6" stroke="#7F3F00" stroke-width="1.6"/>
  <rect x="444" y="186" width="152" height="44" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="520" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#833C0C">convertWith :5102</text>
  <text x="520" y="220" text-anchor="middle" font-size="8.4" fill="#595959">只转 body，不转 CTE 定义</text>
  <line x1="520" y1="230" x2="520" y2="244" stroke="#7F3F00" stroke-width="1.4" marker-end="url(#stage)"/>
  <rect x="444" y="244" width="152" height="58" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="520" y="262" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">convertIdentifier :3001</text>
  <text x="520" y="277" text-anchor="middle" font-size="8.2" fill="#595959">遇到名 d：getNode()!=null</text>
  <text x="520" y="290" text-anchor="middle" font-size="8.2" fill="#595959">→ convertFrom(定义) 重转</text>
  <line x1="520" y1="302" x2="490" y2="320" stroke="#7F3F00" stroke-width="1.6" marker-end="url(#stage)"/>
  <line x1="520" y1="302" x2="550" y2="320" stroke="#7F3F00" stroke-width="1.6" marker-end="url(#stage)"/>
  <rect x="444" y="320" width="70" height="52" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="479" y="340" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">d 副本①</text>
  <text x="479" y="354" text-anchor="middle" font-size="7.6" fill="#FFF2CC">Aggregate</text>
  <text x="479" y="365" text-anchor="middle" font-size="7.6" fill="#FFF2CC">(Scan emp)</text>
  <rect x="526" y="320" width="70" height="52" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="561" y="340" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">d 副本②</text>
  <text x="561" y="354" text-anchor="middle" font-size="7.6" fill="#FFF2CC">Aggregate</text>
  <text x="561" y="365" text-anchor="middle" font-size="7.6" fill="#FFF2CC">(Scan emp)</text>
  <text x="444" y="396" font-size="9" fill="#833C0C">引用 N 次 = 内联 N 份</text>
  <text x="444" y="410" font-size="9" fill="#833C0C">相同子树，无共享。</text>
  <text x="444" y="432" font-size="8.8" fill="#888">递归 CTE 例外：createUnion</text>
  <text x="444" y="445" font-size="8.8" fill="#888">(:4150-4163) 改走 RepeatUnion</text>

  <!-- stage 4 -->
  <rect x="628" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="644" y="186" width="152" height="64" rx="6" fill="#1F4E79"/>
  <text x="720" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">LogicalJoin</text>
  <text x="720" y="222" text-anchor="middle" font-size="8.4" fill="#DEEBF7">d1.deptno = d2.deptno</text>
  <text x="720" y="238" text-anchor="middle" font-size="8.4" fill="#DEEBF7">左右各挂一份 Aggregate</text>
  <rect x="644" y="266" width="152" height="56" rx="6" fill="#F2F2F2" stroke="#595959" stroke-dasharray="5,3"/>
  <text x="720" y="284" text-anchor="middle" font-size="9.2" font-weight="700" fill="#262626">两份相同子树</text>
  <text x="720" y="299" text-anchor="middle" font-size="8.4" fill="#595959">可被 SubstitutionRule /</text>
  <text x="720" y="311" text-anchor="middle" font-size="8.4" fill="#595959">物化视图识别去重</text>
  <text x="644" y="346" font-size="8" fill="#888">→第 11/12 篇</text>
  <text x="644" y="372" font-size="9" fill="#385723">产物：常规逻辑算子树，</text>
  <text x="644" y="385" font-size="9" fill="#385723">CTE 已彻底消失，</text>
  <text x="644" y="398" font-size="9" fill="#385723">优化器对它无特殊感知。</text>

  <!-- stage 5 -->
  <rect x="828" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="844" y="186" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="920" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">EnumerableHashJoin</text>
  <text x="920" y="221" text-anchor="middle" font-size="8.4" fill="#595959">+ 2× EnumerableAggregate</text>
  <line x1="920" y1="234" x2="920" y2="250" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="844" y="250" width="152" height="44" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="920" y="269" text-anchor="middle" font-size="9.6" font-weight="700" fill="#1F4E79">Janino 编译</text>
  <text x="920" y="284" text-anchor="middle" font-size="8.4" fill="#595959">→ Bindable.bind()</text>
  <text x="844" y="318" font-size="8" fill="#888">→第 16 篇</text>
  <line x1="920" y1="326" x2="920" y2="342" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="844" y="342" width="152" height="44" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="920" y="361" text-anchor="middle" font-size="10.5" font-weight="700" fill="#385723">结果行 Enumerator</text>
  <text x="920" y="376" text-anchor="middle" font-size="8.4" fill="#385723">emp 被聚合两次</text>

  <!-- stage advance -->
  <line x1="212" y1="360" x2="228" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="412" y1="360" x2="428" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="612" y1="360" x2="628" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="812" y1="360" x2="828" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>

  <text x="520" y="578" text-anchor="middle" font-size="10" fill="#A6A6A6">图 21-3 — 橙色列为关键一步：CTE 名每被引用一次就内联一份定义副本（此例两份），优化器层面 CTE 已不存在</text>
</svg>
