<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
    <marker id="loopback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#7030A0"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">findBestExp() 主循环：注册 → 驱动迭代 → 抽取最优计划</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">VolcanoPlanner#findBestExp → ruleDriver.drive() → IterativeRuleDriver 的 while 出队循环</text>

  <!-- Step 1: setRoot (precondition) -->
  <rect x="350" y="74" width="260" height="48" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="480" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#262626">setRoot(rel) [前置]</text>
  <text x="480" y="110" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">registerImpl → root:RelSubset</text>
  <line x1="480" y1="122" x2="480" y2="142" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: ensureRootConverters + registerMaterializations -->
  <rect x="320" y="144" width="320" height="56" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="480" y="164" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F4E79">ensureRootConverters() + registerMaterializations()</text>
  <text x="480" y="182" text-anchor="middle" font-size="9" fill="#595959">在 root subset 上挂 AbstractConverter，使其他 subset</text>
  <text x="480" y="194" text-anchor="middle" font-size="9" fill="#595959">的廉价实现可转换到 root 所需 convention</text>
  <line x1="480" y1="200" x2="480" y2="220" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: ruleDriver.drive() container -->
  <rect x="120" y="222" width="720" height="316" rx="10" fill="#FFF7F0" stroke="#7030A0" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="134" y="242" font-size="11" font-weight="700" fill="#7030A0">loop  ruleDriver.drive()  [直到 ruleQueue 出队为空]</text>

  <!-- popMatch -->
  <rect x="360" y="256" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="480" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F4E79">match = ruleQueue.popMatch()</text>
  <text x="480" y="294" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">FIFO；preQueue(substitution) 优先</text>

  <!-- decision: null? -->
  <polygon points="480,318 560,348 480,378 400,348" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="480" y="345" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7F6000">match == null ?</text>
  <text x="480" y="360" text-anchor="middle" font-size="9" fill="#7F6000">队列空？</text>
  <line x1="480" y1="306" x2="480" y2="317" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- yes -> break -->
  <line x1="560" y1="348" x2="700" y2="348" stroke="#548235" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="340" font-size="9.5" font-weight="700" fill="#548235">是 → break</text>
  <rect x="700" y="324" width="120" height="48" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="760" y="344" text-anchor="middle" font-size="10.5" font-weight="700" fill="#385723">退出循环</text>
  <text x="760" y="360" text-anchor="middle" font-size="9" fill="#385723">达到不动点</text>

  <!-- no -> skipMatch check -->
  <line x1="480" y1="378" x2="480" y2="398" stroke="#7F3F00" stroke-width="1.5" marker-end="url(#hot)"/>
  <text x="492" y="392" font-size="9.5" font-weight="700" fill="#7F3F00">否</text>

  <!-- skipMatch / onMatch -->
  <rect x="320" y="400" width="320" height="56" rx="8" fill="#FBE5D6" stroke="#ED7D31" stroke-width="2"/>
  <text x="480" y="420" text-anchor="middle" font-size="11.5" font-weight="700" fill="#833C0C">match.onMatch()  ★ 触发规则、生成新表达式</text>
  <text x="480" y="438" text-anchor="middle" font-size="9" fill="#595959">rule.onMatch(call) → transformTo → ensureRegistered</text>
  <text x="480" y="450" text-anchor="middle" font-size="9" fill="#7F3F00">沿途 propagateCostImprovements 更新 best（见图 11-4）</text>

  <!-- timeout branch -->
  <rect x="120" y="408" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#C65911" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="205" y="424" text-anchor="middle" font-size="9.5" fill="#C65911">catch Timeout →</text>
  <text x="205" y="438" text-anchor="middle" font-size="9.5" fill="#C65911">canonize(); break</text>
  <line x1="320" y1="428" x2="292" y2="428" stroke="#C65911" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- canonize -->
  <line x1="480" y1="456" x2="480" y2="476" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="478" width="260" height="48" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="480" y="498" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F4E79">planner.canonize()</text>
  <text x="480" y="514" text-anchor="middle" font-size="9" fill="#595959">root 可能因 set 合并而改变，重定位 leader</text>

  <!-- loop back arrow -->
  <line x1="350" y1="502" x2="180" y2="502" stroke="#7030A0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="180" y1="502" x2="180" y2="281" stroke="#7030A0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="180" y1="281" x2="358" y2="281" stroke="#7030A0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#loopback)"/>
  <text x="190" y="396" font-size="9.5" font-weight="700" fill="#7030A0">下一次出队</text>

  <!-- Step 4: buildCheapestPlan -->
  <line x1="760" y1="372" x2="760" y2="560" stroke="#548235" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="760" y1="560" x2="612" y2="560" stroke="#548235" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <rect x="320" y="556" width="290" height="64" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="2"/>
  <text x="465" y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">root.buildCheapestPlan(this)</text>
  <text x="465" y="596" text-anchor="middle" font-size="9.5" fill="#FFF2CC">CheapestPlanReplacer 自顶向下递归</text>
  <text x="465" y="610" text-anchor="middle" font-size="9.5" fill="#FFF2CC">把每个 RelSubset 替换为它的 best</text>

  <line x1="465" y1="620" x2="465" y2="640" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="345" y="642" width="240" height="40" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="465" y="667" text-anchor="middle" font-size="11.5" font-weight="700" fill="#385723">return 物理 RelNode（最优计划）</text>

  <!-- side note: CannotPlan -->
  <rect x="640" y="556" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#C65911" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="740" y="575" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C65911">坑：best==null 时</text>
  <text x="740" y="590" text-anchor="middle" font-size="9" fill="#C65911">抛 CannotPlanException</text>
  <text x="740" y="605" text-anchor="middle" font-size="9" fill="#595959">DeadEndFinder 报告</text>
  <text x="740" y="617" text-anchor="middle" font-size="9" fill="#595959">"缺哪个 conversion"</text>

  <text x="480" y="694" text-anchor="middle" font-size="10" fill="#A6A6A6">图 11-3 — 蓝=正常流；橙=优化热点；紫虚=迭代回边；绿虚=出口/返回；棕虚=异常/超时分支</text>
</svg>
