<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="match" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ED7D31"/>
    </marker>
  </defs>

  <rect width="920" height="700" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">RelOptRuleOperand 递归匹配树 与 ChildPolicy</text>
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#595959">每个 operand 是一条「类 + trait + predicate」断言；childPolicy 决定如何向子节点递归；左为模式，右为被匹配的 RelNode 树</text>

  <!-- LEFT: operand pattern tree -->
  <text x="240" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">规则的 Operand 模式树（FILTER_INTO_JOIN）</text>
  <text x="240" y="98" text-anchor="middle" font-size="10" fill="#888">operand(Filter).oneInput(b -&gt; b.operand(Join).anyInputs())</text>

  <!-- operand: Filter -->
  <rect x="120" y="116" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="240" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Operand #0</text>
  <text x="132" y="153" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">clazz = Filter.class</text>
  <text x="132" y="166" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">predicate = r -&gt; true</text>
  <text x="132" y="181" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7030A0">childPolicy = SOME</text>

  <!-- operand: Join -->
  <rect x="120" y="248" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="240" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Operand #1</text>
  <text x="132" y="285" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">clazz = Join.class</text>
  <text x="132" y="298" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">trait = null（任意 trait）</text>
  <text x="132" y="313" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7030A0">childPolicy = ANY</text>

  <!-- arrow child -->
  <line x1="240" y1="188" x2="240" y2="247" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#ref)"/>
  <text x="248" y="222" font-size="9" fill="#595959">children[0]（parent 反指针）</text>

  <!-- ANY = stop -->
  <rect x="120" y="354" width="240" height="40" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.1" stroke-dasharray="4,3"/>
  <text x="240" y="379" text-anchor="middle" font-size="11" fill="#262626">ANY：不再约束子树，递归到此停止</text>
  <line x1="240" y1="320" x2="240" y2="353" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ChildPolicy enum box -->
  <rect x="60" y="430" width="360" height="220" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.4"/>
  <text x="240" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#385723">enum RelOptRuleOperandChildPolicy</text>
  <line x1="74" y1="462" x2="406" y2="462" stroke="#548235" stroke-width="0.8"/>
  <text x="80" y="482" font-size="11" font-weight="700" fill="#385723">ANY</text>
  <text x="150" y="482" font-size="10" fill="#385723">子节点任意个、不再匹配（最常用收尾）</text>
  <text x="80" y="506" font-size="11" font-weight="700" fill="#385723">LEAF</text>
  <text x="150" y="506" font-size="10" fill="#385723">无子节点，匹配叶子（TableScan / Values）</text>
  <text x="80" y="530" font-size="11" font-weight="700" fill="#385723">SOME</text>
  <text x="150" y="530" font-size="10" fill="#385723">子节点须按序精确匹配各 child operand</text>
  <text x="80" y="554" font-size="11" font-weight="700" fill="#385723">UNORDERED</text>
  <text x="183" y="554" font-size="10" fill="#385723">匹配父的任一子节点（顺序无关）</text>
  <line x1="74" y1="570" x2="406" y2="570" stroke="#548235" stroke-width="0.6"/>
  <text x="80" y="588" font-size="9.5" fill="#385723">Builder 入口（RelRule.OperandDetailBuilder）：</text>
  <text x="80" y="604" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">anyInputs() &#8594; ANY    noInputs() &#8594; LEAF</text>
  <text x="80" y="618" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">oneInput/inputs() &#8594; SOME</text>
  <text x="80" y="632" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">unorderedInputs() &#8594; UNORDERED</text>
  <text x="80" y="646" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">convert(trait) &#8594; ConverterRelOptRuleOperand</text>

  <!-- RIGHT: actual RelNode tree being matched -->
  <text x="680" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">被匹配的 RelNode 子树</text>
  <text x="680" y="98" text-anchor="middle" font-size="10" fill="#888">operand.matches(rel)：isInstance + trait.contains + predicate.test</text>

  <rect x="560" y="116" width="240" height="48" rx="8" fill="#70AD47"/>
  <text x="680" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">LogicalFilter</text>
  <text x="680" y="153" text-anchor="middle" font-size="10" fill="#E2EFDA">sal &gt; 1000</text>

  <rect x="560" y="248" width="240" height="48" rx="8" fill="#5B9BD5"/>
  <text x="680" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">LogicalJoin</text>
  <text x="680" y="285" text-anchor="middle" font-size="10" fill="#DEEBF7">inner, e.deptno = d.deptno</text>

  <rect x="540" y="354" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="605" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">TableScan(emp)</text>
  <rect x="690" y="354" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="755" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">TableScan(dept)</text>

  <line x1="680" y1="164" x2="680" y2="247" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#ref)"/>
  <line x1="640" y1="296" x2="605" y2="353" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#ref)"/>
  <line x1="720" y1="296" x2="755" y2="353" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#ref)"/>

  <!-- match arrows between pattern and reality -->
  <line x1="360" y1="148" x2="560" y2="138" stroke="#ED7D31" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#match)"/>
  <text x="430" y="130" font-size="9" font-weight="700" fill="#C65911">#0 matches</text>
  <line x1="360" y1="280" x2="560" y2="270" stroke="#ED7D31" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#match)"/>
  <text x="430" y="262" font-size="9" font-weight="700" fill="#C65911">#1 matches</text>

  <!-- result note -->
  <rect x="540" y="430" width="320" height="220" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.2"/>
  <text x="700" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#833C0C">匹配成功后 &#8594; call.rels[]</text>
  <text x="556" y="474" font-size="10" fill="#7F3F00">驱动器从根 operand 出发，按 solveOrder 逐层</text>
  <text x="556" y="490" font-size="10" fill="#7F3F00">下探（matchRecurse）；每个 operand 命中的</text>
  <text x="556" y="506" font-size="10" fill="#7F3F00">RelNode 按 ordinalInRule 填入 call.rels[]。</text>
  <text x="556" y="528" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">call.rels[0] = LogicalFilter</text>
  <text x="556" y="544" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">call.rels[1] = LogicalJoin</text>
  <text x="556" y="566" font-size="10" fill="#7F3F00">onMatch 中即可：</text>
  <text x="556" y="582" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">Filter f = call.rel(0);</text>
  <text x="556" y="596" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">Join   j = call.rel(1);</text>
  <text x="556" y="618" font-size="9.5" fill="#7F3F00">坑：predicate 默认 r-&gt;true，忘记收紧会</text>
  <text x="556" y="632" font-size="9.5" fill="#7F3F00">过度匹配，触发大量 0-successor 的空转。</text>

  <text x="460" y="684" text-anchor="middle" font-size="10" fill="#A6A6A6">图 12-2 — 蓝实线=父子结构/输入；橙虚线=operand 与 RelNode 的命中关系；childPolicy 控制递归是否、如何继续向下匹配</text>
</svg>
