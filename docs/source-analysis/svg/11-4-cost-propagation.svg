<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="seqArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="seqArrBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#548235"/>
    </marker>
    <marker id="hotArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="1000" height="840" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">代价传播时序：onMatch → register → propagateCostImprovements</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#595959">一次规则触发如何把"更便宜的物理算子"沿父链向上推，自底向上更新 best / bestCost</text>

  <!-- Actors -->
  <g font-size="10.5" font-weight="700" fill="#ffffff">
    <rect x="30"  y="68" width="130" height="32" rx="6" fill="#ED7D31"/><text x="95"  y="89" text-anchor="middle">RuleDriver</text>
    <rect x="180" y="68" width="140" height="32" rx="6" fill="#1F4E79"/><text x="250" y="89" text-anchor="middle">VolcanoRuleCall</text>
    <rect x="345" y="68" width="140" height="32" rx="6" fill="#1F4E79"/><text x="415" y="89" text-anchor="middle">VolcanoPlanner</text>
    <rect x="510" y="68" width="120" height="32" rx="6" fill="#548235"/><text x="570" y="89" text-anchor="middle">RelSet</text>
    <rect x="655" y="68" width="130" height="32" rx="6" fill="#C65911"/><text x="720" y="89" text-anchor="middle">RelSubset</text>
    <rect x="810" y="68" width="160" height="32" rx="6" fill="#595959"/><text x="890" y="89" text-anchor="middle">RelMetadataQuery</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#BFBFBF" stroke-dasharray="3,4" stroke-width="1">
    <line x1="95"  y1="100" x2="95"  y2="800"/>
    <line x1="250" y1="100" x2="250" y2="800"/>
    <line x1="415" y1="100" x2="415" y2="800"/>
    <line x1="570" y1="100" x2="570" y2="800"/>
    <line x1="720" y1="100" x2="720" y2="800"/>
    <line x1="890" y1="100" x2="890" y2="800"/>
  </g>

  <!-- activation bars -->
  <rect x="246" y="125" width="8" height="520" fill="#DEEBF7"/>
  <rect x="411" y="190" width="8" height="540" fill="#DEEBF7"/>
  <rect x="716" y="430" width="8" height="300" fill="#FBE5D6"/>

  <g font-size="10.5">
    <!-- 1 onMatch -->
    <line x1="95" y1="130" x2="246" y2="130" stroke="#ED7D31" stroke-width="1.4" marker-end="url(#hotArr)"/>
    <text x="100" y="124" fill="#833C0C">1. match.onMatch()</text>

    <!-- 2 rule.onMatch -> transformTo -->
    <line x1="254" y1="160" x2="246" y2="160" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="100" y="154" fill="#262626">2. getRule().onMatch(call) → call.transformTo(newRel)</text>

    <!-- 3 ensureRegistered -->
    <line x1="254" y1="192" x2="411" y2="192" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="262" y="186" fill="#262626">3. ensureRegistered(newRel, rels[0])</text>

    <!-- 4 registerImpl onRegister -->
    <line x1="423" y1="224" x2="423" y2="248" stroke="#1F4E79" stroke-width="1.2"/>
    <line x1="423" y1="248" x2="415" y2="248" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#seqArr)"/>
    <text x="430" y="220" fill="#262626">4. registerImpl: rel.onRegister(子节点先注册)</text>

    <!-- 5 digest lookup -->
    <line x1="423" y1="280" x2="423" y2="304" stroke="#1F4E79" stroke-width="1.2"/>
    <line x1="423" y1="304" x2="415" y2="304" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#seqArr)"/>
    <text x="430" y="276" fill="#262626">5. mapDigestToRel.get(digest) — 命中则复用，去重</text>

    <!-- 6 addRelToSet -->
    <line x1="419" y1="336" x2="566" y2="336" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="430" y="330" fill="#262626">6. set.add(rel) → 落入 RelSubset</text>

    <!-- 7 getOrCreateSubset -->
    <line x1="574" y1="368" x2="716" y2="368" stroke="#548235" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="582" y="362" fill="#385723">7. getOrCreateSubset(traits) + addConverters</text>

    <!-- 8 return subset -->
    <line x1="716" y1="398" x2="574" y2="398" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="582" y="392" fill="#385723">← subset</text>

    <!-- 9 propagateCostImprovements -->
    <line x1="419" y1="432" x2="716" y2="432" stroke="#7F3F00" stroke-width="1.6" marker-end="url(#hotArr)"/>
    <text x="430" y="426" fill="#833C0C" font-weight="700">8. propagateCostImprovements(rel)  ★ 动规核心</text>

    <!-- 10 getNonCumulativeCost -->
    <line x1="724" y1="466" x2="888" y2="466" stroke="#595959" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="732" y="460" fill="#262626">9. getCostOrInfinite(rel, mq)</text>
    <line x1="888" y1="494" x2="724" y2="494" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="732" y="488" fill="#385723">← cumulative cost（rel + 所有 input.bestCost）</text>
  </g>

  <!-- loop frame: heap propagation -->
  <rect x="640" y="512" width="340" height="180" rx="8" fill="none" stroke="#7030A0" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="650" y="528" font-size="10" font-weight="700" fill="#7030A0">loop  [PriorityQueue 按 cost 升序弹出 relNode]</text>

  <g font-size="10">
    <text x="654" y="548" fill="#7F3F00" font-weight="700">10. if (cost.isLt(subset.bestCost))</text>
    <text x="668" y="564" fill="#1a1a1a">subset.bestCost = cost</text>
    <text x="668" y="580" fill="#1a1a1a">subset.best = relNode</text>
    <text x="668" y="596" fill="#1a1a1a">subset.timestamp++</text>
    <text x="668" y="612" fill="#595959">mq.clearCache(subset)  // 失效旧元数据</text>

    <text x="654" y="636" fill="#7F3F00" font-weight="700">11. for parent in subset.getParents():</text>
    <text x="668" y="652" fill="#1a1a1a">newCost = getCostOrInfinite(parent)</text>
    <text x="668" y="668" fill="#1a1a1a">若更便宜 → heap.offer(parent)</text>
    <text x="668" y="684" fill="#7030A0">沿 parents 反向指针逐层上推 ▲</text>
  </g>

  <!-- self loop on subset -->
  <line x1="724" y1="536" x2="760" y2="536" stroke="#7F3F00" stroke-width="1.2"/>
  <line x1="760" y1="536" x2="760" y2="556" stroke="#7F3F00" stroke-width="1.2"/>
  <line x1="760" y1="556" x2="724" y2="556" stroke="#7F3F00" stroke-width="1.2" marker-end="url(#hotArr)"/>

  <!-- 12 return up to ruleCall -->
  <line x1="411" y1="730" x2="254" y2="730" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
  <text x="262" y="724" font-size="10.5" fill="#385723">12. ← 注册完成，best 已沿父链更新到 root</text>

  <!-- 13 driver continues -->
  <line x1="246" y1="762" x2="95" y2="762" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
  <text x="100" y="756" font-size="10.5" fill="#385723">13. ← onMatch 返回；driver 取下一个 match</text>

  <!-- pitfall note -->
  <rect x="30" y="784" width="940" height="20" rx="4" fill="#FFF7F0" stroke="#C65911" stroke-width="0.8"/>
  <text x="40" y="798" font-size="9.5" fill="#C65911">坑：CyclicMetadataException 在 addRelToSet 处被吞掉(ignore)；若元数据递归成环，best 可能暂未更新，靠后续注册补偿。</text>

  <text x="500" y="826" text-anchor="middle" font-size="10" fill="#A6A6A6">图 11-4 — 蓝=正向调用；绿虚=返回；橙=代价相关热点调用；紫虚框=堆驱动的父链传播循环</text>
</svg>
