<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1F4E79" stroke-width="1"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <linearGradient id="gContainer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="920" height="720" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">SqlNode 子类树 · SqlCall 委托 SqlOperator · 三策略对象</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#595959">数据（SqlCall 持操作数 + 位置）与行为（SqlOperator 持语义）分离；语义再委托给三个策略接口</text>

  <!-- ===== Abstract root: SqlNode ===== -->
  <rect x="350" y="72" width="220" height="78" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.6" stroke-dasharray="4,2"/>
  <text x="460" y="92" text-anchor="middle" font-size="11" font-style="italic" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="460" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#7F6000">SqlNode</text>
  <text x="460" y="125" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">+ pos : SqlParserPos</text>
  <text x="460" y="138" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">abstract accept(v) / unparse() / clone()</text>

  <!-- ===== Subclass row ===== -->
  <!-- SqlCall (abstract) -->
  <rect x="60" y="210" width="190" height="70" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.6" stroke-dasharray="4,2"/>
  <text x="155" y="229" text-anchor="middle" font-size="10" font-style="italic" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="155" y="245" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7F6000">SqlCall</text>
  <text x="155" y="262" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">getOperator() : SqlOperator</text>
  <text x="155" y="274" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">getOperandList()</text>

  <!-- Leaf nodes -->
  <rect x="278" y="214" width="118" height="30" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="337" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">SqlLiteral</text>
  <rect x="278" y="248" width="118" height="30" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="337" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">SqlIdentifier</text>
  <rect x="410" y="214" width="118" height="30" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="469" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">SqlNodeList</text>
  <rect x="410" y="248" width="118" height="30" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="469" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">SqlDynamicParam</text>
  <rect x="542" y="214" width="128" height="30" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="606" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">SqlDataTypeSpec</text>
  <rect x="542" y="248" width="128" height="30" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="606" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">SqlIntervalQualifier</text>

  <!-- inheritance edges to SqlNode -->
  <line x1="155" y1="210" x2="430" y2="150" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#inh)"/>
  <line x1="337" y1="214" x2="445" y2="150" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#inh)"/>
  <line x1="469" y1="214" x2="465" y2="150" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#inh)"/>
  <line x1="606" y1="214" x2="490" y2="150" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#inh)"/>

  <!-- ===== Concrete SqlCall subclasses ===== -->
  <rect x="40" y="318" width="100" height="28" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="90" y="337" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">SqlBasicCall</text>
  <rect x="148" y="318" width="100" height="28" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="198" y="337" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">SqlSelect</text>
  <line x1="90" y1="318" x2="140" y2="280" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <line x1="198" y1="318" x2="170" y2="280" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <text x="144" y="362" text-anchor="middle" font-size="9" fill="#888">…SqlJoin / SqlInsert / SqlOrderBy 等均为 SqlCall</text>

  <!-- ===== SqlOperator (abstract, behavior side) ===== -->
  <rect x="640" y="318" width="240" height="120" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.8" stroke-dasharray="4,2"/>
  <text x="760" y="338" text-anchor="middle" font-size="10" font-style="italic" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="760" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#7F6000">SqlOperator</text>
  <line x1="652" y1="362" x2="868" y2="362" stroke="#BF8F00" stroke-width="0.8"/>
  <text x="660" y="378" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">name : String   kind : SqlKind</text>
  <text x="660" y="392" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">leftPrec / rightPrec : int</text>
  <text x="660" y="406" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">unparse() / inferReturnType()</text>
  <text x="660" y="420" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">createCall() / acceptCall()</text>
  <text x="660" y="434" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">checkOperandTypes()</text>

  <!-- SqlCall holds SqlOperator -->
  <line x1="250" y1="240" x2="640" y2="350" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="430" y="300" text-anchor="middle" font-size="9.5" fill="#888">getOperator()  数据 → 行为 委托（每个 SqlCall 持有一个 SqlOperator）</text>

  <!-- SqlOperator concrete subclasses -->
  <rect x="640" y="456" width="74" height="26" rx="5" fill="#ffffff" stroke="#1F4E79"/>
  <text x="677" y="473" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a1a">SqlFunction</text>
  <rect x="718" y="456" width="92" height="26" rx="5" fill="#ffffff" stroke="#1F4E79"/>
  <text x="764" y="473" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a1a">SqlBinaryOperator</text>
  <rect x="814" y="456" width="66" height="26" rx="5" fill="#ffffff" stroke="#1F4E79"/>
  <text x="847" y="473" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a1a">SqlAggFn…</text>
  <line x1="677" y1="456" x2="740" y2="438" stroke="#1F4E79" stroke-width="1.1" marker-end="url(#inh)"/>
  <line x1="764" y1="456" x2="762" y2="438" stroke="#1F4E79" stroke-width="1.1" marker-end="url(#inh)"/>
  <line x1="847" y1="456" x2="785" y2="438" stroke="#1F4E79" stroke-width="1.1" marker-end="url(#inh)"/>

  <!-- ===== Three strategy interfaces ===== -->
  <rect x="560" y="540" width="320" height="118" rx="8" fill="url(#gContainer)" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="720" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">三策略对象（Strategy）— 类型规则可组合复用</text>

  <rect x="574" y="572" width="292" height="24" rx="5" fill="#E2EFDA" stroke="#548235"/>
  <text x="582" y="588" font-size="9.5" fill="#385723">&#171;interface&#187; SqlReturnTypeInference  ── 推导返回类型</text>
  <rect x="574" y="600" width="292" height="24" rx="5" fill="#E2EFDA" stroke="#548235"/>
  <text x="582" y="616" font-size="9.5" fill="#385723">&#171;interface&#187; SqlOperandTypeInference ── 推未知操作数类型</text>
  <rect x="574" y="628" width="292" height="24" rx="5" fill="#E2EFDA" stroke="#548235"/>
  <text x="582" y="644" font-size="9.5" fill="#385723">&#171;interface&#187; SqlOperandTypeChecker  ── 校验操作数类型</text>

  <!-- operator holds three strategies -->
  <line x1="760" y1="482" x2="740" y2="540" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="828" y="514" text-anchor="middle" font-size="9" fill="#888">private final 字段持有</text>

  <!-- ===== SqlKind enum ===== -->
  <rect x="60" y="420" width="240" height="116" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.4"/>
  <text x="180" y="440" text-anchor="middle" font-size="11" font-style="italic" fill="#262626">&#171;enum&#187;</text>
  <text x="180" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#262626">SqlKind</text>
  <line x1="72" y1="463" x2="288" y2="463" stroke="#595959" stroke-width="0.8"/>
  <text x="72" y="479" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">SELECT, JOIN, EQUALS, AND, OR …</text>
  <text x="72" y="493" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">COMPARISON / AGGREGATE / QUERY (集合)</text>
  <text x="72" y="507" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">belongsTo(category) : boolean</text>
  <text x="72" y="521" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">→ 用分类替代 instanceof + switch</text>

  <!-- operator holds kind -->
  <line x1="640" y1="370" x2="300" y2="455" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="470" y="430" text-anchor="middle" font-size="9" fill="#888">kind : SqlKind（SqlCall.getKind() 转发自 operator）</text>

  <!-- ===== Legend ===== -->
  <rect x="60" y="560" width="470" height="100" rx="6" fill="#ffffff" stroke="#BFBFBF"/>
  <text x="72" y="578" font-size="11" font-weight="700" fill="#595959">图例</text>
  <rect x="72" y="588" width="22" height="14" rx="3" fill="#FFF2CC" stroke="#BF8F00" stroke-dasharray="4,2"/>
  <text x="102" y="599" font-size="10" fill="#595959">abstract 抽象类</text>
  <rect x="220" y="588" width="22" height="14" rx="3" fill="#E2EFDA" stroke="#548235"/>
  <text x="250" y="599" font-size="10" fill="#595959">interface 接口</text>
  <rect x="370" y="588" width="22" height="14" rx="3" fill="#ffffff" stroke="#1F4E79"/>
  <text x="400" y="599" font-size="10" fill="#595959">具体类</text>
  <rect x="72" y="612" width="22" height="14" rx="3" fill="#F2F2F2" stroke="#595959"/>
  <text x="102" y="623" font-size="10" fill="#595959">enum 枚举</text>
  <line x1="218" y1="619" x2="252" y2="619" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#inh)"/>
  <text x="262" y="623" font-size="10" fill="#595959">继承（空心三角）</text>
  <line x1="400" y1="619" x2="434" y2="619" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="444" y="623" font-size="10" fill="#595959">持有 / 引用</text>
  <text x="72" y="648" font-size="9.5" fill="#595959">关键：SqlCall 不含语义；问"我是什么算子、返回什么类型"都转给 SqlOperator。</text>

  <text x="460" y="700" text-anchor="middle" font-size="10" fill="#A6A6A6">图 03-1 — 一棵 AST 由 SqlCall + 叶子节点构成；每个 SqlCall 委托一个 SqlOperator，operator 再把类型规则委托给三策略对象</text>
</svg>
