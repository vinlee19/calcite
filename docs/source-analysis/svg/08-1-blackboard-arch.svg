<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <linearGradient id="bgCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">SqlToRelConverter.convertQuery 调用栈 + Blackboard 共享状态</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">每个 SELECT/子查询一块 Blackboard；递归下降把已校验的 SqlNode 翻译为逻辑 RelNode 树</text>

  <!-- Left: call stack -->
  <rect x="32" y="74" width="430" height="552" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="48" y="96" font-size="13" font-weight="700" fill="#262626">① 递归下降调用栈（每层处理一个查询块）</text>

  <!-- convertQuery -->
  <rect x="56" y="110" width="382" height="48" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="68" y="130" font-size="12.5" font-weight="700" fill="#ffffff">convertQuery(query, needsValidation, top)</text>
  <text x="68" y="148" font-size="10" fill="#FFF2CC">入口：validate? → convertQueryRecursive → RelRoot</text>

  <!-- convertQueryRecursive -->
  <rect x="76" y="172" width="362" height="44" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="88" y="190" font-size="12" font-weight="700" fill="#1F4E79">convertQueryRecursive(query, top, targetRowType)</text>
  <text x="88" y="207" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">switch(kind): SELECT / UNION / WITH / VALUES / DML ...</text>

  <!-- convertSelect -->
  <rect x="96" y="230" width="342" height="44" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="108" y="248" font-size="12" font-weight="700" fill="#1F4E79">convertSelect(select, top)</text>
  <text x="108" y="265" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">new Blackboard(whereScope, null, top)</text>

  <!-- convertSelectImpl steps -->
  <rect x="116" y="288" width="322" height="300" rx="6" fill="#ffffff" stroke="#1F4E79" stroke-dasharray="3,2"/>
  <text x="128" y="307" font-size="11.5" font-weight="700" fill="#1F4E79">convertSelectImpl(bb, select) — 按 SQL 子句顺序填 bb.root</text>

  <g font-size="11">
    <rect x="132" y="318" width="290" height="32" rx="4" fill="#E2EFDA" stroke="#548235"/>
    <text x="142" y="338" fill="#385723">convertFrom — TableScan / Join → bb.setRoot()</text>
    <rect x="132" y="356" width="290" height="32" rx="4" fill="#E2EFDA" stroke="#548235"/>
    <text x="142" y="376" fill="#385723">convertWhere — replaceSubQueries + LogicalFilter</text>
    <rect x="132" y="394" width="290" height="32" rx="4" fill="#E2EFDA" stroke="#548235"/>
    <text x="142" y="414" fill="#385723">createAggImpl — AggConverter → LogicalAggregate</text>
    <rect x="132" y="432" width="290" height="32" rx="4" fill="#E2EFDA" stroke="#548235"/>
    <text x="142" y="452" fill="#385723">convertSelectList — LogicalProject</text>
    <rect x="132" y="470" width="290" height="32" rx="4" fill="#E2EFDA" stroke="#548235"/>
    <text x="142" y="490" fill="#385723">convertOrder / DISTINCT → Sort / Aggregate</text>
  </g>

  <!-- exprConverter call -->
  <rect x="132" y="514" width="290" height="58" rx="4" fill="#FFF2CC" stroke="#BF8F00"/>
  <text x="142" y="532" font-size="11" font-weight="700" fill="#7F6000">行表达式翻译（每个子句都用）</text>
  <text x="142" y="549" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">bb.convertExpression(sqlNode)</text>
  <text x="142" y="564" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">→ exprConverter.convertCall → 见图 08-2</text>

  <!-- stack arrows -->
  <line x1="247" y1="158" x2="247" y2="172" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="257" y1="216" x2="257" y2="230" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="267" y1="274" x2="267" y2="288" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Right: Blackboard shared state -->
  <rect x="500" y="74" width="428" height="420" rx="8" fill="url(#bgCore)" stroke="#1F4E79" stroke-width="2"/>
  <text x="516" y="96" font-size="13" font-weight="700" fill="#1F4E79">② Blackboard — 单个查询块的可变工作区</text>
  <text x="516" y="113" font-size="10" fill="#1F4E79">implements SqlRexContext, SqlVisitor&lt;RexNode&gt;, InitializerContext</text>

  <g font-size="11">
    <rect x="516" y="126" width="396" height="40" rx="4" fill="#ffffff" stroke="#1F4E79"/>
    <text x="526" y="143" font-weight="700" fill="#1a1a1a"><tspan font-family="'SF Mono',Menlo,monospace">root : RelNode</tspan>  ← 增量构建的逻辑算子树（核心产出）</text>
    <text x="526" y="159" fill="#595959" font-size="9.5">由 null 逐步变为 Scan→Filter→Aggregate→Project</text>

    <rect x="516" y="172" width="396" height="38" rx="4" fill="#ffffff" stroke="#1F4E79"/>
    <text x="526" y="189" font-weight="700" fill="#1a1a1a"><tspan font-family="'SF Mono',Menlo,monospace">scope : SqlValidatorScope</tspan></text>
    <text x="526" y="204" fill="#595959" font-size="9.5">名字解析语境（来自 Validator，只读，见第 07 篇）</text>

    <rect x="516" y="216" width="396" height="38" rx="4" fill="#ffffff" stroke="#1F4E79"/>
    <text x="526" y="233" font-weight="700" fill="#1a1a1a"><tspan font-family="'SF Mono',Menlo,monospace">subQueryList : List&lt;SubQuery&gt;</tspan></text>
    <text x="526" y="248" fill="#595959" font-size="9.5">本块内的 IN / EXISTS / 标量子查询，待物化</text>

    <rect x="516" y="260" width="396" height="38" rx="4" fill="#ffffff" stroke="#1F4E79"/>
    <text x="526" y="277" font-weight="700" fill="#1a1a1a"><tspan font-family="'SF Mono',Menlo,monospace">nameToNodeMap : Map&lt;String,RexNode&gt;</tspan></text>
    <text x="526" y="292" fill="#595959" font-size="9.5">表达式翻译模式下的参数绑定（默认 null）</text>

    <rect x="516" y="304" width="396" height="38" rx="4" fill="#ffffff" stroke="#1F4E79"/>
    <text x="526" y="321" font-weight="700" fill="#1a1a1a"><tspan font-family="'SF Mono',Menlo,monospace">mapCorrelateToRex : Map&lt;CorrelationId,..&gt;</tspan></text>
    <text x="526" y="336" fill="#595959" font-size="9.5">相关变量 $cor0 → RexFieldAccess（去关联的线索）</text>

    <rect x="516" y="348" width="396" height="38" rx="4" fill="#ffffff" stroke="#1F4E79"/>
    <text x="526" y="365" font-weight="700" fill="#1a1a1a"><tspan font-family="'SF Mono',Menlo,monospace">agg : AggConverter</tspan>  ·  <tspan font-family="'SF Mono',Menlo,monospace">window : SqlWindow</tspan></text>
    <text x="526" y="380" fill="#595959" font-size="9.5">聚合 / 窗口翻译时的临时上下文</text>
  </g>

  <text x="516" y="408" font-size="10.5" font-weight="700" fill="#7F3F00">关键不变量：root 永远指向"到目前为止"已转换的子树</text>
  <text x="516" y="426" font-size="10" fill="#595959">各 convertXxx 步骤读旧 root、用 RelBuilder 包一层、再 setRoot 写回</text>
  <text x="516" y="444" font-size="10" fill="#595959">— 这就是 Blackboard 模式：多个专家子程序读写同一块状态板</text>
  <text x="516" y="468" font-size="10" fill="#888">注：Blackboard 是 SqlToRelConverter 的内部类，可见外层字段</text>
  <text x="516" y="484" font-size="10" fill="#888">（cluster / rexBuilder / exprConverter / leaves ...）</text>

  <!-- Bottom: decorrelate -->
  <rect x="500" y="510" width="428" height="116" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.5"/>
  <text x="516" y="532" font-size="13" font-weight="700" fill="#833C0C">③ 收尾：全树后处理（convertQuery 之后由调用方驱动）</text>
  <rect x="516" y="544" width="190" height="32" rx="4" fill="#ffffff" stroke="#C65911"/>
  <text x="611" y="564" text-anchor="middle" font-size="11" fill="#833C0C">flattenTypes 结构展平</text>
  <rect x="722" y="544" width="190" height="32" rx="4" fill="#ffffff" stroke="#C65911"/>
  <text x="817" y="564" text-anchor="middle" font-size="11" fill="#833C0C">decorrelate 去关联 → 图 08-3</text>
  <rect x="516" y="584" width="396" height="32" rx="4" fill="#ffffff" stroke="#C65911"/>
  <text x="714" y="604" text-anchor="middle" font-size="11" fill="#833C0C">trimUnusedFields 列裁剪（RelFieldTrimmer）</text>

  <!-- cross arrows: stack reads/writes blackboard -->
  <line x1="438" y1="252" x2="500" y2="146" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="452" y="196" font-size="9.5" fill="#888" transform="rotate(-22 452 196)">读写 root</text>
  <line x1="438" y1="410" x2="500" y2="367" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <line x1="438" y1="543" x2="500" y2="235" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>

  <text x="480" y="660" text-anchor="middle" font-size="10" fill="#A6A6A6">图 08-1 — 蓝实线为调用下沉，灰虚线为对共享状态板的读写；橙色为入口/收尾热点</text>
</svg>
