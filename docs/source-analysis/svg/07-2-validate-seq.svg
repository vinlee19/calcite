<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="seqArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="seqArrBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#548235"/>
    </marker>
    <marker id="selfArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7030A0"/>
    </marker>
  </defs>

  <rect width="1000" height="880" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">validateSelect &#8594; resolve 链式查找时序</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#595959">以 SELECT d.name FROM emp e JOIN dept d ... WHERE e.sal &gt; 1000 为例：列引用如何被解析到 Namespace</text>

  <!-- Actors -->
  <g font-size="10.5" font-weight="700" fill="#ffffff">
    <rect x="20"  y="70" width="120" height="32" rx="6" fill="#595959"/><text x="80"  y="91" text-anchor="middle">validate()</text>
    <rect x="160" y="70" width="140" height="32" rx="6" fill="#1F4E79"/><text x="230" y="91" text-anchor="middle">SqlValidatorImpl</text>
    <rect x="320" y="70" width="140" height="32" rx="6" fill="#ED7D31"/><text x="390" y="91" text-anchor="middle">SelectScope</text>
    <rect x="480" y="70" width="130" height="32" rx="6" fill="#1F4E79"/><text x="545" y="91" text-anchor="middle">ListScope</text>
    <rect x="630" y="70" width="140" height="32" rx="6" fill="#1F4E79"/><text x="700" y="91" text-anchor="middle">DelegatingScope</text>
    <rect x="790" y="70" width="120" height="32" rx="6" fill="#595959"/><text x="850" y="91" text-anchor="middle">EmptyScope</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#BFBFBF" stroke-dasharray="3,4" stroke-width="1">
    <line x1="80"  y1="102" x2="80"  y2="828"/>
    <line x1="230" y1="102" x2="230" y2="828"/>
    <line x1="390" y1="102" x2="390" y2="828"/>
    <line x1="545" y1="102" x2="545" y2="828"/>
    <line x1="700" y1="102" x2="700" y2="828"/>
    <line x1="850" y1="102" x2="850" y2="828"/>
  </g>

  <!-- Namespace lifeline (second row) -->
  <g font-size="10.5" font-weight="700" fill="#ffffff">
    <rect x="630" y="470" width="190" height="28" rx="6" fill="#548235"/>
    <text x="725" y="489" text-anchor="middle">IdentifierNamespace</text>
  </g>
  <line x1="725" y1="498" x2="725" y2="828" stroke="#BFBFBF" stroke-dasharray="3,4"/>

  <!-- Activation bars -->
  <rect x="226" y="125" width="8" height="660" fill="#DEEBF7"/>
  <rect x="386" y="300" width="8" height="300" fill="#FBE5D6"/>

  <g font-size="10.5" fill="#1F4E79">
    <!-- 1 -->
    <line x1="80" y1="130" x2="226" y2="130" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="92" y="124" fill="#262626">1. validate(sqlNode) &#8594; validateScopedExpression</text>

    <!-- 2 registerQuery -->
    <line x1="234" y1="160" x2="386" y2="160" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="240" y="154" fill="#262626">2. registerQuery: new SelectScope + new SelectNamespace</text>
    <text x="240" y="174" fill="#7030A0" font-size="9">    scopes.put(select, selectScope) · namespaces.put(select, selectNs)</text>

    <!-- 3 validateNamespace -->
    <line x1="234" y1="200" x2="386" y2="200" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="240" y="194" fill="#262626">3. validateNamespace(selectNs) &#8594; validateSelect(select, target)</text>

    <!-- 4 validateFrom registers children -->
    <line x1="234" y1="232" x2="386" y2="232" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="240" y="226" fill="#262626">4. validateFrom: addChild(emp e), addChild(dept d)</text>
    <text x="240" y="246" fill="#595959" font-size="9">    &#8594; SelectScope.children = [ e:IdNs, d:IdNs ]</text>

    <!-- 5 validateWhere: deriveType e.sal -->
    <line x1="234" y1="280" x2="386" y2="280" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="240" y="274" fill="#262626">5. validateWhereClause: deriveType(whereScope, "e.sal &gt; 1000")</text>

    <!-- 6 fullyQualify e.sal -> resolve -->
    <line x1="394" y1="316" x2="543" y2="316" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="400" y="310" fill="#262626">6. fullyQualify("e.sal") &#8594; resolve(["e"], matcher, deep, resolved)</text>

    <!-- 7 ListScope.findChild -->
    <line x1="553" y1="348" x2="553" y2="372" stroke="#7030A0" stroke-width="1.3" marker-end="url(#selfArr)"/>
    <path d="M553,348 L600,348 L600,372 L557,372" fill="none" stroke="#7030A0" stroke-width="1.3" stroke-dasharray="4,2"/>
    <text x="500" y="364" fill="#7030A0" font-size="9.5">7. findChild(["e"]): 命中别名 e &#8594; ScopeChild(e)</text>

    <!-- 8 resolved.found -->
    <line x1="545" y1="402" x2="234" y2="402" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="240" y="396" fill="#385723">8. &#8592; resolved.found(empNamespace, this, path)  — 命中，停止上溯</text>

    <!-- 9 case: column not local -> super.resolve -> parent -->
    <rect x="200" y="424" width="700" height="120" fill="none" stroke="#7030A0" stroke-width="1.2" stroke-dasharray="6,3" rx="6"/>
    <text x="208" y="440" font-size="9.5" font-weight="700" fill="#7030A0">alt  [若本层 children 未命中：委托父 scope（支持子查询引用外层列）]</text>

    <!-- 9a ListScope.resolve -> super (Delegating) -->
    <line x1="553" y1="460" x2="698" y2="460" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="560" y="454" fill="#262626">9. super.resolve(...) &#8594; parent.resolve(...)</text>

    <!-- 9b chain to EmptyScope -->
    <line x1="708" y1="510" x2="848" y2="510" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="640" y="504" fill="#262626">10. ... &#8594; EmptyScope.resolveTable(catalog/schema)</text>
    <line x1="848" y1="534" x2="234" y2="534" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="240" y="528" fill="#385723">11. &#8592; 仍未命中则 RESOURCE.columnNotFound（带源位置）</text>

    <!-- 12 getRowType lazy on namespace -->
    <line x1="394" y1="568" x2="723" y2="568" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="400" y="562" fill="#262626">12. Resolve.rowType(): empNamespace.getRowType()  — 首次触发懒求值</text>
    <line x1="725" y1="592" x2="394" y2="592" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="400" y="586" fill="#385723">13. &#8592; RECORD(empno, ename, sal, deptno, ...)；status: UNVALIDATED&#8594;VALID</text>

    <!-- 14 field lookup -->
    <line x1="394" y1="624" x2="234" y2="624" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="240" y="618" fill="#385723">14. &#8592; SqlQualified(emp.sal, namespace=empNs) — 改写回 AST</text>

    <!-- 15 validateSelectList late -->
    <line x1="234" y1="656" x2="386" y2="656" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="240" y="650" fill="#262626">15. validateSelectList("d.name") — SELECT 列延后校验（依赖 GROUP BY/窗口）</text>

    <!-- 16 ns.setType -->
    <line x1="234" y1="688" x2="234" y2="712" stroke="#7030A0" stroke-width="1.3" marker-end="url(#selfArr)"/>
    <path d="M234,688 L280,688 L280,712 L238,712" fill="none" stroke="#7030A0" stroke-width="1.3" stroke-dasharray="4,2"/>
    <text x="240" y="704" fill="#7030A0" font-size="9.5">16. ns.setType(rowType): SelectNamespace.rowType 落定</text>

    <!-- 17 validateOrderList -->
    <line x1="234" y1="740" x2="386" y2="740" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="240" y="734" fill="#262626">17. validateOrderList: ORDER BY 在 setType 之后，才可引用 SELECT 别名</text>

    <!-- 18 done -->
    <line x1="226" y1="772" x2="80" y2="772" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="92" y="766" fill="#385723">18. &#8592; validated SqlNode（含 namespace + 每节点类型）</text>
  </g>

  <text x="500" y="858" text-anchor="middle" font-size="10" fill="#A6A6A6">图 07-2 — 蓝色为正向调用，绿色虚线为返回，紫色为自调用/分支框；resolve 沿 parent 链上溯，getRowType 首触发懒求值</text>
</svg>
