<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="hit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#548235"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">Convertlet 分层查找：instance → class → expr-class</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">ReflectiveConvertletTable.get(call) 三级回退；命中即返回，从特化到通用</text>

  <!-- Input -->
  <rect x="350" y="72" width="260" height="56" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="480" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7F6000">输入：SqlCall call</text>
  <text x="480" y="113" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">op = call.getOperator()</text>

  <!-- Stage 1: instance -->
  <rect x="60" y="158" width="840" height="84" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="78" y="180" font-size="13" font-weight="700" fill="#1F4E79">① 算子实例查找  map.get(op)</text>
  <text x="78" y="200" font-size="10.5" fill="#595959">命中条件：该算子单例被 registerOp 显式登记（如 CAST、PLUS、AVG、NOT_LIKE）</text>
  <text x="78" y="218" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#595959">registerOp(SqlStdOperatorTable.CAST, this::convertCast)</text>
  <text x="78" y="234" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#595959">addAlias(LEN, CHAR_LENGTH)  // 别名也是按实例登记</text>
  <rect x="700" y="170" width="186" height="58" rx="6" fill="#FBE5D6" stroke="#C65911"/>
  <text x="793" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#833C0C">最特化</text>
  <text x="793" y="210" text-anchor="middle" font-size="9.5" fill="#833C0C">同名不同义算子可</text>
  <text x="793" y="223" text-anchor="middle" font-size="9.5" fill="#833C0C">各登记各的 convertlet</text>

  <!-- Stage 2: operator class -->
  <rect x="60" y="282" width="840" height="92" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="78" y="304" font-size="13" font-weight="700" fill="#1F4E79">② 算子类查找  沿 op.getClass() 向父类爬</text>
  <text x="78" y="324" font-size="10.5" fill="#595959">未命中实例时，按 op 的运行期类逐级 getSuperclass() 查找</text>
  <text x="78" y="342" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#595959">SqlSpecialOperator → SqlBinaryOperator → SqlOperator → ...</text>
  <text x="78" y="360" font-size="10" fill="#595959">命中条件：为"某一族算子"统一登记（按类而非实例）</text>
  <rect x="700" y="294" width="186" height="64" rx="6" fill="#F2F2F2" stroke="#595959"/>
  <text x="793" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">按族复用</text>
  <text x="793" y="334" text-anchor="middle" font-size="9.5" fill="#595959">一类算子共享一套</text>
  <text x="793" y="347" text-anchor="middle" font-size="9.5" fill="#595959">转换逻辑，免逐个登记</text>

  <!-- Stage 3: expr class -->
  <rect x="60" y="414" width="840" height="92" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="78" y="436" font-size="13" font-weight="700" fill="#1F4E79">③ 表达式类查找  沿 call.getClass() 向父类爬</text>
  <text x="78" y="456" font-size="10.5" fill="#595959">仍未命中时，按 SqlCall 的运行期类逐级查找（最后兜底）</text>
  <text x="78" y="474" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#595959">SqlBasicCall → SqlCall ...  → 默认 convertCall(cx, call)</text>
  <text x="78" y="492" font-size="10" fill="#595959">默认实现：递归转操作数 + rexBuilder.makeCall / deriveReturnType</text>
  <rect x="700" y="426" width="186" height="64" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="793" y="448" text-anchor="middle" font-size="11" font-weight="700" fill="#385723">通用兜底</text>
  <text x="793" y="466" text-anchor="middle" font-size="9.5" fill="#385723">标准表对所有调用</text>
  <text x="793" y="479" text-anchor="middle" font-size="9.5" fill="#385723">都有 fall-back，不会漏</text>

  <!-- Output -->
  <rect x="320" y="546" width="320" height="58" rx="8" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="480" y="568" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">convertlet.convertCall(cx, call) → RexNode</text>
  <text x="480" y="589" text-anchor="middle" font-size="10" fill="#FFF2CC">cx = Blackboard（提供 rexBuilder / convertExpression / validator）</text>

  <!-- flow arrows down (miss) -->
  <line x1="480" y1="128" x2="480" y2="158" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="300" y1="242" x2="300" y2="282" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="312" y="266" font-size="10" fill="#595959">未命中 ↓</text>
  <line x1="300" y1="374" x2="300" y2="414" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="312" y="398" font-size="10" fill="#595959">未命中 ↓</text>

  <!-- hit arrows to output (green) -->
  <line x1="640" y1="200" x2="660" y2="200" stroke="#548235" stroke-width="1.4" stroke-dasharray="5,3"/>
  <path d="M660,200 L660,575 L636,575" fill="none" stroke="#548235" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#hit)"/>
  <text x="666" y="392" font-size="10" fill="#385723" transform="rotate(90 666 392)">命中即返回（任一级）</text>

  <!-- code note -->
  <rect x="60" y="624" width="840" height="50" rx="6" fill="#F2F2F2" stroke="#BFBFBF"/>
  <text x="74" y="644" font-size="10.5" font-weight="700" fill="#262626">为什么是"三级 + 沿父类爬"？</text>
  <text x="74" y="662" font-size="10" fill="#595959">支持继承式重载：特化算子可覆盖父类规则；标准表对所有 SqlCall 都有兜底，调用方无需判空（除极端 needToImplement）。</text>

  <text x="480" y="692" text-anchor="middle" font-size="10" fill="#A6A6A6">图 08-2 — 蓝实线为未命中下沉，绿虚线为命中返回；橙色为最终产出 RexNode</text>
</svg>
