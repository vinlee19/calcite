<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="seqArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="seqArrBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#548235"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">accept → visit：双重分派（double dispatch）</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#595959">节点类型 × 访问者类型 = 在编译期就选准的两层多态；Visitor 新增算法无需改 SqlNode</text>

  <!-- Actors -->
  <g font-size="11" font-weight="700" fill="#ffffff">
    <rect x="40"  y="70" width="150" height="32" rx="6" fill="#595959"/><text x="115" y="91" text-anchor="middle">调用方 (caller)</text>
    <rect x="250" y="70" width="150" height="32" rx="6" fill="#1F4E79"/><text x="325" y="91" text-anchor="middle">SqlCall (节点)</text>
    <rect x="460" y="70" width="170" height="32" rx="6" fill="#ED7D31"/><text x="545" y="91" text-anchor="middle">SqlVisitor&lt;R&gt; (访问者)</text>
    <rect x="690" y="70" width="150" height="32" rx="6" fill="#1F4E79"/><text x="765" y="91" text-anchor="middle">SqlOperator</text>
    <rect x="870" y="70" width="100" height="32" rx="6" fill="#1F4E79"/><text x="920" y="91" text-anchor="middle">operand</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#BFBFBF" stroke-dasharray="3,4" stroke-width="1">
    <line x1="115" y1="102" x2="115" y2="720"/>
    <line x1="325" y1="102" x2="325" y2="720"/>
    <line x1="545" y1="102" x2="545" y2="720"/>
    <line x1="765" y1="102" x2="765" y2="720"/>
    <line x1="920" y1="102" x2="920" y2="720"/>
  </g>

  <!-- Activation bars -->
  <rect x="321" y="135" width="8" height="120" fill="#DEEBF7"/>
  <rect x="541" y="175" width="8" height="430" fill="#FCE4D6"/>
  <rect x="761" y="300" width="8" height="250" fill="#DEEBF7"/>

  <g font-size="11">
    <!-- 1. accept -->
    <line x1="115" y1="150" x2="321" y2="150" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="124" y="144" fill="#262626">1. node.accept(visitor)</text>
    <text x="124" y="166" fill="#888" font-size="9">第一次分派：选中 SqlCall 的 accept 重写版本（按节点类型）</text>

    <!-- 2. visit(this) -->
    <line x1="329" y1="200" x2="541" y2="200" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="338" y="194" fill="#262626">2. return visitor.visit(this)</text>
    <text x="338" y="216" fill="#888" font-size="9">第二次分派：this 的静态类型 SqlCall 选中 visit(SqlCall)（按访问者重载）</text>

    <!-- 3. inside basic visitor: acceptCall -->
    <line x1="549" y1="320" x2="761" y2="320" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="558" y="314" fill="#262626">3. call.getOperator().acceptCall(this, call)</text>
    <text x="558" y="336" fill="#888" font-size="9">SqlBasicVisitor.visit(SqlCall) 默认把遍历委托给 operator</text>

    <!-- 4. operator loops operands -->
    <line x1="769" y1="380" x2="916" y2="380" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="778" y="374" fill="#262626">4. operand.accept(this)</text>

    <!-- recurse note inside loop -->
    <line x1="916" y1="430" x2="549" y2="430" stroke="#1F4E79" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#seqArr)"/>
    <text x="560" y="424" fill="#1F4E79" font-size="9.5">5. 子节点再次 accept→visit（递归下钻整棵子树）</text>

    <!-- returns -->
    <line x1="916" y1="478" x2="769" y2="478" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="778" y="472" fill="#385723">6. &#8592; R（每个操作数的结果）</text>

    <line x1="761" y1="548" x2="549" y2="548" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="558" y="542" fill="#385723">7. &#8592; R（acceptCall 聚合结果，默认取最后一个）</text>

    <line x1="541" y1="600" x2="329" y2="600" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="338" y="594" fill="#385723">8. &#8592; R（visit 返回）</text>

    <line x1="321" y1="640" x2="115" y2="640" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="124" y="634" fill="#385723">9. &#8592; R（accept 返回最终结果）</text>
  </g>

  <!-- loop frame around operand iteration -->
  <rect x="740" y="362" width="240" height="130" fill="none" stroke="#7030A0" stroke-width="1.2" stroke-dasharray="6,3" rx="6"/>
  <text x="748" y="376" font-size="10" font-weight="700" fill="#7030A0">loop [每个 operand]</text>

  <!-- explanation box -->
  <rect x="40" y="666" width="920" height="56" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="52" y="684" font-size="10.5" font-weight="700" fill="#262626">为什么两次分派？</text>
  <text x="52" y="700" font-size="9.5" fill="#262626">Java 单分派只按接收者类型选方法。accept(虚方法，按节点)→visit 重载(按访问者参数)，两步合起来等价于"节点×访问者"双分派。</text>
  <text x="52" y="714" font-size="9.5" fill="#262626">收益：SqlShuttle / 取列引用 / 找子查询等算法都是独立 Visitor，新增算法不动 SqlNode 家族（开闭原则）。</text>

  <text x="500" y="748" text-anchor="middle" font-size="10" fill="#A6A6A6">图 03-3 — 蓝实线为正向调用，绿虚线为返回，紫虚框为 operand 迭代；橙色生命线为访问者，整棵 AST 被递归遍历</text>
</svg>
