<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#595959" stroke-width="1"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="920" height="660" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">linq4j Enumerable/Enumerator  vs  JDK Iterable/Iterator</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#595959">moveNext()+current() 拆开 hasNext()+next()，并补上 reset() 与 AutoCloseable.close()</text>

  <!-- ========== LEFT: JDK side ========== -->
  <text x="225" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#595959">JDK 标准库（java.util）</text>
  <rect x="40" y="96" width="370" height="2" fill="#BFBFBF"/>

  <!-- Iterable -->
  <rect x="80" y="116" width="290" height="70" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.6"/>
  <text x="225" y="135" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187;</text>
  <text x="225" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">Iterable&lt;T&gt;</text>
  <line x1="92" y1="160" x2="358" y2="160" stroke="#548235" stroke-width="0.8"/>
  <text x="100" y="178" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">iterator() : Iterator&lt;T&gt;</text>

  <!-- Iterator -->
  <rect x="80" y="236" width="290" height="118" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.6"/>
  <text x="225" y="255" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187;</text>
  <text x="225" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">Iterator&lt;T&gt;</text>
  <line x1="92" y1="280" x2="358" y2="280" stroke="#548235" stroke-width="0.8"/>
  <text x="100" y="299" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">hasNext() : boolean</text>
  <text x="100" y="316" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">next() : T   &#171;前进且返回，有副作用&#187;</text>
  <text x="100" y="335" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#888888">(无 close / 无 reset)</text>

  <!-- ========== RIGHT: linq4j side ========== -->
  <text x="685" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">linq4j（org.apache.calcite.linq4j）</text>
  <rect x="500" y="96" width="380" height="2" fill="#1F4E79"/>

  <!-- RawEnumerable -->
  <rect x="510" y="116" width="180" height="62" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.6"/>
  <text x="600" y="134" text-anchor="middle" font-size="10" fill="#385723">&#171;interface&#187;</text>
  <text x="600" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">RawEnumerable&lt;T&gt;</text>
  <line x1="520" y1="156" x2="680" y2="156" stroke="#548235" stroke-width="0.8"/>
  <text x="526" y="172" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#385723">enumerator():Enumerator</text>

  <!-- ExtendedEnumerable -->
  <rect x="700" y="116" width="170" height="62" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.6"/>
  <text x="785" y="134" text-anchor="middle" font-size="10" fill="#385723">&#171;interface&#187;</text>
  <text x="785" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#385723">ExtendedEnumerable</text>
  <line x1="710" y1="156" x2="860" y2="156" stroke="#548235" stroke-width="0.8"/>
  <text x="716" y="172" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#385723">where/select/join …</text>

  <!-- Enumerable (combines) -->
  <rect x="560" y="236" width="270" height="86" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2"/>
  <text x="695" y="255" text-anchor="middle" font-size="10" fill="#1F4E79">&#171;interface&#187;</text>
  <text x="695" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">Enumerable&lt;T&gt;</text>
  <line x1="572" y1="280" x2="818" y2="280" stroke="#1F4E79" stroke-width="0.8"/>
  <text x="580" y="299" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">extends RawEnumerable, Iterable,</text>
  <text x="580" y="313" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">         ExtendedEnumerable</text>

  <!-- Enumerator (HOTSPOT) -->
  <rect x="510" y="372" width="370" height="170" rx="6" fill="#ED7D31" stroke="#7F3F00" stroke-width="2"/>
  <text x="695" y="392" text-anchor="middle" font-size="10" fill="#FFF2CC">&#171;interface  extends AutoCloseable&#187;</text>
  <text x="695" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Enumerator&lt;T&gt;</text>
  <line x1="522" y1="418" x2="868" y2="418" stroke="#FFF2CC" stroke-width="0.8"/>
  <text x="532" y="438" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#ffffff">moveNext() : boolean   &#171;只前进，告知成败&#187;</text>
  <text x="532" y="458" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#ffffff">current() : T          &#171;只读，幂等可重读&#187;</text>
  <text x="532" y="478" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#ffffff">reset() : void         &#171;可选，回到起点重扫&#187;</text>
  <text x="532" y="498" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#ffffff">close() : void         &#171;释放文件/连接/堆外&#187;</text>
  <text x="532" y="524" font-size="9" fill="#FFF2CC">读/进分离 + 可关闭 + 可重扫 = 流水线算子的设计前提</text>

  <!-- Abstract impls (concrete classes) -->
  <rect x="560" y="572" width="130" height="40" rx="5" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="625" y="588" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">AbstractEnumerable</text>
  <text x="625" y="603" text-anchor="middle" font-size="8.5" fill="#595959">默认实现基类</text>
  <rect x="700" y="572" width="130" height="40" rx="5" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="765" y="588" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">DefaultEnumerable</text>
  <text x="765" y="603" text-anchor="middle" font-size="8.5" fill="#595959">foreach: try-with-res</text>

  <!-- inheritance arrows (linq4j) -->
  <line x1="600" y1="178" x2="640" y2="234" stroke="#595959" stroke-width="1.3" marker-end="url(#inh)"/>
  <line x1="785" y1="178" x2="745" y2="234" stroke="#595959" stroke-width="1.3" marker-end="url(#inh)"/>
  <line x1="625" y1="572" x2="660" y2="324" stroke="#595959" stroke-width="1.3" marker-end="url(#inh)"/>

  <!-- Enumerable holds Enumerator (ref) -->
  <line x1="640" y1="322" x2="660" y2="370" stroke="#888888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="668" y="350" font-size="9" fill="#888888">enumerator()</text>

  <!-- Enumerable extends Iterable (cross-bridge) -->
  <line x1="560" y1="278" x2="370" y2="160" stroke="#595959" stroke-width="1.3" marker-end="url(#inh)"/>
  <text x="408" y="214" font-size="9.5" font-weight="700" fill="#1F4E79">extends Iterable</text>
  <text x="408" y="228" font-size="8.5" fill="#595959">→ 可直接用于 foreach</text>

  <!-- compare bridge: moveNext vs hasNext+next -->
  <line x1="410" y1="300" x2="508" y2="430" stroke="#888888" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="360" y="380" font-size="9.5" font-weight="700" fill="#C65911">对比：</text>
  <text x="360" y="396" font-size="9" fill="#595959">hasNext()+next()</text>
  <text x="378" y="410" font-size="9" fill="#595959">拆成</text>
  <text x="360" y="424" font-size="9" fill="#C65911">moveNext()+current()</text>

  <!-- ===== Legend ===== -->
  <g>
    <rect x="40" y="396" width="300" height="146" rx="6" fill="#F2F2F2" stroke="#BFBFBF"/>
    <text x="52" y="414" font-size="11" font-weight="700" fill="#262626">图例</text>
    <rect x="52" y="424" width="22" height="14" rx="2" fill="#E2EFDA" stroke="#548235"/>
    <text x="82" y="435" font-size="10" fill="#385723">interface 接口</text>
    <rect x="52" y="444" width="22" height="14" rx="2" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="82" y="455" font-size="10" fill="#1F4E79">linq4j 核心接口</text>
    <rect x="52" y="464" width="22" height="14" rx="2" fill="#ED7D31" stroke="#7F3F00"/>
    <text x="82" y="475" font-size="10" fill="#7F3F00">关键热点（本篇重心）</text>
    <rect x="52" y="484" width="22" height="14" rx="2" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="82" y="495" font-size="10" fill="#1a1a1a">具体/抽象类</text>
    <line x1="52" y1="510" x2="74" y2="510" stroke="#595959" stroke-width="1.3" marker-end="url(#inh)"/>
    <text x="82" y="514" font-size="10" fill="#595959">继承 / 实现（空心三角）</text>
    <line x1="52" y1="528" x2="74" y2="528" stroke="#888888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
    <text x="82" y="532" font-size="10" fill="#888888">引用 / 持有（虚线箭头）</text>
  </g>

  <text x="460" y="648" text-anchor="middle" font-size="10" fill="#A6A6A6">图 15-1 — 左为 JDK，右为 linq4j；Enumerable 兼容 Iterable，Enumerator 用读/进分离 + close/reset 超越 Iterator</text>
</svg>
