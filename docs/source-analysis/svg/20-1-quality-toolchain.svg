<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrowGate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
    <linearGradient id="bgStage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">Calcite 质量工具链：一次 ./gradlew check 串起的关卡</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#595959">编译期门（左→右）+ 测试期门 + 发布期门；任一关卡红灯即 fail，CI 与本地同一套</text>

  <!-- compile time gate row -->
  <text x="40" y="92" font-size="13" font-weight="700" fill="#1F4E79">① 编译期门 — 都挂在 JavaCompile / Verification 任务上</text>

  <!-- Stage boxes -->
  <g>
    <rect x="40" y="106" width="138" height="74" rx="8" fill="url(#bgStage)" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="109" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">javac -Werror</text>
    <text x="109" y="148" text-anchor="middle" font-size="9.5" fill="#385723">werror=true</text>
    <text x="109" y="163" text-anchor="middle" font-size="9.5" fill="#595959">deprecation/</text>
    <text x="109" y="175" text-anchor="middle" font-size="9.5" fill="#595959">unchecked → 红灯</text>

    <rect x="198" y="106" width="138" height="74" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
    <text x="267" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">Checker FW</text>
    <text x="267" y="148" text-anchor="middle" font-size="9.5" fill="#595959">NullnessChecker</text>
    <text x="267" y="163" text-anchor="middle" font-size="9.5" fill="#595959">@Nullable 全程</text>
    <text x="267" y="175" text-anchor="middle" font-size="9.5" fill="#595959">推断 NPE</text>

    <rect x="356" y="106" width="138" height="74" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
    <text x="425" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">Error Prone</text>
    <text x="425" y="148" text-anchor="middle" font-size="9.5" fill="#595959">字节码模式 bug</text>
    <text x="425" y="163" text-anchor="middle" font-size="9.5" fill="#595959">MethodCanBeStatic</text>
    <text x="425" y="175" text-anchor="middle" font-size="9.5" fill="#595959">+ guava-beta-checker</text>

    <rect x="514" y="106" width="138" height="74" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
    <text x="583" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">forbiddenapis</text>
    <text x="583" y="148" text-anchor="middle" font-size="9.5" fill="#595959">signatures.txt</text>
    <text x="583" y="163" text-anchor="middle" font-size="9.5" fill="#595959">禁 toLowerCase()</text>
    <text x="583" y="175" text-anchor="middle" font-size="9.5" fill="#595959">禁 wait/notify…</text>

    <rect x="672" y="106" width="120" height="74" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="732" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">autostyle</text>
    <text x="732" y="148" text-anchor="middle" font-size="9.5" fill="#595959">license 头</text>
    <text x="732" y="163" text-anchor="middle" font-size="9.5" fill="#595959">import 顺序</text>
    <text x="732" y="175" text-anchor="middle" font-size="9.5" fill="#595959">jsr305→checker</text>

    <rect x="812" y="106" width="108" height="74" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="866" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">checkstyle</text>
    <text x="866" y="148" text-anchor="middle" font-size="9.5" fill="#595959">checker.xml</text>
    <text x="866" y="163" text-anchor="middle" font-size="9.5" fill="#595959">命名/缩进/</text>
    <text x="866" y="175" text-anchor="middle" font-size="9.5" fill="#595959">EqualsHashCode</text>

    <!-- arrows -->
    <line x1="178" y1="143" x2="198" y2="143" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="336" y1="143" x2="356" y2="143" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="494" y1="143" x2="514" y2="143" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="652" y1="143" x2="672" y2="143" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="792" y1="143" x2="812" y2="143" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <text x="40" y="200" font-size="10" fill="#888">注：Checker / Error Prone 为可选开关（-PenableCheckerframework / -PenableErrorprone），CI 全开；werror 默认开。</text>

  <!-- test time gate -->
  <text x="40" y="238" font-size="13" font-weight="700" fill="#1F4E79">② 测试期门 — forked JVM + 受控 locale</text>
  <g>
    <rect x="40" y="252" width="200" height="96" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="140" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">test (JUnit5)</text>
    <text x="56" y="294" font-size="10" fill="#595959">parallel.enabled = true</text>
    <text x="56" y="310" font-size="10" fill="#595959">timeout.default = 5 m</text>
    <text x="56" y="326" font-size="10" fill="#595959">excludeTags("slow")</text>
    <text x="56" y="342" font-size="10" fill="#595959">-Xmx1536m / 每模块 fork</text>

    <rect x="260" y="252" width="200" height="96" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.5"/>
    <text x="360" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">受控环境（暴露 i18n bug）</text>
    <text x="276" y="294" font-size="10" fill="#FFF2CC">user.language = TR</text>
    <text x="276" y="310" font-size="10" fill="#FFF2CC">user.country  = tr</text>
    <text x="276" y="326" font-size="10" fill="#FFF2CC">user.timezone = UTC</text>
    <text x="276" y="342" font-size="10" fill="#FFF2CC">土耳其 i / 大小写陷阱</text>

    <rect x="480" y="252" width="220" height="96" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="590" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">passProperty 白名单</text>
    <text x="496" y="294" font-size="10" fill="#595959">只转发 calcite.* / avatica.*</text>
    <text x="496" y="310" font-size="10" fill="#595959">+ 固定 allow-list</text>
    <text x="496" y="326" font-size="10" fill="#595959">任意 -Dfoo=bar 进不去 fork</text>
    <text x="496" y="342" font-size="10" fill="#888">坑：调试属性必须带前缀</text>

    <rect x="720" y="252" width="200" height="96" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="820" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">分层测试任务</text>
    <text x="736" y="294" font-size="10" fill="#595959">testSlow (@Tag slow,-Xmx6g)</text>
    <text x="736" y="310" font-size="10" fill="#595959">testHepLargePlanMode</text>
    <text x="736" y="326" font-size="10" fill="#595959">integTest* (Vagrant VM)</text>
    <text x="736" y="342" font-size="10" fill="#595959">outputs 不缓存</text>

    <line x1="240" y1="300" x2="260" y2="300" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="460" y1="300" x2="480" y2="300" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="700" y1="300" x2="720" y2="300" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- release time gate -->
  <text x="40" y="386" font-size="13" font-weight="700" fill="#1F4E79">③ 发布期门 — 治理与合规</text>
  <g>
    <rect x="40" y="400" width="180" height="78" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
    <text x="130" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#262626">RAT 许可证扫描</text>
    <text x="56" y="442" font-size="10" fill="#595959">每文件须有 ASF 头</text>
    <text x="56" y="458" font-size="10" fill="#595959">.ratignore 排除清单</text>
    <text x="56" y="473" font-size="10" fill="#595959">validateBeforeRelease 依赖</text>

    <rect x="240" y="400" width="180" height="78" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
    <text x="330" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#262626">jandex / 可复现 jar</text>
    <text x="256" y="442" font-size="10" fill="#595959">preserveFileTimestamps=false</text>
    <text x="256" y="458" font-size="10" fill="#595959">reproducibleFileOrder</text>
    <text x="256" y="473" font-size="10" fill="#595959">注入 LICENSE/NOTICE</text>

    <rect x="440" y="400" width="180" height="78" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
    <text x="530" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#262626">SpotBugs（按需）</text>
    <text x="456" y="442" font-size="10" fill="#595959">-Pspotbugs 才启用</text>
    <text x="456" y="458" font-size="10" fill="#595959">reportLevel = high</text>
    <text x="456" y="473" font-size="10" fill="#595959">只扫 main，不扫 test</text>

    <rect x="640" y="400" width="180" height="78" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
    <text x="730" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#262626">Jacoco / Sonar（按需）</text>
    <text x="656" y="442" font-size="10" fill="#595959">-PenableJacoco</text>
    <text x="656" y="458" font-size="10" fill="#595959">XML 报告给 Sonar</text>
    <text x="656" y="473" font-size="10" fill="#595959">dependencyCheck (OWASP)</text>
  </g>

  <!-- gate summary -->
  <rect x="40" y="506" width="880" height="100" rx="10" fill="#FBE5D6" stroke="#C65911" stroke-width="1.5"/>
  <text x="60" y="530" font-size="13" font-weight="700" fill="#833C0C">关卡聚合：./gradlew check = autostyleCheck + checkstyleAll + test；./gradlew build = check + assemble</text>
  <text x="60" y="552" font-size="11" fill="#7F3F00">设计取舍：把"风格 / 空安全 / 字节码反模式 / 禁用 API / 许可证"全部前移到 build 关卡，让 reviewer 只看逻辑。</text>
  <text x="60" y="572" font-size="11" fill="#7F3F00">代价：CI 时间长、首次贡献门槛高（一处空格即红灯）→ 用 ./gradlew style 自动修复 + autostyleApply 兜底。</text>
  <text x="60" y="592" font-size="11" fill="#7F3F00">可借鉴：werror + forbiddenapis 是"零妥协"质量基线最低成本实现，无需自研 lint 即可锁死团队约定。</text>

  <text x="480" y="640" text-anchor="middle" font-size="10" fill="#A6A6A6">图 20-1 — 蓝箭头为编译期/测试期串行关卡；橙色块为最关键的 TR-locale 受控环境；灰底为发布期治理</text>
</svg>
