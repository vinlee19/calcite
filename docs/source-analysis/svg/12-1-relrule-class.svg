<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1F4E79" stroke-width="1"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>

  <rect width="920" height="720" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">RelRule 继承体系与 Immutables 配置对象</text>
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#595959">规则 = 不可变 Config（声明 operand + 参数）+ onMatch（变换逻辑）；新规则一律继承 RelRule，而非旧式 RelOptRule</text>

  <!-- RelOptRule (abstract, legacy base) -->
  <rect x="330" y="76" width="260" height="78" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="460" y="96" text-anchor="middle" font-size="11" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="460" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#7F6000">RelOptRule</text>
  <text x="345" y="132" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">+ operands: List&lt;RelOptRuleOperand&gt;</text>
  <text x="345" y="146" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">+ abstract onMatch(RelOptRuleCall)</text>

  <!-- RelRule (abstract) -->
  <rect x="330" y="196" width="260" height="86" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="460" y="216" text-anchor="middle" font-size="11" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="460" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#7F6000">RelRule&lt;C extends Config&gt;</text>
  <text x="345" y="252" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">+ final config: C</text>
  <text x="345" y="266" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">protected RelRule(C config)</text>
  <text x="345" y="278" font-size="8.5" fill="#A6A6A6">把 config.operandSupplier() 解析成 operand 树传给父类</text>

  <!-- RelRule extends RelOptRule -->
  <line x1="460" y1="196" x2="460" y2="154" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>

  <!-- Config interface (right of RelRule) -->
  <rect x="636" y="186" width="260" height="150" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="766" y="206" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187; @Value.Immutable</text>
  <text x="766" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">RelRule.Config</text>
  <line x1="646" y1="230" x2="886" y2="230" stroke="#548235" stroke-width="0.8"/>
  <text x="650" y="246" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">RelOptRule toRule()</text>
  <text x="650" y="260" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">OperandTransform operandSupplier()</text>
  <text x="650" y="274" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">RelBuilderFactory relBuilderFactory()</text>
  <text x="650" y="288" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">String description()</text>
  <text x="650" y="304" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">Config withOperandSupplier(..)</text>
  <text x="650" y="318" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">Config withDescription(..)  &#8230;</text>
  <text x="650" y="331" font-size="8.5" fill="#888">with* 返回新对象 = 流式构造</text>

  <!-- RelRule holds config: dashed ref -->
  <line x1="590" y1="240" x2="636" y2="240" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="595" y="234" font-size="9" fill="#888">config</text>

  <!-- Immutables generated class -->
  <rect x="636" y="368" width="260" height="74" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="766" y="388" text-anchor="middle" font-size="11" fill="#262626">&#171;generated by APT&#187;</text>
  <text x="766" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#262626">ImmutableProjectMergeRule.Config</text>
  <text x="650" y="423" font-size="8.5" fill="#595959">注解处理器据 @Value.Immutable 生成</text>
  <text x="650" y="435" font-size="8.5" fill="#595959">equals/hashCode/builder/with* 实现</text>

  <!-- generated implements Config -->
  <line x1="766" y1="368" x2="766" y2="336" stroke="#1F4E79" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#inh)"/>
  <text x="772" y="354" font-size="8.5" fill="#888">implements</text>

  <!-- Concrete rule subclasses -->
  <!-- ConverterRule -->
  <rect x="40" y="340" width="240" height="92" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="160" y="360" text-anchor="middle" font-size="11" fill="#7F6000">&#171;abstract&#187; @Value.Enclosing</text>
  <text x="160" y="377" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7F6000">ConverterRule</text>
  <text x="52" y="396" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">- inTrait / outTrait: RelTrait</text>
  <text x="52" y="410" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">+ abstract convert(RelNode)</text>
  <text x="52" y="424" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">onMatch &#8594; convert &#8594; transformTo</text>

  <!-- FilterJoinRule -->
  <rect x="40" y="470" width="240" height="78" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="160" y="490" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">FilterJoinRule&lt;C&gt;</text>
  <text x="52" y="508" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">implements TransformationRule</text>
  <text x="52" y="522" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">perform(call, filter?, join)</text>
  <text x="52" y="538" font-size="8.5" fill="#A6A6A6">内含 FilterIntoJoinRule / JoinConditionPushRule</text>

  <!-- ProjectMergeRule -->
  <rect x="300" y="470" width="240" height="78" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="420" y="490" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">ProjectMergeRule</text>
  <text x="312" y="508" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">implements TransformationRule</text>
  <text x="312" y="522" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">Config: bloat() / force()</text>
  <text x="312" y="538" font-size="8.5" fill="#A6A6A6">单类 + 参数化配置代替多个子类</text>

  <!-- inheritance to RelRule -->
  <line x1="160" y1="340" x2="160" y2="239" stroke="#1F4E79" stroke-width="1.2"/>
  <line x1="160" y1="239" x2="330" y2="239" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <line x1="160" y1="470" x2="160" y2="432" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <line x1="420" y1="470" x2="420" y2="270" stroke="#1F4E79" stroke-width="1.2"/>
  <line x1="420" y1="270" x2="590" y2="262" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>

  <!-- TransformationRule marker interface -->
  <rect x="300" y="596" width="240" height="56" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="420" y="616" text-anchor="middle" font-size="11" fill="#385723">&#171;marker interface&#187;</text>
  <text x="420" y="634" text-anchor="middle" font-size="12.5" font-weight="700" fill="#385723">TransformationRule</text>
  <text x="420" y="648" text-anchor="middle" font-size="8.5" fill="#888">仅产生逻辑等价；Volcano 拒其匹配物理节点</text>

  <!-- SubstitutionRule -->
  <rect x="40" y="596" width="240" height="56" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="160" y="616" text-anchor="middle" font-size="11" fill="#385723">&#171;marker interface&#187;</text>
  <text x="160" y="634" text-anchor="middle" font-size="12.5" font-weight="700" fill="#385723">SubstitutionRule</text>
  <text x="160" y="648" text-anchor="middle" font-size="8.5" fill="#888">新节点总更优 + autoPruneOld()</text>

  <line x1="280" y1="624" x2="300" y2="624" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <line x1="280" y1="520" x2="380" y2="596" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ref)"/>

  <!-- toRule arrow: Config builds Rule -->
  <path d="M636 300 C 500 320, 470 320, 470 282" fill="none" stroke="#ED7D31" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="500" y="328" font-size="9" font-weight="700" fill="#C65911">Config.DEFAULT.toRule()</text>

  <!-- Legend -->
  <rect x="600" y="486" width="296" height="166" rx="6" fill="#FBFBFB" stroke="#BFBFBF" stroke-width="1"/>
  <text x="612" y="504" font-size="11" font-weight="700" fill="#595959">图例</text>
  <rect x="612" y="512" width="22" height="13" fill="#E2EFDA" stroke="#548235"/>
  <text x="642" y="522" font-size="10" fill="#385723">interface / marker interface</text>
  <rect x="612" y="530" width="22" height="13" fill="#FFF2CC" stroke="#BF8F00" stroke-dasharray="4,2"/>
  <text x="642" y="540" font-size="10" fill="#7F6000">abstract class</text>
  <rect x="612" y="548" width="22" height="13" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="642" y="558" font-size="10" fill="#1a1a1a">具体规则类</text>
  <rect x="612" y="566" width="22" height="13" fill="#F2F2F2" stroke="#595959"/>
  <text x="642" y="576" font-size="10" fill="#262626">APT 生成代码</text>
  <line x1="612" y1="590" x2="634" y2="590" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <text x="642" y="594" font-size="10" fill="#595959">继承 / 实现（空心三角）</text>
  <line x1="612" y1="608" x2="634" y2="608" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="642" y="612" font-size="10" fill="#595959">持有 / 弱引用</text>
  <line x1="612" y1="626" x2="634" y2="626" stroke="#ED7D31" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="642" y="630" font-size="10" fill="#C65911">toRule() 工厂方法（Config &#8594; Rule）</text>
  <text x="612" y="646" font-size="8.5" fill="#A6A6A6">@Value.Enclosing：把生成的 Immutable* 放进外层类，避免命名冲突</text>

  <text x="460" y="704" text-anchor="middle" font-size="10" fill="#A6A6A6">图 12-1 — Config 是声明式不可变配置；toRule() 是从配置到规则实例的工厂方法；with* 链式覆写产出新配置</text>
</svg>
