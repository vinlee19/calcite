<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#548235"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ED7D31"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">规则从注册到触发的全过程</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#595959">Config.toRule() &#8594; planner.addRule &#8594; 匹配 operand 树 &#8594; matches() 旁路 &#8594; onMatch &#8594; transformTo &#8594; 注册等价节点</text>

  <!-- Stage 1: build rule -->
  <rect x="40" y="80" width="220" height="92" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="150" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#385723">① 构造规则实例</text>
  <text x="54" y="122" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#385723">CoreRules.FILTER_INTO_JOIN =</text>
  <text x="54" y="136" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#385723">  Config.DEFAULT.toRule()</text>
  <text x="54" y="154" font-size="9" fill="#385723">不可变 Config 解析出 operand 树，</text>
  <text x="54" y="167" font-size="9" fill="#385723">在中央注册表 CoreRules 中作常量</text>

  <!-- Stage 2: register -->
  <rect x="300" y="80" width="220" height="92" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="410" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F4E79">② 注册进 Planner</text>
  <text x="314" y="122" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1F4E79">planner.addRule(rule)</text>
  <text x="314" y="140" font-size="9" fill="#1F4E79">Volcano 把 rule 按根 operand 的</text>
  <text x="314" y="153" font-size="9" fill="#1F4E79">匹配类索引；新算子入 memo 时</text>
  <text x="314" y="166" font-size="9" fill="#1F4E79">触发候选 RuleMatch 入队</text>

  <!-- Stage 3: match operand tree -->
  <rect x="560" y="80" width="220" height="92" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="670" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F4E79">③ 匹配 operand 树</text>
  <text x="574" y="122" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1F4E79">match() &#8594; matchRecurse()</text>
  <text x="574" y="140" font-size="9" fill="#1F4E79">按 solveOrder 逐层下探，每层</text>
  <text x="574" y="153" font-size="9" fill="#1F4E79">operand.matches(rel)：isInstance</text>
  <text x="574" y="166" font-size="9" fill="#1F4E79">+ trait.contains + predicate.test</text>

  <!-- Stage 4: matches() side-condition -->
  <rect x="560" y="220" width="220" height="86" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="670" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7F6000">④ matches(call) 旁路</text>
  <text x="574" y="262" font-size="9" fill="#7F6000">所有 operand 命中后、onMatch 前</text>
  <text x="574" y="276" font-size="9" fill="#7F6000">的全局侧条件检查（默认 true）。</text>
  <text x="574" y="292" font-size="9" fill="#7F6000">允许「假阳性」——快速过滤可省</text>
  <text x="574" y="303" font-size="9" fill="#7F6000">去昂贵的 onMatch 空转。</text>

  <!-- Stage 5: onMatch -->
  <rect x="560" y="354" width="220" height="100" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.6"/>
  <text x="670" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">⑤ onMatch(call)</text>
  <text x="574" y="396" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#FFF2CC">Filter f = call.rel(0);</text>
  <text x="574" y="410" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#FFF2CC">Join   j = call.rel(1);</text>
  <text x="574" y="424" font-size="9" fill="#FFF2CC">用 call.builder()（RelBuilder）</text>
  <text x="574" y="437" font-size="9" fill="#FFF2CC">构造下推后的等价子树；</text>
  <text x="574" y="450" font-size="9" fill="#FFF2CC">变换逻辑唯一可被子类覆写处</text>

  <!-- Stage 6: transformTo -->
  <rect x="300" y="354" width="220" height="100" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="410" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F4E79">⑥ call.transformTo(newRel)</text>
  <text x="314" y="396" font-size="9" fill="#1F4E79">把新子树登记为旧子树的等价物。</text>
  <text x="314" y="412" font-size="9" fill="#1F4E79">Volcano：propagate hints &#8594;</text>
  <text x="314" y="425" font-size="9" fill="#1F4E79">ensureRegistered 入同一 RelSet；</text>
  <text x="314" y="438" font-size="9" fill="#1F4E79">SubstitutionRule 还可 prune 旧节点</text>

  <!-- Stage 7: memo / cost -->
  <rect x="40" y="354" width="220" height="100" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.3"/>
  <text x="150" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#262626">⑦ Memo 收敛</text>
  <text x="54" y="396" font-size="9" fill="#262626">新等价节点重新触发可匹配规则；</text>
  <text x="54" y="412" font-size="9" fill="#262626">代价传播挑出最优计划。</text>
  <text x="54" y="430" font-size="9" fill="#888">驱动 / 调度细节 &#8594; 第 11 篇</text>
  <text x="54" y="444" font-size="9" fill="#888">VolcanoPlanner.findBestExp</text>

  <!-- arrows -->
  <line x1="260" y1="126" x2="300" y2="126" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="126" x2="560" y2="126" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="172" x2="670" y2="220" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="306" x2="670" y2="354" stroke="#ED7D31" stroke-width="1.6" marker-end="url(#arrowHot)"/>
  <text x="678" y="332" font-size="9" fill="#C65911">matches==true</text>
  <line x1="560" y1="404" x2="520" y2="404" stroke="#ED7D31" stroke-width="1.6" marker-end="url(#arrowHot)"/>
  <line x1="300" y1="404" x2="260" y2="404" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- feedback loop from memo back to match -->
  <path d="M150 354 C 150 250, 360 250, 410 250" fill="none" stroke="#548235" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowBack)"/>
  <text x="220" y="244" font-size="9" fill="#385723">新节点 &#8594; 重新尝试匹配（迭代直至 fixpoint）</text>

  <!-- false branch from matches -->
  <path d="M780 263 C 850 263, 850 480, 670 480" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="800" y="370" font-size="9" fill="#888" transform="rotate(90 800 370)">matches==false &#8594; 丢弃，零开销</text>

  <!-- design note box -->
  <rect x="40" y="486" width="880" height="120" rx="8" fill="#FBFBFB" stroke="#BFBFBF" stroke-width="1"/>
  <text x="56" y="506" font-size="11.5" font-weight="700" fill="#595959">三个关注点分离（为什么这么设计）</text>
  <text x="56" y="528" font-size="10" fill="#385723">• Config（声明「匹配什么 + 参数」）</text>
  <text x="320" y="528" font-size="10" fill="#7F6000">• matches()（廉价侧条件，可提前剪枝）</text>
  <text x="640" y="528" font-size="10" fill="#C65911">• onMatch()（产出等价变换，唯一业务逻辑）</text>
  <text x="56" y="552" font-size="10" fill="#595959">规则不直接改图：它只通过 transformTo「提议」一个等价物，是否采纳交给 planner 的代价模型——规则与搜索策略彻底解耦。</text>
  <text x="56" y="572" font-size="10" fill="#595959">同一份规则可被 HepPlanner（原位替换）或 VolcanoPlanner（memo 等价集）复用；TransformationRule 在 Volcano 下被禁止产出物理节点。</text>
  <text x="56" y="592" font-size="10" fill="#A6A6A6">蓝实线=正向调用；橙=onMatch 热点路径；绿虚线=迭代反馈；灰虚线=快速失败旁路。调度主循环属第 11 篇。</text>

  <text x="480" y="640" text-anchor="middle" font-size="10" fill="#A6A6A6">图 12-3 — 规则的「触发」是声明式匹配 + 一次等价变换提议；planner 负责把提议纳入搜索空间并按代价择优</text>
</svg>
