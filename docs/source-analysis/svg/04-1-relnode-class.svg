<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1F4E79" stroke-width="1"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <linearGradient id="gContainer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="940" height="720" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">RelNode 关系代数层类继承结构</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#595959">接口 RelNode → 抽象基类 AbstractRelNode → 输入数量分类(SingleRel/BiRel) → 算子 → Logical/Physical 双层</text>

  <!-- Interface RelNode -->
  <rect x="370" y="74" width="200" height="50" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="470" y="92" text-anchor="middle" font-size="10" font-style="italic" fill="#385723">&#171;interface&#187;</text>
  <text x="470" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">RelNode</text>
  <text x="470" y="120" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#548235">copy() · getInputs() · getDigest()</text>

  <!-- Abstract AbstractRelNode -->
  <rect x="350" y="150" width="240" height="64" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="470" y="168" text-anchor="middle" font-size="10" font-style="italic" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="470" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">AbstractRelNode</text>
  <text x="470" y="198" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">id · cluster · traitSet · digest</text>
  <text x="470" y="209" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">rowType(缓存) · final equals/hashCode</text>

  <line x1="470" y1="124" x2="470" y2="150" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>

  <!-- input-count classification row -->
  <rect x="120" y="252" width="200" height="58" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="220" y="270" text-anchor="middle" font-size="10" font-style="italic" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="220" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">SingleRel</text>
  <text x="220" y="300" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">input(单输入)</text>

  <rect x="620" y="252" width="200" height="58" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="720" y="270" text-anchor="middle" font-size="10" font-style="italic" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="720" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">BiRel</text>
  <text x="720" y="300" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">left · right(双输入)</text>

  <rect x="380" y="252" width="180" height="58" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="470" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">TableScan</text>
  <text x="470" y="294" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">叶子(0 输入)</text>

  <line x1="400" y1="214" x2="240" y2="252" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <line x1="540" y1="214" x2="700" y2="252" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <line x1="470" y1="214" x2="470" y2="252" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>

  <!-- core abstract operators -->
  <text x="220" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">rel/core 抽象算子(引擎无关)</text>
  <rect x="90" y="350" width="120" height="48" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.3"/>
  <text x="150" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">Project</text>
  <text x="150" y="386" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">exps:RexNode</text>

  <rect x="220" y="350" width="120" height="48" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.3"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">Filter</text>
  <text x="280" y="386" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">condition:RexNode</text>

  <rect x="600" y="350" width="120" height="48" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.3"/>
  <text x="660" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">Join</text>
  <text x="660" y="386" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">condition · joinType</text>

  <rect x="350" y="350" width="120" height="48" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.3"/>
  <text x="410" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">Aggregate</text>
  <text x="410" y="386" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">groupSet · aggCalls</text>

  <rect x="730" y="350" width="120" height="48" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.3"/>
  <text x="790" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">Union</text>
  <text x="790" y="386" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">inputs:List(N)</text>

  <line x1="200" y1="310" x2="160" y2="350" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <line x1="240" y1="310" x2="280" y2="350" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <line x1="240" y1="310" x2="400" y2="350" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <line x1="700" y1="310" x2="660" y2="350" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>

  <!-- digest holds inputs (composition) -->
  <line x1="280" y1="350" x2="280" y2="320" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="316" y="334" font-size="8.5" fill="#888">condition 持有 RexNode</text>

  <!-- Logical / Physical double layer -->
  <rect x="60" y="430" width="400" height="160" rx="8" fill="url(#gContainer)" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="80" y="452" font-size="13" font-weight="700" fill="#1F4E79">rel/logical 逻辑层 (Convention.NONE)</text>
  <text x="80" y="468" font-size="9.5" fill="#1F4E79">优化前的算子, 不绑定执行引擎</text>

  <g font-size="9.5" fill="#1a1a1a">
    <rect x="80"  y="480" width="170" height="30" rx="4" fill="#ffffff" stroke="#1F4E79"/><text x="165" y="499" text-anchor="middle" font-weight="700">LogicalProject</text>
    <rect x="270" y="480" width="170" height="30" rx="4" fill="#ffffff" stroke="#1F4E79"/><text x="355" y="499" text-anchor="middle" font-weight="700">LogicalFilter</text>
    <rect x="80"  y="518" width="170" height="30" rx="4" fill="#ffffff" stroke="#1F4E79"/><text x="165" y="537" text-anchor="middle" font-weight="700">LogicalJoin</text>
    <rect x="270" y="518" width="170" height="30" rx="4" fill="#ffffff" stroke="#1F4E79"/><text x="355" y="537" text-anchor="middle" font-weight="700">LogicalAggregate</text>
    <rect x="80"  y="556" width="360" height="26" rx="4" fill="#ffffff" stroke="#1F4E79"/><text x="260" y="573" text-anchor="middle">final 类 · accept(RelShuttle)=shuttle.visit(this)</text>
  </g>

  <rect x="500" y="430" width="400" height="160" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.6"/>
  <text x="520" y="452" font-size="13" font-weight="700" fill="#833C0C">adapter/* 物理层 (具体 Convention)</text>
  <text x="520" y="468" font-size="9.5" fill="#833C0C">优化后落到执行引擎, 带物理特性</text>

  <g font-size="9.5" fill="#ffffff">
    <rect x="520" y="480" width="170" height="30" rx="4" fill="#ED7D31" stroke="#7F3F00"/><text x="605" y="499" text-anchor="middle" font-weight="700">EnumerableProject</text>
    <rect x="710" y="480" width="170" height="30" rx="4" fill="#ED7D31" stroke="#7F3F00"/><text x="795" y="499" text-anchor="middle" font-weight="700">EnumerableHashJoin</text>
    <rect x="520" y="518" width="170" height="30" rx="4" fill="#5B9BD5" stroke="#1F4E79"/><text x="605" y="537" text-anchor="middle" font-weight="700">JdbcProject</text>
    <rect x="710" y="518" width="170" height="30" rx="4" fill="#70AD47" stroke="#385723"/><text x="795" y="537" text-anchor="middle" font-weight="700">MongoProject</text>
  </g>
  <text x="700" y="573" text-anchor="middle" font-size="9.5" fill="#833C0C">同一抽象算子 → 多个物理实现 (由 ConverterRule 生成)</text>

  <line x1="160" y1="398" x2="160" y2="430" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <line x1="430" y1="398" x2="610" y2="478" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="470" y="424" text-anchor="middle" font-size="9" fill="#888">抽象算子被两层各自继承</text>

  <!-- legend -->
  <rect x="60" y="606" width="820" height="78" rx="6" fill="#F8F8F8" stroke="#BFBFBF" stroke-width="1"/>
  <text x="72" y="624" font-size="11" font-weight="700" fill="#262626">图例</text>
  <rect x="72" y="632" width="22" height="14" rx="2" fill="#E2EFDA" stroke="#548235"/><text x="100" y="643" font-size="10" fill="#262626">interface</text>
  <rect x="180" y="632" width="22" height="14" rx="2" fill="#FFF2CC" stroke="#BF8F00"/><text x="208" y="643" font-size="10" fill="#262626">abstract</text>
  <rect x="290" y="632" width="22" height="14" rx="2" fill="#FFFFFF" stroke="#1F4E79"/><text x="318" y="643" font-size="10" fill="#262626">具体类</text>
  <rect x="390" y="632" width="22" height="14" rx="2" fill="#ED7D31" stroke="#7F3F00"/><text x="418" y="643" font-size="10" fill="#262626">物理热点(enumerable)</text>
  <line x1="560" y1="639" x2="600" y2="639" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/><text x="608" y="643" font-size="10" fill="#262626">继承(空心三角)</text>
  <line x1="730" y1="639" x2="770" y2="639" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ref)"/><text x="778" y="643" font-size="10" fill="#262626">持有/引用</text>
  <text x="72" y="666" font-size="9.5" fill="#595959">SingleRel=单输入(Project/Filter/Aggregate/Sort) · BiRel=双输入(Join) · TableScan=叶子 · Union 用 List 存任意个输入。</text>
  <text x="72" y="679" font-size="9.5" fill="#595959">equals/hashCode 在 AbstractRelNode 中标 final——身份语义由 == 决定; 等价判断走 digest 的 deepEquals/deepHashCode。</text>

  <text x="470" y="708" text-anchor="middle" font-size="10" fill="#A6A6A6">图 04-1 — 一个抽象算子(Project)在逻辑层与每个 adapter 物理层各有一份子类, 是 Calcite "前端公共、后端专业" 的微观体现</text>
</svg>
