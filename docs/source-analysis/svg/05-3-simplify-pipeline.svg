<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#548235"/>
    </marker>
    <marker id="ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7030A0"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">RexSimplify 化简流水线</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#595959">按 SqlKind 分派的递归改写 + 三值逻辑（RexUnknownAs）+ 可选 paranoid 自校验</text>

  <!-- Entry -->
  <rect x="60" y="78" width="840" height="42" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="76" y="96" font-size="11" font-weight="700" fill="#7F6000">入口</text>
  <text x="76" y="112" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#262626">simplify(e) → simplifyUnknownAs(e, defaultUnknownAs) → simplify(e, RexUnknownAs)   // 上下文决定 UNKNOWN 当 TRUE / FALSE / 原样</text>

  <!-- RexUnknownAs context box (top-right) -->
  <rect x="640" y="130" width="260" height="92" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.3"/>
  <text x="770" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">RexUnknownAs（三值→两值策略）</text>
  <text x="656" y="170" font-size="9.5" fill="#262626">FALSE  : WHERE/ON/HAVING — UNKNOWN 当假</text>
  <text x="656" y="186" font-size="9.5" fill="#262626">TRUE   : NOT 内部递归时翻转语境</text>
  <text x="656" y="202" font-size="9.5" fill="#262626">UNKNOWN: SELECT 列 / 非布尔 — 原样保留</text>
  <text x="656" y="216" font-size="9" fill="#7F3F00">同一棵树在不同语境化简强度不同</text>

  <!-- STRONG short-circuit -->
  <rect x="60" y="130" width="540" height="40" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="76" y="148" font-size="11" font-weight="700" fill="#1F4E79">① 早退：Strong.isNull(e)</text>
  <text x="76" y="163" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">布尔 NULL 在 unknownAs=FALSE 时→ FALSE 字面量；其余→ makeNullLiteral</text>
  <line x1="480" y1="120" x2="330" y2="130" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Dispatch (by SqlKind) -->
  <rect x="60" y="182" width="540" height="38" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.6"/>
  <text x="330" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">② switch (e.getKind())  — 按算子种类分派到专用化简器</text>
  <text x="330" y="214" text-anchor="middle" font-size="9" fill="#FFF2CC">default: 普通 RexCall → simplifyGenericNode（仅化简操作数）</text>
  <line x1="330" y1="170" x2="330" y2="181" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- The specialized simplifiers grid -->
  <g font-size="10">
    <rect x="60"  y="238" width="172" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="146" y="256" text-anchor="middle" font-weight="700" fill="#1a1a1a">AND / OR / NOT</text>
    <text x="146" y="270" text-anchor="middle" font-size="8.5" fill="#595959">simplifyAnd/Or/Not · 谓词归并</text>

    <rect x="244" y="238" width="172" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="330" y="256" text-anchor="middle" font-weight="700" fill="#1a1a1a">CASE / COALESCE</text>
    <text x="330" y="270" text-anchor="middle" font-size="8.5" fill="#595959">simplifyCase · 死分支消除</text>

    <rect x="428" y="238" width="172" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="514" y="256" text-anchor="middle" font-weight="700" fill="#1a1a1a">IS_NULL / IS_TRUE …</text>
    <text x="514" y="270" text-anchor="middle" font-size="8.5" fill="#595959">simplifyIs · 借 Strong 推断</text>

    <rect x="60"  y="286" width="172" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="146" y="304" text-anchor="middle" font-weight="700" fill="#1a1a1a">=, &gt;, &lt;, &lt;&gt; …</text>
    <text x="146" y="318" text-anchor="middle" font-size="8.5" fill="#595959">simplifyComparison · 常量比较</text>

    <rect x="244" y="286" width="172" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="330" y="304" text-anchor="middle" font-weight="700" fill="#1a1a1a">SEARCH (Sarg)</text>
    <text x="330" y="318" text-anchor="middle" font-size="8.5" fill="#595959">simplifySearch · 区间集运算</text>

    <rect x="428" y="286" width="172" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="514" y="304" text-anchor="middle" font-weight="700" fill="#1a1a1a">CAST / + - * /</text>
    <text x="514" y="318" text-anchor="middle" font-size="8.5" fill="#595959">simplifyCast/Arithmetic</text>
  </g>

  <!-- recursion note -->
  <rect x="640" y="238" width="260" height="88" rx="8" fill="#FFFFFF" stroke="#7030A0" stroke-width="1.3" stroke-dasharray="6,3"/>
  <text x="770" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#7030A0">递归 + 不动点</text>
  <text x="656" y="276" font-size="9.5" fill="#262626">各化简器先递归化简子表达式，</text>
  <text x="656" y="291" font-size="9.5" fill="#262626">再对当前节点做局部重写；</text>
  <text x="656" y="306" font-size="9.5" fill="#262626">改写出新算子可能再次触发分派，</text>
  <text x="656" y="321" font-size="9.5" fill="#7030A0">直到没有节点可改（结构收敛）。</text>
  <line x1="600" y1="258" x2="639" y2="262" stroke="#7030A0" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#ctrl)"/>

  <!-- Constant reduction via executor -->
  <rect x="60" y="344" width="540" height="56" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="76" y="364" font-size="11" font-weight="700" fill="#385723">③ 常量折叠：executor.reduce(rexBuilder, constExps, reducedValues)</text>
  <text x="76" y="381" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">RexExecutorImpl 把无变量子表达式编译成 Java、当场求值，回填为 RexLiteral</text>
  <text x="76" y="395" font-size="9" fill="#548235">把"运行期每行都算"提前成"规划期算一次"（与 codegen 同一套 linq4j，详见第 16 篇）</text>
  <line x1="330" y1="326" x2="330" y2="343" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- paranoid verify -->
  <rect x="60" y="424" width="840" height="92" rx="8" fill="#FFFFFF" stroke="#7030A0" stroke-width="1.6"/>
  <text x="76" y="444" font-size="11.5" font-weight="700" fill="#7030A0">④ paranoid 自校验（仅测试 / 断言开启时）：verify(before, simplified, unknownAs)</text>
  <text x="76" y="463" font-size="9.5" fill="#262626">RexAnalyzer 枚举变量的所有取值组合 → RexInterpreter 解释执行 before 与 simplified</text>
  <text x="76" y="479" font-size="9.5" fill="#262626">逐组断言两者结果一致（含异常类型 / 消息一致）；不一致即抛 AssertionError</text>
  <text x="76" y="495" font-size="9.5" fill="#7030A0">作用：让"化简前后等价"成为可被测试反复证伪的性质，而非靠人脑保证</text>
  <text x="76" y="510" font-size="9" fill="#A6A6A6">坑：仅覆盖 RexAnalyzer 能枚举的有限类型；unsupportedCount&gt;0 时直接放过 → 复杂表达式不校验</text>
  <line x1="330" y1="400" x2="330" y2="423" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect x="300" y="540" width="360" height="42" rx="8" fill="#1F4E79"/>
  <text x="480" y="558" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">简化后的 RexNode</text>
  <text x="480" y="573" text-anchor="middle" font-size="9" fill="#DEEBF7">更小的树 / 更弱的 NULL 性 / 可能直接是 RexLiteral</text>
  <line x1="480" y1="516" x2="480" y2="539" stroke="#548235" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowBack)"/>

  <!-- design note -->
  <rect x="60" y="600" width="840" height="40" rx="8" fill="#F2F2F2" stroke="#595959"/>
  <text x="480" y="620" text-anchor="middle" font-size="10.5" fill="#262626">RexSimplify 本身不可变：withPredicates / withParanoid / withUnknownAsFalse 都返回新实例（函数式配置，线程安全可复用）</text>
  <text x="480" y="634" text-anchor="middle" font-size="9.5" fill="#7F3F00">坑：化简强烈依赖 RexUnknownAs 语境，传错会把 SELECT 列里的 UNKNOWN 误当 FALSE，改变语义</text>

  <text x="480" y="668" text-anchor="middle" font-size="10" fill="#A6A6A6">图 05-3 — 蓝色为正向数据流，绿色虚线为返回，紫色虚线为控制流（递归 / 自校验）；橙色块=分派热点</text>
  <text x="480" y="685" text-anchor="middle" font-size="10" fill="#A6A6A6">源码：org.apache.calcite.rex.RexSimplify#simplify(RexNode, RexUnknownAs) 的 switch 分派</text>
</svg>
