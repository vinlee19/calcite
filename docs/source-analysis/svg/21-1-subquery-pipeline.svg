<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="stage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">子查询全链路：SqlCall → RexSubQuery → 去关联 Join → Enumerable</text>
  <text x="520" y="50" text-anchor="middle" font-size="12" fill="#595959">五阶段每一步的产物形态；第三阶段（橙）是把"行内嵌子查询"显式化为 RexSubQuery 的关键一步</text>

  <!-- example SQL -->
  <rect x="28" y="66" width="984" height="48" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="42" y="85" font-size="11" font-weight="700" fill="#7F6000">示例 SQL（非相关 IN 子查询）</text>
  <text x="42" y="104" font-size="11.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">SELECT e.ename FROM emp e WHERE e.deptno IN (SELECT deptno FROM dept WHERE loc = 'NY')</text>

  <!-- stage headers -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="28"  y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="228" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="428" y="130" width="184" height="26" rx="5" fill="#ED7D31" stroke="#7F3F00"/>
    <rect x="628" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="828" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="120" y="148" fill="#1F4E79">① Parse</text>
    <text x="320" y="148" fill="#1F4E79">② Validate</text>
    <text x="520" y="148" fill="#ffffff">③ Convert ★关键一步</text>
    <text x="720" y="148" fill="#1F4E79">④ Optimize</text>
    <text x="920" y="148" fill="#1F4E79">⑤ Execute</text>
  </g>

  <!-- stage 1 -->
  <rect x="28" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="44" y="186" width="152" height="60" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="120" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">SqlBasicCall(IN)</text>
  <text x="120" y="223" text-anchor="middle" font-size="8.8" fill="#595959">operator=SqlInOperator</text>
  <text x="120" y="236" text-anchor="middle" font-size="8.8" fill="#595959">2 个 operand</text>
  <rect x="44" y="256" width="152" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="120" y="273" text-anchor="middle" font-size="9.3" fill="#262626">[0] SqlIdentifier</text>
  <text x="120" y="287" text-anchor="middle" font-size="9.3" fill="#262626">e.deptno</text>
  <rect x="44" y="306" width="152" height="56" rx="6" fill="#FFF2CC" stroke="#BF8F00"/>
  <text x="120" y="324" text-anchor="middle" font-size="9.3" fill="#7F6000">[1] SqlSelect</text>
  <text x="120" y="338" text-anchor="middle" font-size="8.5" fill="#7F6000">SELECT deptno</text>
  <text x="120" y="350" text-anchor="middle" font-size="8.5" fill="#7F6000">FROM dept …</text>
  <text x="44" y="386" font-size="9" fill="#888">锚点</text>
  <text x="44" y="400" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">Parser.jj</text>
  <text x="44" y="412" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">SqlInOperator</text>
  <text x="44" y="436" font-size="9" fill="#385723">产物：纯句法树</text>
  <text x="44" y="450" font-size="9" fill="#385723">子查询=嵌套 SqlSelect</text>

  <!-- stage 2 -->
  <rect x="228" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="244" y="186" width="152" height="52" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="320" y="204" text-anchor="middle" font-size="10.5" font-weight="700" fill="#385723">外层 SelectScope</text>
  <text x="320" y="220" text-anchor="middle" font-size="8.6" fill="#385723">含 emp e 的列</text>
  <text x="320" y="232" text-anchor="middle" font-size="8.6" fill="#385723">deriveType(IN)</text>
  <line x1="320" y1="238" x2="320" y2="256" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="244" y="256" width="152" height="52" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="320" y="274" text-anchor="middle" font-size="10.5" font-weight="700" fill="#385723">子查询 SelectScope</text>
  <text x="320" y="290" text-anchor="middle" font-size="8.6" fill="#385723">父=外层 scope</text>
  <text x="320" y="302" text-anchor="middle" font-size="8.6" fill="#385723">DelegatingScope 委托</text>
  <text x="244" y="334" font-size="9" fill="#595959">相关列（如 e.x）逐级</text>
  <text x="244" y="347" font-size="9" fill="#595959">向父 scope 查找解析。</text>
  <text x="244" y="386" font-size="9" fill="#888">锚点（→第 07 篇）</text>
  <text x="244" y="400" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">SelectScope</text>
  <text x="244" y="412" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">DelegatingScope</text>
  <text x="244" y="436" font-size="9" fill="#385723">产物：带类型/作用域</text>
  <text x="244" y="450" font-size="9" fill="#385723">的已校验 SqlNode</text>

  <!-- stage 3 (key) -->
  <rect x="428" y="170" width="184" height="380" rx="8" fill="#FBE5D6" stroke="#7F3F00" stroke-width="1.6"/>
  <rect x="444" y="186" width="152" height="34" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="520" y="203" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">replaceSubQueries</text>
  <text x="520" y="214" text-anchor="middle" font-size="8" fill="#595959">SqlToRelConverter:1261</text>
  <line x1="520" y1="220" x2="520" y2="234" stroke="#7F3F00" stroke-width="1.4" marker-end="url(#stage)"/>
  <rect x="444" y="234" width="152" height="30" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="520" y="253" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">findSubQueries :2183</text>
  <line x1="520" y1="264" x2="520" y2="276" stroke="#7F3F00" stroke-width="1.4" marker-end="url(#stage)"/>
  <rect x="444" y="276" width="152" height="30" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="520" y="295" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">substituteSubQuery :1271</text>
  <line x1="520" y1="306" x2="520" y2="318" stroke="#7F3F00" stroke-width="1.4" marker-end="url(#stage)"/>
  <rect x="444" y="318" width="152" height="30" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="520" y="337" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">convertExists :1974</text>
  <line x1="520" y1="348" x2="520" y2="360" stroke="#7F3F00" stroke-width="1.8" marker-end="url(#stage)"/>
  <rect x="444" y="360" width="152" height="58" rx="6" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.4"/>
  <text x="520" y="380" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">RexSubQuery.in(rel,keys)</text>
  <text x="520" y="396" text-anchor="middle" font-size="8.6" fill="#FFF2CC">行表达式内嵌一棵 RelNode</text>
  <text x="520" y="409" text-anchor="middle" font-size="8.6" fill="#FFF2CC">rel = Project(Scan dept)</text>
  <text x="444" y="440" font-size="9" fill="#833C0C">把"嵌套 SqlSelect"统一</text>
  <text x="444" y="453" font-size="9" fill="#833C0C">建模成 RexNode 子类，</text>
  <text x="444" y="466" font-size="9" fill="#833C0C">交给规则去消解。</text>

  <!-- stage 4 -->
  <rect x="628" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="644" y="186" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="720" y="204" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1F4E79">SubQueryRemoveRule</text>
  <text x="720" y="220" text-anchor="middle" font-size="8.6" fill="#595959">rewriteIn / rewriteExists …</text>
  <text x="720" y="231" text-anchor="middle" font-size="8" fill="#888">→第 12 篇 规则机制</text>
  <line x1="720" y1="234" x2="720" y2="250" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="644" y="250" width="152" height="46" rx="6" fill="#1F4E79"/>
  <text x="720" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">LogicalJoin / SemiJoin</text>
  <text x="720" y="284" text-anchor="middle" font-size="8.6" fill="#DEEBF7">+ Aggregate(distinct)</text>
  <rect x="644" y="312" width="152" height="50" rx="6" fill="#F2F2F2" stroke="#595959" stroke-dasharray="5,3"/>
  <text x="720" y="330" text-anchor="middle" font-size="9.4" font-weight="700" fill="#262626">相关子查询额外一步</text>
  <text x="720" y="345" text-anchor="middle" font-size="8.6" fill="#595959">RelDecorrelator 去关联</text>
  <text x="720" y="356" text-anchor="middle" font-size="8" fill="#888">→第 08 篇 图 08-3</text>
  <text x="644" y="392" font-size="9" fill="#385723">产物：纯关系算子，</text>
  <text x="644" y="405" font-size="9" fill="#385723">无 RexSubQuery / $cor，</text>
  <text x="644" y="418" font-size="9" fill="#385723">可重排 / 下推 / 选物理算子</text>

  <!-- stage 5 -->
  <rect x="828" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="844" y="186" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="920" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">EnumerableHashJoin</text>
  <text x="920" y="221" text-anchor="middle" font-size="8.6" fill="#595959">/ HashSemiJoin</text>
  <line x1="920" y1="234" x2="920" y2="250" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="844" y="250" width="152" height="44" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="920" y="268" text-anchor="middle" font-size="9.6" font-weight="700" fill="#1F4E79">Janino 编译</text>
  <text x="920" y="283" text-anchor="middle" font-size="8.6" fill="#595959">→ Bindable.bind()</text>
  <text x="844" y="318" font-size="8" fill="#888">→第 16 篇 codegen</text>
  <line x1="920" y1="326" x2="920" y2="342" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="844" y="342" width="152" height="44" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="920" y="361" text-anchor="middle" font-size="10.5" font-weight="700" fill="#385723">结果行 Enumerator</text>
  <text x="920" y="376" text-anchor="middle" font-size="8.6" fill="#385723">能运行的查询结果</text>

  <!-- stage advance big arrows -->
  <line x1="212" y1="360" x2="228" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="412" y1="360" x2="428" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="612" y1="360" x2="628" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="812" y1="360" x2="828" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>

  <text x="520" y="578" text-anchor="middle" font-size="10" fill="#A6A6A6">图 21-1 — 棕色粗箭头为阶段推进；橙色列为关键一步（行内嵌子查询 → RexSubQuery）；灰虚线框为相关子查询才走的去关联</text>
</svg>
