<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="stage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">开窗执行模型：EnumerableWindow 的"分桶 → 排序 → 滑帧累加"</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#595959">sum(sal) OVER (PARTITION BY deptno ORDER BY hiredate ROWS UNBOUNDED PRECEDING..CURRENT ROW) 的运行期数据流</text>

  <!-- input -->
  <text x="60" y="84" font-size="12" font-weight="700" fill="#1F4E79">① 输入行（emp）</text>
  <rect x="60" y="92" width="190" height="150" rx="6" fill="#F2F2F2" stroke="#595959"/>
  <g font-size="9.2" fill="#262626" font-family="'SF Mono',Menlo,monospace">
    <text x="72" y="110">deptno sal  hiredate</text>
    <text x="72" y="128">  20   1300  1980</text>
    <text x="72" y="146">  10    800  1981</text>
    <text x="72" y="164">  20   1100  1981</text>
    <text x="72" y="182">  10   1250  1982</text>
    <text x="72" y="200">  10    950  1983</text>
    <text x="72" y="218">  20    900  1984</text>
  </g>

  <line x1="250" y1="167" x2="296" y2="167" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <text x="273" y="158" text-anchor="middle" font-size="8.4" fill="#833C0C">partition</text>

  <!-- partition + sort -->
  <text x="306" y="84" font-size="12" font-weight="700" fill="#1F4E79">② 按 deptno 分桶 + 桶内按 hiredate 排序</text>
  <rect x="306" y="92" width="200" height="150" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="316" y="108" font-size="9.4" font-weight="700" fill="#385723">桶 deptno=10</text>
  <g font-size="9" fill="#262626" font-family="'SF Mono',Menlo,monospace">
    <text x="316" y="124">800 (1981)</text>
    <text x="316" y="138">1250(1982)</text>
    <text x="316" y="152">950 (1983)</text>
  </g>
  <text x="316" y="176" font-size="9.4" font-weight="700" fill="#385723">桶 deptno=20</text>
  <g font-size="9" fill="#262626" font-family="'SF Mono',Menlo,monospace">
    <text x="316" y="192">1300(1980)</text>
    <text x="316" y="206">1100(1981)</text>
    <text x="316" y="220">900 (1984)</text>
  </g>
  <text x="430" y="124" font-size="8.2" fill="#595959">SortedMultiMap</text>
  <text x="430" y="138" font-size="8.2" fill="#595959">按 key 分组，</text>
  <text x="430" y="152" font-size="8.2" fill="#595959">组内排序。</text>

  <line x1="506" y1="167" x2="552" y2="167" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <text x="529" y="158" text-anchor="middle" font-size="8.4" fill="#833C0C">滑帧</text>

  <!-- frame sliding -->
  <text x="562" y="84" font-size="12" font-weight="700" fill="#1F4E79">③ 桶内滑动帧累加（以 deptno=10 为例）</text>
  <rect x="562" y="92" width="378" height="150" rx="6" fill="#FBE5D6" stroke="#7F3F00"/>
  <g font-size="9" fill="#262626" font-family="'SF Mono',Menlo,monospace">
    <text x="574" y="112">行1 frame=[800]              sum=800</text>
    <text x="574" y="132">行2 frame=[800,1250]         sum=2050</text>
    <text x="574" y="152">行3 frame=[800,1250,950]     sum=3000</text>
  </g>
  <text x="574" y="178" font-size="9" fill="#833C0C">UNBOUNDED PRECEDING..CURRENT ROW =</text>
  <text x="574" y="192" font-size="9" fill="#833C0C">帧 = 本分区从首行到当前行 → 累计和</text>
  <text x="574" y="214" font-size="8.6" fill="#595959">RANGE 帧则按 ORDER 值比较边界，可含并列行；</text>
  <text x="574" y="228" font-size="8.6" fill="#595959">ROWS 帧按物理行数。两者经 validateFrameBoundary 区分。</text>

  <!-- loop box -->
  <rect x="60" y="266" width="880" height="120" rx="8" fill="none" stroke="#7030A0" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="74" y="284" font-size="10" font-weight="700" fill="#7030A0">EnumerableWindow.implement 生成的 Java（loop 伪码）</text>
  <g font-size="9.2" fill="#262626" font-family="'SF Mono',Menlo,monospace">
    <text x="80" y="306">for (each partition bucket) {</text>
    <text x="100" y="322">sort rows by orderKeys;</text>
    <text x="100" y="338">reset accumulators;            // WinAggResetContext</text>
    <text x="100" y="354">for (each row i) { add rows entering frame;  // WinAggAddContext</text>
    <text x="120" y="370">emit row + agg.result(); }     // WinAggResultContext</text>
    <text x="80" y="386">}</text>
  </g>

  <line x1="500" y1="386" x2="500" y2="408" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- output -->
  <text x="60" y="430" font-size="12" font-weight="700" fill="#385723">④ 输出：每行追加窗口列</text>
  <rect x="60" y="438" width="880" height="118" rx="6" fill="#ffffff" stroke="#548235"/>
  <g font-size="9.4" fill="#262626" font-family="'SF Mono',Menlo,monospace">
    <text x="80" y="458">deptno  sal   hiredate   sum_over_window</text>
    <text x="80" y="476">  10     800    1981        800</text>
    <text x="80" y="492">  10    1250    1982       2050</text>
    <text x="80" y="508">  10     950    1983       3000</text>
    <text x="80" y="524">  20    1300    1980       1300   …（deptno=20 桶独立累计）</text>
  </g>
  <text x="600" y="476" font-size="9" fill="#595959">每个分区独立维护累加器；</text>
  <text x="600" y="492" font-size="9" fill="#595959">行数不变（窗口 ≠ 聚合 GROUP BY），</text>
  <text x="600" y="508" font-size="9" fill="#595959">只是每行多算一个随帧滑动的值。</text>
  <text x="600" y="530" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#888">adapter/enumerable/EnumerableWindow</text>

  <text x="500" y="582" text-anchor="middle" font-size="10" fill="#A6A6A6">图 21-7 — 棕箭头为执行阶段推进；紫虚线框为 Janino 生成的循环；窗口保持行数不变，逐行给出随帧滑动的聚合值</text>
</svg>
