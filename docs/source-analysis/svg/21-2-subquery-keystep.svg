<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="stage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">子查询关键一步：substituteSubQuery → convertExists → RexSubQuery</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#595959">同一条产线，按"是否相关"分两条出路；区别只在子查询体里是否出现 RexCorrelVariable($cor)</text>

  <!-- pivot -->
  <rect x="300" y="68" width="400" height="78" rx="8" fill="#FBE5D6" stroke="#7F3F00" stroke-width="1.6"/>
  <text x="500" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#833C0C">SqlToRelConverter.replaceSubQueries（每个查询块）</text>
  <text x="500" y="110" text-anchor="middle" font-size="9.6" font-family="'SF Mono',Menlo,monospace" fill="#262626">findSubQueries(:2183) → substituteSubQuery(:1271) → convertExists(:1974)</text>
  <text x="500" y="128" text-anchor="middle" font-size="9.6" fill="#833C0C">把子查询体递归转成 RelNode，再封进 RexSubQuery 工厂方法</text>
  <text x="500" y="142" text-anchor="middle" font-size="8.8" fill="#595959">RexSubQuery.in / exists / scalar / some / unique（RexSubQuery.java:53–149）</text>

  <line x1="400" y1="146" x2="300" y2="178" stroke="#7F3F00" stroke-width="1.8" marker-end="url(#stage)"/>
  <line x1="600" y1="146" x2="700" y2="178" stroke="#7F3F00" stroke-width="1.8" marker-end="url(#stage)"/>

  <!-- left: non-correlated -->
  <rect x="40" y="180" width="430" height="430" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="56" y="202" font-size="13" font-weight="700" fill="#1F4E79">A. 非相关：子查询体不引用外层列</text>
  <text x="56" y="219" font-size="9.6" fill="#595959">e.deptno IN (SELECT deptno FROM dept WHERE loc='NY')</text>

  <rect x="62" y="232" width="386" height="70" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="255" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">RexSubQuery.in(rel, [$0=deptno])</text>
  <text x="255" y="270" text-anchor="middle" font-size="9" fill="#FFF2CC">rel = LogicalProject(deptno)</text>
  <text x="255" y="284" text-anchor="middle" font-size="9" fill="#FFF2CC">      └ LogicalFilter(loc='NY') ← 无 $cor</text>
  <text x="255" y="297" text-anchor="middle" font-size="9" fill="#FFF2CC">          └ LogicalTableScan(dept)</text>

  <line x1="255" y1="302" x2="255" y2="324" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="62" y="324" width="386" height="44" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="255" y="343" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F4E79">SubQueryRemoveRule.rewriteIn (:570)</text>
  <text x="255" y="358" text-anchor="middle" font-size="8.8" fill="#595959">去重(Aggregate distinct) + 直接 Join</text>

  <line x1="255" y1="368" x2="255" y2="390" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="120" y="390" width="270" height="46" rx="6" fill="#1F4E79"/>
  <text x="255" y="409" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">LogicalJoin (semi / inner)</text>
  <text x="255" y="424" text-anchor="middle" font-size="8.8" fill="#DEEBF7">emp.deptno = dept.deptno</text>

  <text x="56" y="468" font-size="10.5" font-weight="700" fill="#385723">为何这样设计（工程视角）</text>
  <text x="56" y="486" font-size="9.6" fill="#595959">• 子查询统一成 RexNode 子类，与普通谓词同构，</text>
  <text x="56" y="500" font-size="9.6" fill="#595959">  优化器规则可统一匹配处理。</text>
  <text x="56" y="518" font-size="9.6" fill="#595959">• 非相关 → 子查询只算一次，天然可下推。</text>
  <text x="56" y="540" font-size="9.6" fill="#888">坑：列表很短时 substituteSubQuery 会改写成</text>
  <text x="56" y="554" font-size="9.6" fill="#888">OR 链而非 Join（阈值 inSubQueryThreshold）。</text>
  <text x="56" y="576" font-size="9.6" fill="#888">NULL 三值逻辑由 RelOptUtil.Logic 全程跟踪。</text>

  <!-- right: correlated -->
  <rect x="530" y="180" width="430" height="430" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.4"/>
  <text x="546" y="202" font-size="13" font-weight="700" fill="#833C0C">B. 相关：子查询体引用外层列</text>
  <text x="546" y="219" font-size="9.6" fill="#833C0C">EXISTS (SELECT 1 FROM dept d WHERE d.deptno = e.deptno)</text>

  <rect x="552" y="232" width="386" height="70" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="745" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">RexSubQuery.exists(rel)</text>
  <text x="745" y="270" text-anchor="middle" font-size="9" fill="#FFF2CC">rel = LogicalFilter(d.deptno = $cor0.deptno)</text>
  <text x="745" y="284" text-anchor="middle" font-size="9" fill="#FFF2CC">          └ LogicalTableScan(dept d)</text>
  <text x="745" y="297" text-anchor="middle" font-size="9" fill="#FFF2CC">$cor0 = RexCorrelVariable（引用外层 e）</text>

  <line x1="745" y1="302" x2="745" y2="324" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="552" y="324" width="386" height="44" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="745" y="343" text-anchor="middle" font-size="10.5" font-weight="700" fill="#833C0C">SubQueryRemoveRule.rewriteExists (:472)</text>
  <text x="745" y="358" text-anchor="middle" font-size="8.8" fill="#595959">带 variablesSet=$cor0 → Correlate</text>

  <line x1="745" y1="368" x2="745" y2="390" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="610" y="390" width="270" height="46" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.4"/>
  <text x="745" y="409" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7F6000">LogicalCorrelate（嵌套循环）</text>
  <text x="745" y="424" text-anchor="middle" font-size="8.8" fill="#7F6000">correlationId=$cor0  仍含相关</text>

  <line x1="745" y1="436" x2="745" y2="458" stroke="#7F3F00" stroke-width="1.8" marker-end="url(#stage)"/>
  <text x="760" y="451" font-size="9" font-weight="700" fill="#833C0C">RelDecorrelator（→第 08 篇）</text>
  <rect x="610" y="458" width="270" height="44" rx="6" fill="#1F4E79"/>
  <text x="745" y="477" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">LogicalJoin（去关联后）</text>
  <text x="745" y="492" text-anchor="middle" font-size="8.8" fill="#DEEBF7">无 $cor，可哈希连接/下推</text>

  <text x="546" y="532" font-size="9.6" fill="#888">坑：去关联能力有限，去不掉就保留 Correlate，</text>
  <text x="546" y="546" font-size="9.6" fill="#888">退化成嵌套循环（外层每行重算子查询，O(n²)）。</text>
  <text x="546" y="568" font-size="9.6" fill="#595959">关键区别全在子查询体里那一个 RexCorrelVariable —</text>
  <text x="546" y="582" font-size="9.6" fill="#595959">它在 convertExists 阶段由 Blackboard 注册生成。</text>

  <text x="500" y="640" text-anchor="middle" font-size="10" fill="#A6A6A6">图 21-2 — 橙=关键一步产物 RexSubQuery；A/B 唯一差异是子查询体是否含 $cor；相关分支多一道去关联</text>
</svg>
