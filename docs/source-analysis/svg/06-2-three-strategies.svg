<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#548235" stroke-width="1"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">SqlOperator 持有的三个类型策略对象</text>
  <text x="470" y="53" text-anchor="middle" font-size="12" fill="#595959">数据/行为分离：算子只持有策略引用，类型规则全部外置为可组合的策略对象</text>

  <!-- SqlOperator center node -->
  <g>
    <rect x="330" y="78" width="280" height="120" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="470" y="100" text-anchor="middle" font-size="12" fill="#7F6000">&#171;abstract&#187;</text>
    <text x="470" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#7F6000">SqlOperator</text>
    <line x1="338" y1="126" x2="602" y2="126" stroke="#BF8F00" stroke-width="1"/>
    <text x="346" y="143" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">- returnTypeInference  : @Nullable</text>
    <text x="346" y="158" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">- operandTypeInference : @Nullable</text>
    <text x="346" y="173" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">- operandTypeChecker   : @Nullable</text>
    <text x="346" y="190" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">+ inferReturnType(opBinding)</text>
  </g>

  <!-- three strategy interfaces -->
  <!-- A return type -->
  <g>
    <rect x="40" y="262" width="270" height="92" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
    <text x="175" y="282" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187; @FunctionalInterface</text>
    <text x="175" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">SqlReturnTypeInference</text>
    <line x1="48" y1="308" x2="302" y2="308" stroke="#548235" stroke-width="1"/>
    <text x="56" y="324" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">+ inferReturnType(b) : @Nullable Type</text>
    <text x="56" y="338" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">+ andThen(transform)  // cascade</text>
    <text x="56" y="350" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">+ orElse(rule)        // chain</text>
  </g>

  <!-- B operand inference -->
  <g>
    <rect x="335" y="262" width="270" height="80" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
    <text x="470" y="282" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187;</text>
    <text x="470" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">SqlOperandTypeInference</text>
    <line x1="343" y1="308" x2="597" y2="308" stroke="#548235" stroke-width="1"/>
    <text x="351" y="326" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">+ inferOperandTypes(b, ret, out[])</text>
    <text x="351" y="338" font-size="9" fill="#595959">补全 ? / ANY 形参类型</text>
  </g>

  <!-- C operand checker -->
  <g>
    <rect x="630" y="262" width="270" height="92" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
    <text x="765" y="282" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187;</text>
    <text x="765" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">SqlOperandTypeChecker</text>
    <line x1="638" y1="308" x2="892" y2="308" stroke="#548235" stroke-width="1"/>
    <text x="646" y="324" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">+ checkOperandTypes(b, throw)</text>
    <text x="646" y="338" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">+ and(c) / or(c)  // 组合</text>
    <text x="646" y="350" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">+ typeInference() : @Nullable</text>
  </g>

  <!-- holds (weak ref) lines from SqlOperator to the 3 interfaces -->
  <line x1="400" y1="198" x2="190" y2="261" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="250" y="232" font-size="9" fill="#888">holds</text>
  <line x1="470" y1="198" x2="470" y2="261" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="478" y="232" font-size="9" fill="#888">holds</text>
  <line x1="545" y1="198" x2="752" y2="261" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="660" y="232" font-size="9" fill="#888">holds</text>

  <!-- static factories rows -->
  <g>
    <rect x="40" y="392" width="270" height="92" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="175" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">ReturnTypes（静态工厂）</text>
    <line x1="48" y1="420" x2="302" y2="420" stroke="#1F4E79" stroke-width="1"/>
    <text x="56" y="437" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">BOOLEAN / VARCHAR / ARG0 ...</text>
    <text x="56" y="452" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">chain(...) / cascade(...)</text>
    <text x="56" y="467" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">NULLABLE_SUM / PRODUCT_NULLABLE</text>
    <text x="56" y="480" font-size="9" fill="#595959">~250 个可复用常量</text>
  </g>
  <g>
    <rect x="335" y="392" width="270" height="92" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="470" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">InferTypes（静态工厂）</text>
    <line x1="343" y1="420" x2="597" y2="420" stroke="#1F4E79" stroke-width="1"/>
    <text x="351" y="437" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">FIRST_KNOWN / RETURN_TYPE</text>
    <text x="351" y="452" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">BOOLEAN / VARCHAR_1024</text>
    <text x="351" y="467" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">ANY_NULLABLE / explicit(list)</text>
  </g>
  <g>
    <rect x="630" y="392" width="270" height="92" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="765" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">OperandTypes（静态工厂）</text>
    <line x1="638" y1="420" x2="892" y2="420" stroke="#1F4E79" stroke-width="1"/>
    <text x="646" y="437" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">family(...) / typeName(...)</text>
    <text x="646" y="452" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">or(...) / and(...) 组合</text>
    <text x="646" y="467" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">BOOLEAN_BOOLEAN / PLUS_OPERATOR</text>
  </g>

  <!-- factories realize/produce the interfaces -->
  <line x1="175" y1="392" x2="175" y2="356" stroke="#548235" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#inh)"/>
  <line x1="470" y1="392" x2="470" y2="344" stroke="#548235" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#inh)"/>
  <line x1="765" y1="392" x2="765" y2="356" stroke="#548235" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#inh)"/>

  <!-- concrete operator example -->
  <g>
    <rect x="180" y="520" width="580" height="96" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.5"/>
    <text x="470" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#833C0C">装配示例：SqlStdOperatorTable.PLUS  (+)</text>
    <text x="200" y="560" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">new SqlMonotonicBinaryOperator("+", SqlKind.PLUS, 40, true,</text>
    <text x="222" y="576" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#548235">ReturnTypes.NULLABLE_SUM,        // 返回类型策略</text>
    <text x="222" y="592" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#548235">InferTypes.FIRST_KNOWN,          // 形参推导策略</text>
    <text x="222" y="608" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#548235">OperandTypes.PLUS_OPERATOR);     // 形参校验策略</text>
  </g>
  <line x1="470" y1="484" x2="470" y2="519" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>

  <!-- legend -->
  <g>
    <rect x="40" y="632" width="860" height="40" rx="6" fill="#F2F2F2" stroke="#BFBFBF"/>
    <text x="52" y="648" font-size="10" font-weight="700" fill="#595959">图例</text>
    <rect x="100" y="640" width="22" height="14" fill="#E2EFDA" stroke="#548235"/>
    <text x="128" y="651" font-size="10" fill="#385723">interface</text>
    <rect x="200" y="640" width="22" height="14" fill="#FFF2CC" stroke="#BF8F00" stroke-dasharray="4,2"/>
    <text x="228" y="651" font-size="10" fill="#7F6000">abstract</text>
    <rect x="300" y="640" width="22" height="14" fill="#ffffff" stroke="#1F4E79"/>
    <text x="328" y="651" font-size="10" fill="#1a1a1a">具体类/工厂</text>
    <line x1="420" y1="647" x2="452" y2="647" stroke="#548235" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#inh)"/>
    <text x="458" y="651" font-size="10" fill="#385723">produces/realizes</text>
    <line x1="600" y1="647" x2="632" y2="647" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
    <text x="638" y="651" font-size="10" fill="#888">holds（持有引用，非继承）</text>
  </g>

  <text x="470" y="690" text-anchor="middle" font-size="10" fill="#A6A6A6">图 06-2 — 一个算子 = 三个策略对象的组合；改类型规则只换策略常量，无需新增 SqlOperator 子类</text>
</svg>
