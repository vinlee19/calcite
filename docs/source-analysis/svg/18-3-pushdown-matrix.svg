<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">5 个 adapter 的 pushdown 能力热力图</text>
  <text x="480" y="53" text-anchor="middle" font-size="12" fill="#595959">绿=原生下推 / 黄=受限或需转写 / 灰=不下推（留在 Enumerable 本地执行）—— 依据各 adapter 的 Rules 与 Dialect 源码</text>

  <!-- Column headers (capabilities) -->
  <g font-size="11" font-weight="700" fill="#ffffff">
    <rect x="150" y="74" width="120" height="40" rx="4" fill="#1F4E79"/><text x="210" y="99" text-anchor="middle">Filter</text>
    <rect x="272" y="74" width="120" height="40" rx="4" fill="#1F4E79"/><text x="332" y="99" text-anchor="middle">Project</text>
    <rect x="394" y="74" width="120" height="40" rx="4" fill="#1F4E79"/><text x="454" y="99" text-anchor="middle">Aggregate</text>
    <rect x="516" y="74" width="120" height="40" rx="4" fill="#1F4E79"/><text x="576" y="99" text-anchor="middle">Join</text>
    <rect x="638" y="74" width="120" height="40" rx="4" fill="#1F4E79"/><text x="698" y="99" text-anchor="middle">Sort/Limit</text>
    <rect x="760" y="74" width="170" height="40" rx="4" fill="#ED7D31"/><text x="845" y="99" text-anchor="middle">特色 / 反向 SQL</text>
  </g>

  <!-- Row label header -->
  <rect x="30" y="74" width="120" height="40" rx="4" fill="#595959"/>
  <text x="90" y="99" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">adapter</text>

  <!-- helper colors: green #C6E0B4/#548235  yellow #FFE699/#BF8F00  grey #D9D9D9/#808080 -->

  <!-- Row JDBC -->
  <rect x="30" y="118" width="120" height="46" rx="4" fill="#F2F8FD" stroke="#5B9BD5"/>
  <text x="90" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">JDBC</text>
  <text x="90" y="156" text-anchor="middle" font-size="8.5" fill="#595959">关系型全集</text>
  <rect x="150" y="118" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="210" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text>
  <rect x="272" y="118" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="332" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text>
  <rect x="394" y="118" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="454" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text>
  <rect x="516" y="118" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="576" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text>
  <rect x="638" y="118" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="698" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text>
  <rect x="760" y="118" width="170" height="46" fill="#FBE5D6" stroke="#ffffff" stroke-width="2"/><text x="845" y="141" text-anchor="middle" font-size="8.5" fill="#833C0C">Union/Minus/Modify +</text><text x="845" y="155" text-anchor="middle" font-size="8.5" font-weight="700" fill="#833C0C">RelToSql 方言翻译</text>

  <!-- Row MongoDB -->
  <rect x="30" y="166" width="120" height="46" rx="4" fill="#F4FAF0" stroke="#70AD47"/>
  <text x="90" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">MongoDB</text>
  <text x="90" y="204" text-anchor="middle" font-size="8.5" fill="#595959">BSON 管道</text>
  <rect x="150" y="166" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="210" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text><text x="210" y="202" text-anchor="middle" font-size="8" fill="#385723">$match</text>
  <rect x="272" y="166" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="332" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text><text x="332" y="202" text-anchor="middle" font-size="8" fill="#385723">$project</text>
  <rect x="394" y="166" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="454" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text><text x="454" y="202" text-anchor="middle" font-size="8" fill="#385723">$group</text>
  <rect x="516" y="166" width="120" height="46" fill="#D9D9D9" stroke="#ffffff" stroke-width="2"/><text x="576" y="192" text-anchor="middle" font-size="11" fill="#808080">&#8212;</text>
  <rect x="638" y="166" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="698" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text><text x="698" y="202" text-anchor="middle" font-size="8" fill="#385723">$sort/$limit</text>
  <rect x="760" y="166" width="170" height="46" fill="#FBE5D6" stroke="#ffffff" stroke-width="2"/><text x="845" y="189" text-anchor="middle" font-size="8.5" fill="#833C0C">动态 schema（单列 _MAP）</text><text x="845" y="203" text-anchor="middle" font-size="8.5" fill="#833C0C">ITEM 访问解析嵌套字段</text>

  <!-- Row Druid -->
  <rect x="30" y="214" width="120" height="46" rx="4" fill="#FFFBEF" stroke="#FFC000"/>
  <text x="90" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">Druid</text>
  <text x="90" y="252" text-anchor="middle" font-size="8.5" fill="#595959">时序 OLAP</text>
  <rect x="150" y="214" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="210" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text><text x="210" y="250" text-anchor="middle" font-size="8" fill="#385723">+ 时间区间</text>
  <rect x="272" y="214" width="120" height="46" fill="#FFE699" stroke="#ffffff" stroke-width="2"/><text x="332" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">受限</text><text x="332" y="250" text-anchor="middle" font-size="8" fill="#7F6000">投影/虚拟列</text>
  <rect x="394" y="214" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="454" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text><text x="454" y="250" text-anchor="middle" font-size="8" fill="#385723">+ 时间粒度</text>
  <rect x="516" y="214" width="120" height="46" fill="#D9D9D9" stroke="#ffffff" stroke-width="2"/><text x="576" y="240" text-anchor="middle" font-size="11" fill="#808080">&#8212;</text>
  <rect x="638" y="214" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="698" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text>
  <rect x="760" y="214" width="170" height="46" fill="#FBE5D6" stroke="#ffffff" stroke-width="2"/><text x="845" y="231" text-anchor="middle" font-size="8.5" fill="#833C0C">PostAggregation · Having</text><text x="845" y="245" text-anchor="middle" font-size="8.5" fill="#833C0C">FLOOR(time) 转 granularity</text>

  <!-- Row Elasticsearch -->
  <rect x="30" y="262" width="120" height="46" rx="4" fill="#F3F3F3" stroke="#A5A5A5"/>
  <text x="90" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#595959">Elastic</text>
  <text x="90" y="300" text-anchor="middle" font-size="8.5" fill="#595959">Query DSL</text>
  <rect x="150" y="262" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="210" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text><text x="210" y="298" text-anchor="middle" font-size="8" fill="#385723">PredicateAnalyzer</text>
  <rect x="272" y="262" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="332" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text>
  <rect x="394" y="262" width="120" height="46" fill="#FFE699" stroke="#ffffff" stroke-width="2"/><text x="454" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">受限</text><text x="454" y="298" text-anchor="middle" font-size="8" fill="#7F6000">部分聚合</text>
  <rect x="516" y="262" width="120" height="46" fill="#D9D9D9" stroke="#ffffff" stroke-width="2"/><text x="576" y="288" text-anchor="middle" font-size="11" fill="#808080">&#8212;</text>
  <rect x="638" y="262" width="120" height="46" fill="#C6E0B4" stroke="#ffffff" stroke-width="2"/><text x="698" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">&#10003;</text>
  <rect x="760" y="262" width="170" height="46" fill="#FBE5D6" stroke="#ffffff" stroke-width="2"/><text x="845" y="281" text-anchor="middle" font-size="8.5" fill="#833C0C">版本适配 + ObjectMapper</text><text x="845" y="295" text-anchor="middle" font-size="8.5" fill="#833C0C">scroll 分页拉取</text>

  <!-- Row CSV -->
  <rect x="30" y="310" width="120" height="46" rx="4" fill="#FBF6EA" stroke="#BF8F00"/>
  <text x="90" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">CSV</text>
  <text x="90" y="348" text-anchor="middle" font-size="8.5" fill="#595959">本地文件</text>
  <rect x="150" y="310" width="120" height="46" fill="#FFE699" stroke="#ffffff" stroke-width="2"/><text x="210" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">仅 =</text><text x="210" y="346" text-anchor="middle" font-size="8" fill="#7F6000">EQUALS 字面量</text>
  <rect x="272" y="310" width="120" height="46" fill="#FFE699" stroke="#ffffff" stroke-width="2"/><text x="332" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#7F6000">列裁剪</text><text x="332" y="346" text-anchor="middle" font-size="8" fill="#7F6000">project(fields)</text>
  <rect x="394" y="310" width="120" height="46" fill="#D9D9D9" stroke="#ffffff" stroke-width="2"/><text x="454" y="336" text-anchor="middle" font-size="11" fill="#808080">&#8212;</text>
  <rect x="516" y="310" width="120" height="46" fill="#D9D9D9" stroke="#ffffff" stroke-width="2"/><text x="576" y="336" text-anchor="middle" font-size="11" fill="#808080">&#8212;</text>
  <rect x="638" y="310" width="120" height="46" fill="#D9D9D9" stroke="#ffffff" stroke-width="2"/><text x="698" y="336" text-anchor="middle" font-size="11" fill="#808080">&#8212;</text>
  <rect x="760" y="310" width="170" height="46" fill="#F2F2F2" stroke="#ffffff" stroke-width="2"/><text x="845" y="331" text-anchor="middle" font-size="8.5" fill="#595959">无 ConverterRule</text><text x="845" y="345" text-anchor="middle" font-size="8.5" fill="#595959">余下算子全本地 Enumerable 跑</text>

  <!-- "more pushdown = less local work" gradient note -->
  <rect x="30" y="372" width="900" height="30" rx="4" fill="#FCFCFC" stroke="#BFBFBF"/>
  <text x="44" y="391" font-size="10.5" fill="#595959">下推越多 &#8594; 网络传输与本地计算越少；JDBC 接近全集，CSV 几乎只能整表读出后在 Calcite 内做大部分算子（仅等值 Filter 与列裁剪能省 IO）。</text>

  <!-- Legend -->
  <g>
    <rect x="30" y="416" width="900" height="170" rx="8" fill="#FCFCFC" stroke="#BFBFBF"/>
    <text x="44" y="438" font-size="12" font-weight="700" fill="#262626">图例与口径说明</text>

    <rect x="44" y="450" width="22" height="14" rx="3" fill="#C6E0B4" stroke="#548235"/>
    <text x="74" y="461" font-size="10.5" fill="#385723">原生下推：有专门 ConverterRule，算子整体压到远端</text>
    <rect x="500" y="450" width="22" height="14" rx="3" fill="#FFE699" stroke="#BF8F00"/>
    <text x="530" y="461" font-size="10.5" fill="#7F6000">受限：仅部分形态支持（如只支持等值、或需转写为虚拟列）</text>

    <rect x="44" y="474" width="22" height="14" rx="3" fill="#D9D9D9" stroke="#808080"/>
    <text x="74" y="485" font-size="10.5" fill="#595959">不下推：无对应规则，算子留在上游 Enumerable/Bindable 本地执行</text>
    <rect x="500" y="474" width="22" height="14" rx="3" fill="#FBE5D6" stroke="#C65911"/>
    <text x="530" y="485" font-size="10.5" fill="#833C0C">特色能力：该 adapter 独有的下推/翻译手段</text>

    <text x="44" y="510" font-size="10" fill="#595959">• JDBC Rules：Jdbc{Join,Project,Filter,Aggregate,Sort,Union,Intersect,Minus,TableModification,Values}Rule（见 JdbcRules.foreachRule）。</text>
    <text x="44" y="528" font-size="10" fill="#595959">• MongoDB / Elasticsearch Rules 数组各含 {Sort,Filter,Project,Aggregate}；二者均无 Join 规则（NoSQL 无服务端 join 语义）。</text>
    <text x="44" y="546" font-size="10" fill="#595959">• Druid RULES 含 Filter/Project/Aggregate/Sort + 多条 Transpose + Having + PostAggregation；时间维度由 granularity 特殊处理。</text>
    <text x="44" y="564" font-size="10" fill="#595959">• CSV 无 ConverterRule：CsvFilterableTable.addFilter 只识别 EQUALS(列, 字面量)，CsvTranslatableTable 仅做列裁剪 project(fields)。</text>
    <text x="44" y="580" font-size="9.5" fill="#A6A6A6">口径以 BOUNDARIES 第 18 篇为准；trait/convention 机制本身见第 14 篇，SPI 能力分层见第 17 篇。</text>
  </g>

  <text x="480" y="606" text-anchor="middle" font-size="10" fill="#A6A6A6">图 18-3 — pushdown 能力越靠 JDBC 越全；NoSQL 类 adapter 普遍缺 Join，CSV 仅有最弱的等值 Filter 与列裁剪</text>
</svg>
