<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="dagArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">RexProgram：用 RexLocalRef 把表达式森林压成 DAG</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#595959">exprs[] 存唯一子表达式；projects / condition 只存 $tN 引用 — 公共子表达式只算一次</text>

  <!-- SQL source -->
  <rect x="40" y="68" width="880" height="44" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="56" y="86" font-size="11" font-weight="700" fill="#7F6000">示例 Calc</text>
  <text x="56" y="104" font-family="'SF Mono',Menlo,monospace" font-size="11.5" fill="#262626">SELECT a + b AS x, (a + b) * 2 AS y   WHERE (a + b) &gt; 10        —— 子表达式 (a + b) 出现 3 次</text>

  <!-- LEFT: expanded forest (naive) -->
  <rect x="40" y="130" width="420" height="430" rx="10" fill="#FBE5D6" stroke="#C65911" stroke-width="1.6"/>
  <text x="250" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#833C0C">展开式森林（朴素，子表达式重复 3 份）</text>

  <!-- proj x tree -->
  <rect x="70" y="170" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="125" y="190" text-anchor="middle" font-size="10.5" font-weight="700" fill="#833C0C">project x</text>
  <rect x="70" y="216" width="110" height="28" rx="6" fill="#FFFFFF" stroke="#595959"/>
  <text x="125" y="234" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#262626">+(a, b)</text>
  <line x1="125" y1="200" x2="125" y2="215" stroke="#C65911" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- proj y tree -->
  <rect x="200" y="170" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="255" y="190" text-anchor="middle" font-size="10.5" font-weight="700" fill="#833C0C">project y</text>
  <rect x="200" y="216" width="110" height="28" rx="6" fill="#FFFFFF" stroke="#595959"/>
  <text x="255" y="234" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#262626">*( · , 2)</text>
  <rect x="200" y="260" width="110" height="28" rx="6" fill="#FFFFFF" stroke="#595959"/>
  <text x="255" y="278" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#262626">+(a, b)</text>
  <line x1="255" y1="200" x2="255" y2="215" stroke="#C65911" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="255" y1="244" x2="255" y2="259" stroke="#595959" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- condition tree -->
  <rect x="330" y="170" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="385" y="190" text-anchor="middle" font-size="10.5" font-weight="700" fill="#833C0C">condition</text>
  <rect x="330" y="216" width="110" height="28" rx="6" fill="#FFFFFF" stroke="#595959"/>
  <text x="385" y="234" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#262626">&gt;( · , 10)</text>
  <rect x="330" y="260" width="110" height="28" rx="6" fill="#FFFFFF" stroke="#595959"/>
  <text x="385" y="278" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#262626">+(a, b)</text>
  <line x1="385" y1="200" x2="385" y2="215" stroke="#C65911" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="385" y1="244" x2="385" y2="259" stroke="#595959" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- three copies callout -->
  <rect x="70" y="320" width="370" height="64" rx="8" fill="#FFFFFF" stroke="#C65911" stroke-dasharray="5,3"/>
  <text x="255" y="342" text-anchor="middle" font-size="11" fill="#833C0C">(a + b) 被存了 3 个独立子树</text>
  <text x="255" y="362" text-anchor="middle" font-size="10" fill="#595959">遍历改写 3 次、求值 3 次、digest 比较时各算各的</text>
  <text x="255" y="378" text-anchor="middle" font-size="10" fill="#C65911">缺点：内存 / 算力随重复次数线性膨胀</text>

  <text x="250" y="540" text-anchor="middle" font-size="10.5" fill="#833C0C">RexProgramBuilder 不直接产出这种形态</text>

  <!-- center arrow -->
  <line x1="468" y1="350" x2="500" y2="350" stroke="#1F4E79" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="484" y="338" text-anchor="middle" font-size="10" fill="#1F4E79">registerInternal</text>
  <text x="484" y="368" text-anchor="middle" font-size="9" fill="#1F4E79">exprMap 去重</text>

  <!-- RIGHT: DAG form -->
  <rect x="510" y="130" width="430" height="430" rx="10" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.8"/>
  <text x="725" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">RexProgram DAG（共享，子表达式只 1 份）</text>

  <!-- exprs[] table -->
  <text x="528" y="178" font-size="11" font-weight="700" fill="#1F4E79">exprs[] — 公共子表达式池（拓扑序）</text>
  <g font-size="10" font-family="'SF Mono',Menlo,monospace">
    <rect x="528" y="186" width="394" height="24" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="540" y="202" fill="#262626">$t0 = a   $t1 = b      （输入列，构造时预注册）</text>
    <rect x="528" y="210" width="394" height="24" fill="#ED7D31" stroke="#7F3F00"/>
    <text x="540" y="226" fill="#ffffff">$t2 = +($t0, $t1)      ← (a + b) 只此一份</text>
    <rect x="528" y="234" width="394" height="24" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="540" y="250" fill="#262626">$t3 = 2   $t4 = 10     （字面量）</text>
    <rect x="528" y="258" width="394" height="24" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="540" y="274" fill="#262626">$t5 = *($t2, $t3)</text>
    <rect x="528" y="282" width="394" height="24" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="540" y="298" fill="#262626">$t6 = &gt;($t2, $t4)</text>
  </g>

  <!-- projects / condition referencing -->
  <text x="528" y="330" font-size="11" font-weight="700" fill="#1F4E79">projects / condition — 仅存 RexLocalRef</text>
  <rect x="528" y="340" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="588" y="356" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">project x</text>
  <text x="588" y="369" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#262626">= $t2</text>

  <rect x="664" y="340" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="724" y="356" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">project y</text>
  <text x="724" y="369" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#262626">= $t5</text>

  <rect x="800" y="340" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="860" y="356" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">condition</text>
  <text x="860" y="369" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#262626">= $t6</text>

  <!-- DAG sharing arrows: all converge on $t2 -->
  <line x1="588" y1="340" x2="640" y2="222" stroke="#7F3F00" stroke-width="1.6" marker-end="url(#dagArr)"/>
  <line x1="724" y1="340" x2="700" y2="282" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="700" y1="258" x2="660" y2="234" stroke="#7F3F00" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#dagArr)"/>
  <line x1="860" y1="340" x2="720" y2="306" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="700" y1="282" x2="660" y2="234" stroke="#7F3F00" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#dagArr)"/>

  <!-- benefit callout -->
  <rect x="528" y="392" width="394" height="80" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-dasharray="5,3"/>
  <text x="725" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">三处橙色边都指向同一个 $t2</text>
  <text x="725" y="430" text-anchor="middle" font-size="10" fill="#595959">求值期：(a+b) 算 1 次，结果驻留寄存器供后续复用</text>
  <text x="725" y="446" text-anchor="middle" font-size="10" fill="#595959">改写期：RexShuttle 改 $t2 一处即对全图生效</text>
  <text x="725" y="462" text-anchor="middle" font-size="10" fill="#385723">收益：内存 / CPU 与"唯一子表达式数"成正比，与引用次数无关</text>

  <text x="725" y="500" text-anchor="middle" font-size="10" fill="#1F4E79">EnumerableCalc 据此一次性生成"算一次、用多次"的 Java 代码（codegen 见第 16 篇）</text>

  <!-- legend -->
  <g>
    <rect x="40" y="576" width="880" height="58" rx="6" fill="#F8F8F8" stroke="#BFBFBF"/>
    <text x="56" y="596" font-size="11" font-weight="700" fill="#262626">读法</text>
    <line x1="100" y1="592" x2="130" y2="592" stroke="#7F3F00" stroke-width="1.6" marker-end="url(#dagArr)"/>
    <text x="138" y="596" font-size="10" fill="#595959">指向共享子表达式 $t2 的边（DAG 的"汇聚点"）</text>
    <line x1="100" y1="614" x2="130" y2="614" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="138" y="618" font-size="10" fill="#595959">普通的 RexLocalRef 引用（exprs[] 内部 + project/condition 入口）</text>
    <rect x="556" y="586" width="20" height="12" fill="#ED7D31" stroke="#7F3F00"/>
    <text x="584" y="596" font-size="10" fill="#595959">被多处复用的公共子表达式（CSE 命中）</text>
    <rect x="556" y="608" width="20" height="12" fill="#FBE5D6" stroke="#C65911"/>
    <text x="584" y="618" font-size="10" fill="#595959">左侧朴素展开（仅作对比，实际不产出）</text>
  </g>

  <text x="480" y="664" text-anchor="middle" font-size="10" fill="#A6A6A6">图 05-2 — RexProgramBuilder.registerInternal 以 RexUtil.makeKey(expr) 为键查 exprMap：命中即复用、未命中才追加，从而把森林折成 DAG</text>
  <text x="480" y="684" text-anchor="middle" font-size="10" fill="#A6A6A6">RexLocalRef 的 index 既是 exprs[] 下标，也是 DAG 的一条边</text>
</svg>
