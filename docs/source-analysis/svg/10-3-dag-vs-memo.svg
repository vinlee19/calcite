<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">HEP DAG（单层）  vs  Volcano Memo（双层）</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">HEP 把整棵计划维护成一张 HepRelVertex 的 DAG；Volcano 在 RelSet/RelSubset 上保留所有等价计划</text>

  <!-- ============ LEFT: HEP DAG ============ -->
  <rect x="30" y="74" width="440" height="520" rx="12" fill="#FFF7F0" stroke="#C65911" stroke-width="1.4"/>
  <text x="250" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#833C0C">HepPlanner · 单层 DAG · 启发式贪心</text>
  <text x="250" y="116" text-anchor="middle" font-size="10.5" fill="#833C0C">一个顶点 = 一个 currentRel；规则命中即原位替换，不保留旧形态</text>

  <!-- DAG nodes -->
  <rect x="170" y="134" width="160" height="46" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.4"/>
  <text x="250" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#833C0C">HepRelVertex (root)</text>
  <text x="250" y="170" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">currentRel = Aggregate</text>

  <rect x="170" y="208" width="160" height="46" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.4"/>
  <text x="250" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#833C0C">HepRelVertex</text>
  <text x="250" y="244" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">currentRel = Join</text>

  <rect x="70" y="290" width="150" height="46" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.4"/>
  <text x="145" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#833C0C">HepRelVertex</text>
  <text x="145" y="326" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">currentRel = Filter</text>

  <rect x="280" y="290" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#C65911" stroke-width="1.4"/>
  <text x="355" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#833C0C">HepRelVertex</text>
  <text x="355" y="326" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">Scan(dept) ← 共享</text>

  <rect x="70" y="368" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#C65911" stroke-width="1.4"/>
  <text x="145" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#833C0C">HepRelVertex</text>
  <text x="145" y="404" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#833C0C">Scan(emp)</text>

  <!-- edges parent->child -->
  <line x1="250" y1="180" x2="250" y2="208" stroke="#C65911" stroke-width="1.4" marker-end="url(#arrowO)"/>
  <line x1="220" y1="254" x2="160" y2="290" stroke="#C65911" stroke-width="1.4" marker-end="url(#arrowO)"/>
  <line x1="280" y1="254" x2="345" y2="290" stroke="#C65911" stroke-width="1.4" marker-end="url(#arrowO)"/>
  <line x1="145" y1="336" x2="145" y2="368" stroke="#C65911" stroke-width="1.4" marker-end="url(#arrowO)"/>

  <!-- in-place replace annotation -->
  <rect x="55" y="436" width="390" height="64" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.3"/>
  <text x="250" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">replaceRel：Filter 下推后顶点仍是同一个</text>
  <text x="250" y="473" text-anchor="middle" font-size="9.5" fill="#FFF2CC">currentRel: Filter(Scan) &#8594; FilteredScan</text>
  <text x="250" y="488" text-anchor="middle" font-size="9.5" fill="#FFF2CC">旧 currentRel 直接丢弃，无"等价集"保留</text>

  <rect x="55" y="510" width="390" height="74" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.1"/>
  <text x="68" y="528" font-size="10.5" font-weight="700" fill="#262626">特性</text>
  <text x="68" y="545" font-size="9.5" fill="#262626">• mapDigestToVertex 去重 &#8594; 公共子表达式共享同一顶点</text>
  <text x="68" y="560" font-size="9.5" fill="#262626">• 无代价空间搜索；只对单条规则的多结果比本地代价</text>
  <text x="68" y="575" font-size="9.5" fill="#262626">• 内存 &#8776; O(计划大小)；执行顺序由 HepProgram 指令决定</text>

  <!-- ============ RIGHT: Volcano Memo ============ -->
  <rect x="490" y="74" width="440" height="520" rx="12" fill="#F2F7FB" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="710" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1F4E79">VolcanoPlanner · 双层 Memo · 代价驱动</text>
  <text x="710" y="116" text-anchor="middle" font-size="10.5" fill="#1F4E79">RelSet = 语义等价类；RelSubset = 按 trait 分组；保留全部候选</text>

  <!-- RelSet outer -->
  <rect x="520" y="134" width="380" height="138" rx="10" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="538" y="153" font-size="11" font-weight="700" fill="#1F4E79">RelSet #1 （等价集：所有 = 该子查询的形态）</text>

  <!-- subsets -->
  <rect x="538" y="164" width="166" height="46" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="621" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">RelSubset [NONE]</text>
  <text x="621" y="198" text-anchor="middle" font-size="8.5" fill="#595959">LogicalJoin, ...</text>

  <rect x="716" y="164" width="166" height="46" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="799" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">RelSubset [ENUMERABLE]</text>
  <text x="799" y="198" text-anchor="middle" font-size="8.5" fill="#FFF2CC">EnumHashJoin (best)</text>

  <rect x="538" y="218" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-dasharray="3,2"/>
  <text x="710" y="236" text-anchor="middle" font-size="9.5" fill="#595959">同一 RelSet 内并存多个等价计划，各带 cost</text>
  <text x="710" y="251" text-anchor="middle" font-size="9.5" fill="#595959">bestCost 在 RelSubset 上做动态规划择优</text>

  <!-- child RelSets -->
  <rect x="520" y="290" width="180" height="84" rx="10" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="610" y="308" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">RelSet #2 (emp)</text>
  <rect x="534" y="318" width="152" height="22" rx="4" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="610" y="333" text-anchor="middle" font-size="8.5" fill="#595959">Subset[NONE] Scan</text>
  <rect x="534" y="344" width="152" height="22" rx="4" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="610" y="359" text-anchor="middle" font-size="8.5" fill="#595959">Subset[ENUM] EnumScan</text>

  <rect x="720" y="290" width="180" height="84" rx="10" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="810" y="308" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">RelSet #3 (dept)</text>
  <rect x="734" y="318" width="152" height="22" rx="4" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="810" y="333" text-anchor="middle" font-size="8.5" fill="#595959">Subset[NONE] Scan</text>
  <rect x="734" y="344" width="152" height="22" rx="4" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="810" y="359" text-anchor="middle" font-size="8.5" fill="#595959">Subset[ENUM] EnumScan</text>

  <line x1="600" y1="272" x2="610" y2="290" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="800" y1="272" x2="810" y2="290" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="505" y="392" width="410" height="100" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.1"/>
  <text x="518" y="410" font-size="10.5" font-weight="700" fill="#262626">特性</text>
  <text x="518" y="427" font-size="9.5" fill="#262626">• 保留所有等价计划 + 物理变体（trait）&#8594; 全局最优可达</text>
  <text x="518" y="442" font-size="9.5" fill="#262626">• RuleQueue 调度 + cost 传播；可回溯、可剪枝</text>
  <text x="518" y="457" font-size="9.5" fill="#262626">• 内存/时间随候选数膨胀；trait 与 Convention 一等公民</text>
  <text x="518" y="474" font-size="9.5" fill="#262626">• 细节见 &#8594; 第 11 篇 VolcanoPlanner（本篇不展开 Memo 内部）</text>

  <!-- comparison strip -->
  <rect x="505" y="506" width="410" height="78" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.1"/>
  <text x="518" y="524" font-size="10.5" font-weight="700" fill="#7F6000">选型直觉</text>
  <text x="518" y="541" font-size="9.5" fill="#7F6000">• HEP：确定性、可控顺序的"清理/规范化"阶段（下推、合并）</text>
  <text x="518" y="556" font-size="9.5" fill="#7F6000">• Volcano：需要代价权衡的"物理实现选择"（join 顺序/算法）</text>
  <text x="518" y="571" font-size="9.5" fill="#7F6000">• 实战常两者串联：先 HEP 整形，再 Volcano 定物理</text>

  <text x="480" y="618" text-anchor="middle" font-size="10.5" fill="#595959">左：橙系 = 写图热点（原位替换）；右：橙色子集 = 当前 best 物理计划</text>
  <text x="480" y="642" text-anchor="middle" font-size="10" fill="#A6A6A6">图 10-3 — HEP 单层 DAG 用一个顶点表示"当前选择"；Volcano 双层 Memo 把"所有可能选择"都留在 RelSet/RelSubset 里</text>
</svg>
