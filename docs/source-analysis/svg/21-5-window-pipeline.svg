<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="stage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">开窗函数全链路：OVER → RexOver → LogicalWindow → EnumerableWindow</text>
  <text x="520" y="50" text-anchor="middle" font-size="12" fill="#595959">关键一步（橙）把行级聚合调用包成带窗口规格的 RexOver；随后规则再把它提升成关系级 Window 算子</text>

  <!-- example SQL -->
  <rect x="28" y="66" width="984" height="48" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="42" y="85" font-size="11" font-weight="700" fill="#7F6000">示例 SQL（带帧的窗口聚合）</text>
  <text x="42" y="104" font-size="11" font-family="'SF Mono',Menlo,monospace" fill="#262626">SELECT deptno, sum(sal) OVER (PARTITION BY deptno ORDER BY hiredate ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM emp</text>

  <!-- stage headers -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="28"  y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="228" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="428" y="130" width="184" height="26" rx="5" fill="#ED7D31" stroke="#7F3F00"/>
    <rect x="628" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="828" y="130" width="184" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="120" y="148" fill="#1F4E79">① Parse</text>
    <text x="320" y="148" fill="#1F4E79">② Validate</text>
    <text x="520" y="148" fill="#ffffff">③ Convert ★关键一步</text>
    <text x="720" y="148" fill="#1F4E79">④ Optimize</text>
    <text x="920" y="148" fill="#1F4E79">⑤ Execute</text>
  </g>

  <!-- stage 1 -->
  <rect x="28" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="44" y="186" width="152" height="44" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="120" y="205" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F4E79">SqlBasicCall(OVER)</text>
  <text x="120" y="221" text-anchor="middle" font-size="8.4" fill="#595959">SqlOverOperator</text>
  <line x1="120" y1="230" x2="120" y2="244" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="44" y="244" width="152" height="34" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="120" y="265" text-anchor="middle" font-size="9.2" fill="#262626">[0] SqlCall SUM(sal)</text>
  <rect x="44" y="284" width="152" height="78" rx="6" fill="#FFF2CC" stroke="#BF8F00"/>
  <text x="120" y="301" text-anchor="middle" font-size="9.6" font-weight="700" fill="#7F6000">[1] SqlWindow</text>
  <text x="120" y="316" text-anchor="middle" font-size="8" fill="#7F6000">partitionList=[deptno]</text>
  <text x="120" y="328" text-anchor="middle" font-size="8" fill="#7F6000">orderList=[hiredate]</text>
  <text x="120" y="340" text-anchor="middle" font-size="8" fill="#7F6000">isRows=true</text>
  <text x="120" y="352" text-anchor="middle" font-size="8" fill="#7F6000">bounds=UNBOUNDED..CURRENT</text>
  <text x="44" y="390" font-size="9" fill="#888">锚点</text>
  <text x="44" y="404" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">SqlOverOperator</text>
  <text x="44" y="416" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">SqlWindow</text>

  <!-- stage 2 -->
  <rect x="228" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="244" y="186" width="152" height="44" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="320" y="204" text-anchor="middle" font-size="9.8" font-weight="700" fill="#385723">validateWindow :6217</text>
  <text x="320" y="220" text-anchor="middle" font-size="8.2" fill="#385723">在 OverScope 内校验聚合</text>
  <line x1="320" y1="230" x2="320" y2="244" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="244" y="244" width="152" height="56" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="320" y="262" text-anchor="middle" font-size="9.8" font-weight="700" fill="#385723">SqlWindow.validate :607</text>
  <text x="320" y="277" text-anchor="middle" font-size="8.2" fill="#385723">ORDER BY 必备性</text>
  <text x="320" y="289" text-anchor="middle" font-size="8.2" fill="#385723">ROWS vs RANGE 边界类型</text>
  <rect x="244" y="312" width="152" height="40" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="320" y="330" text-anchor="middle" font-size="9.4" font-weight="700" fill="#385723">resolveWindow :6166</text>
  <text x="320" y="343" text-anchor="middle" font-size="8.2" fill="#385723">合并 WINDOW 命名窗口</text>
  <text x="244" y="386" font-size="9" fill="#888">锚点（→第 07 篇）</text>
  <text x="244" y="400" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">OverScope</text>
  <text x="244" y="412" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#595959">validateFrameBoundary:741</text>

  <!-- stage 3 key -->
  <rect x="428" y="170" width="184" height="380" rx="8" fill="#FBE5D6" stroke="#7F3F00" stroke-width="1.6"/>
  <rect x="444" y="186" width="152" height="44" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="520" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#833C0C">convertOver :2385</text>
  <text x="520" y="220" text-anchor="middle" font-size="8.2" fill="#595959">归一化帧边界 + 转 partition/order</text>
  <line x1="520" y1="230" x2="520" y2="244" stroke="#7F3F00" stroke-width="1.4" marker-end="url(#stage)"/>
  <rect x="444" y="244" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#C65911"/>
  <text x="520" y="263" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">HistogramShuttle :6315</text>
  <text x="520" y="278" text-anchor="middle" font-size="8.2" fill="#595959">遍历聚合树，逐个 agg 包成</text>
  <text x="520" y="289" text-anchor="middle" font-size="8.2" fill="#595959">RexOver（含 AVG→SUM/COUNT）</text>
  <line x1="520" y1="292" x2="520" y2="310" stroke="#7F3F00" stroke-width="1.8" marker-end="url(#stage)"/>
  <rect x="444" y="310" width="152" height="80" rx="6" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.4"/>
  <text x="520" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">RexOver</text>
  <text x="520" y="346" text-anchor="middle" font-size="8.2" fill="#FFF2CC">op=SUM, operands=[$sal]</text>
  <text x="520" y="358" text-anchor="middle" font-size="8.2" fill="#FFF2CC">window=RexWindow{</text>
  <text x="520" y="370" text-anchor="middle" font-size="8.2" fill="#FFF2CC">partitionKeys, orderKeys,</text>
  <text x="520" y="382" text-anchor="middle" font-size="8.2" fill="#FFF2CC">lower/upper bound, isRows}</text>
  <text x="444" y="414" font-size="9" fill="#833C0C">窗口规格从"句法"变成</text>
  <text x="444" y="427" font-size="9" fill="#833C0C">行表达式里的一等对象。</text>

  <!-- stage 4 -->
  <rect x="628" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="644" y="186" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="720" y="204" text-anchor="middle" font-size="9.6" font-weight="700" fill="#1F4E79">ProjectToWindowRule</text>
  <text x="720" y="220" text-anchor="middle" font-size="8.2" fill="#595959">Project 含 RexOver → 拆分</text>
  <text x="720" y="231" text-anchor="middle" font-size="8" fill="#888">→第 12 篇 规则机制</text>
  <line x1="720" y1="234" x2="720" y2="250" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="644" y="250" width="152" height="78" rx="6" fill="#1F4E79"/>
  <text x="720" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">LogicalWindow</text>
  <text x="720" y="286" text-anchor="middle" font-size="8.2" fill="#DEEBF7">Group{keys=[deptno],</text>
  <text x="720" y="298" text-anchor="middle" font-size="8.2" fill="#DEEBF7">orderKeys=[hiredate],</text>
  <text x="720" y="310" text-anchor="middle" font-size="8.2" fill="#DEEBF7">frame=ROWS UNB..CUR,</text>
  <text x="720" y="322" text-anchor="middle" font-size="8.2" fill="#DEEBF7">aggCalls=[RexWinAggCall]}</text>
  <text x="644" y="356" font-size="9" fill="#385723">产物：关系级 Window 算子，</text>
  <text x="644" y="369" font-size="9" fill="#385723">同窗口的多个聚合归一组</text>
  <text x="644" y="382" font-size="9" fill="#385723">（Group），共享分区/排序。</text>

  <!-- stage 5 -->
  <rect x="828" y="170" width="184" height="380" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.3"/>
  <rect x="844" y="186" width="152" height="64" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="920" y="205" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F4E79">EnumerableWindow</text>
  <text x="920" y="221" text-anchor="middle" font-size="8.2" fill="#595959">按 deptno 分桶</text>
  <text x="920" y="233" text-anchor="middle" font-size="8.2" fill="#595959">桶内按 hiredate 排序</text>
  <text x="920" y="245" text-anchor="middle" font-size="8.2" fill="#595959">滑动帧累加 SUM</text>
  <line x1="920" y1="250" x2="920" y2="266" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="844" y="266" width="152" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="920" y="285" text-anchor="middle" font-size="9.6" font-weight="700" fill="#1F4E79">Janino 编译</text>
  <text x="920" y="299" text-anchor="middle" font-size="8" fill="#595959">→ Bindable.bind()</text>
  <text x="844" y="330" font-size="8" fill="#888">→第 16 篇</text>
  <line x1="920" y1="338" x2="920" y2="354" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="844" y="354" width="152" height="44" rx="6" fill="#E2EFDA" stroke="#548235"/>
  <text x="920" y="373" text-anchor="middle" font-size="10.5" font-weight="700" fill="#385723">结果行 Enumerator</text>
  <text x="920" y="388" text-anchor="middle" font-size="8.2" fill="#385723">每行带累计 sum</text>

  <!-- stage advance -->
  <line x1="212" y1="360" x2="228" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="412" y1="360" x2="428" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="612" y1="360" x2="628" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="812" y1="360" x2="828" y2="360" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>

  <text x="520" y="578" text-anchor="middle" font-size="10" fill="#A6A6A6">图 21-5 — 橙色列为关键一步：HistogramShuttle 把 SUM 调用包成 RexOver；规则再把行级 RexOver 提升为关系级 Window.Group</text>
</svg>
