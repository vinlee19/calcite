<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#548235"/>
    </marker>
    <linearGradient id="bgCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="940" height="660" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">RelDataTypeFactoryImpl 的二级缓存与 Flyweight interning</text>
  <text x="470" y="53" text-anchor="middle" font-size="12" fill="#595959">所有 create* / copy* 出口都汇入 canonize()，保证「类型相等 ⇔ 同一 Java 对象」</text>

  <!-- caller layer -->
  <g>
    <rect x="40" y="76" width="860" height="62" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
    <text x="58" y="98" font-size="13" font-weight="700" fill="#7F6000">调用方（同一类型反复被请求）</text>
    <rect x="58" y="106" width="190" height="26" rx="4" fill="#ffffff" stroke="#BF8F00"/>
    <text x="153" y="123" text-anchor="middle" font-size="10" fill="#595959">createSqlType(INTEGER)</text>
    <rect x="262" y="106" width="220" height="26" rx="4" fill="#ffffff" stroke="#BF8F00"/>
    <text x="372" y="123" text-anchor="middle" font-size="10" fill="#595959">createStructType(names, types)</text>
    <rect x="496" y="106" width="220" height="26" rx="4" fill="#ffffff" stroke="#BF8F00"/>
    <text x="606" y="123" text-anchor="middle" font-size="10" fill="#595959">createTypeWithNullability(t, true)</text>
    <rect x="730" y="106" width="155" height="26" rx="4" fill="#ffffff" stroke="#BF8F00"/>
    <text x="807" y="123" text-anchor="middle" font-size="10" fill="#595959">RelDataTypeFactory.Builder</text>
  </g>

  <line x1="470" y1="138" x2="470" y2="162" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- canonize hub -->
  <g>
    <rect x="300" y="162" width="340" height="56" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.5"/>
    <text x="470" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">canonize(...)  —  唯一收敛点</text>
    <text x="470" y="205" text-anchor="middle" font-size="10" fill="#FFF2CC">protected，子类全部构造完类型后必经此门</text>
  </g>

  <!-- two paths -->
  <line x1="380" y1="218" x2="240" y2="270" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="250" font-size="10" fill="#1F4E79">struct 走 Key 路径</text>
  <line x1="560" y1="218" x2="700" y2="270" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="250" font-size="10" fill="#1F4E79">非 struct 走 intern 路径</text>

  <!-- left: KEY2TYPE_CACHE -->
  <g>
    <rect x="60" y="272" width="370" height="158" rx="8" fill="url(#bgCore)" stroke="#1F4E79" stroke-width="2"/>
    <text x="78" y="294" font-size="13" font-weight="700" fill="#1F4E79">① KEY2TYPE_CACHE（一级：按内容查找）</text>
    <text x="78" y="313" font-size="10" fill="#595959">static LoadingCache&lt;Key, RelDataType&gt; · softValues()</text>

    <rect x="78" y="324" width="150" height="44" rx="6" fill="#ffffff" stroke="#1F4E79"/>
    <text x="153" y="343" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">Key</text>
    <text x="153" y="359" text-anchor="middle" font-size="9" fill="#595959">kind+names+types+nullable</text>

    <rect x="252" y="324" width="160" height="44" rx="6" fill="#ffffff" stroke="#1F4E79"/>
    <text x="332" y="343" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">keyToType(key)</text>
    <text x="332" y="359" text-anchor="middle" font-size="9" fill="#595959">miss 时建 RelRecordType</text>

    <line x1="228" y1="346" x2="252" y2="346" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="78" y="392" font-size="10" fill="#385723">命中：直接返回已有对象（不重建 field 列表）</text>
    <text x="78" y="410" font-size="10" fill="#595959">先用「廉价临时 Key」探测；miss 才复制成不可变永久 Key</text>
    <text x="78" y="426" font-size="10" fill="#595959">softValues：内存吃紧时整条目可被 GC 回收</text>
  </g>

  <!-- right: DATATYPE_CACHE interner -->
  <g>
    <rect x="510" y="272" width="370" height="158" rx="8" fill="url(#bgCore)" stroke="#1F4E79" stroke-width="2"/>
    <text x="528" y="294" font-size="13" font-weight="700" fill="#1F4E79">② DATATYPE_CACHE（二级：身份规范化）</text>
    <text x="528" y="313" font-size="10" fill="#595959">static Interner&lt;RelDataType&gt; · newWeakInterner()</text>

    <rect x="528" y="324" width="334" height="46" rx="6" fill="#ffffff" stroke="#1F4E79"/>
    <text x="695" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">DATATYPE_CACHE.intern(type)</text>
    <text x="695" y="360" text-anchor="middle" font-size="9" fill="#595959">用 equals()/hashCode() 判等，返回首个等价实例</text>

    <text x="528" y="392" font-size="10" fill="#385723">同 digest 的类型对象在堆中只保留一份（Flyweight）</text>
    <text x="528" y="410" font-size="10" fill="#595959">weakInterner：无强引用的类型条目可被 GC 回收</text>
    <text x="528" y="426" font-size="10" fill="#595959">收益：类型比较退化为 == 引用比较，O(1) 且省内存</text>
  </g>

  <!-- return -->
  <line x1="245" y1="430" x2="430" y2="470" stroke="#548235" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowBack)"/>
  <line x1="695" y1="430" x2="510" y2="470" stroke="#548235" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowBack)"/>

  <!-- canonical pool -->
  <g>
    <rect x="300" y="470" width="340" height="74" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
    <text x="470" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">规范化结果：canonical RelDataType</text>
    <text x="470" y="512" text-anchor="middle" font-size="10" fill="#385723">a.createSqlType(INTEGER) == b.createSqlType(INTEGER) → true</text>
    <text x="470" y="530" text-anchor="middle" font-size="10" fill="#595959">RelDataTypeFactory 接口契约：两类型相等 当且仅当 是同一对象</text>
  </g>

  <!-- consumer -->
  <line x1="470" y1="544" x2="470" y2="566" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <g>
    <rect x="120" y="566" width="700" height="46" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.3"/>
    <text x="470" y="586" text-anchor="middle" font-size="11" fill="#262626">下游受益方：RelNode.rowType 缓存 · RexNode.digest 去重 · Volcano memo 的 RelDigest 比较</text>
    <text x="470" y="603" text-anchor="middle" font-size="10" fill="#595959">类型对象 == 比较廉价，是整条编译/优化链路高频操作能保持低成本的隐形基石</text>
  </g>

  <text x="470" y="640" text-anchor="middle" font-size="10" fill="#A6A6A6">图 06-1 — 蓝实线=请求流向，绿虚线=规范化返回，灰虚线=被下游消费；两级缓存均为 static（进程级共享）</text>
</svg>
