<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#548235"/>
    </marker>
    <linearGradient id="bgBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">Enumerable 编译生命周期：RelNode 如何变成可执行字节码</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">toBindable() 全流程 · implement() 生成 linq4j 表达式 → toString 源码 → Janino 编译 → newInstance → bind</text>

  <!-- Stage 1: physical RelNode -->
  <rect x="40" y="78" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="150" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">① 物理 RelNode 树</text>
  <text x="150" y="120" text-anchor="middle" font-size="10" fill="#595959">EnumerableHashJoin / Calc ...</text>
  <text x="150" y="136" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#7F3F00">EnumerableConvention</text>

  <!-- Stage 2: implementRoot -->
  <rect x="320" y="78" width="240" height="70" rx="8" fill="url(#bgBox)" stroke="#1F4E79" stroke-width="2"/>
  <text x="440" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">② EnumerableRelImplementor</text>
  <text x="440" y="118" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">implementRoot(rel, prefer)</text>
  <text x="440" y="135" text-anchor="middle" font-size="9.5" fill="#595959">递归 visitChild → 拼装 Result 三元组</text>

  <!-- Stage 3: ClassDeclaration -->
  <rect x="620" y="78" width="300" height="70" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="770" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">③ ClassDeclaration "Baz"</text>
  <text x="770" y="118" text-anchor="middle" font-size="9.5" fill="#595959">含 bind(root) + getElementType()</text>
  <text x="770" y="135" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">implements Bindable / ArrayBindable</text>

  <line x1="260" y1="113" x2="318" y2="113" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="113" x2="618" y2="113" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: toString source -->
  <rect x="620" y="190" width="300" height="80" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="770" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#262626">④ Java 源码字符串</text>
  <text x="636" y="230" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">public final class Baz implements</text>
  <text x="636" y="244" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">  org.apache..ArrayBindable {</text>
  <text x="636" y="258" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">  public Enumerable bind(DataContext root){..}}</text>

  <line x1="770" y1="148" x2="770" y2="188" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="782" y="172" font-size="9.5" fill="#595959">Expressions.toString</text>

  <!-- Hook + Debug callouts -->
  <rect x="320" y="190" width="270" height="36" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.2"/>
  <text x="455" y="207" text-anchor="middle" font-size="10" fill="#7F6000">Hook.JAVA_PLAN.run(s)  ·  -Dcalcite.debug=true</text>
  <text x="455" y="220" text-anchor="middle" font-size="9" fill="#7F6000">观察点：把生成源码打到 stdout / 测试钩子</text>
  <line x1="618" y1="222" x2="592" y2="218" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Stage 5: BINDABLE_CACHE -->
  <rect x="600" y="300" width="340" height="78" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
  <text x="770" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">⑤ BINDABLE_CACHE  (Guava LoadingCache)</text>
  <text x="770" y="340" text-anchor="middle" font-size="9.5" fill="#385723">key = 生成源码字符串  →  value = Bindable 实例</text>
  <text x="770" y="356" text-anchor="middle" font-size="9.5" fill="#385723">命中即跳过编译；StaticFieldDetector 检出静态字段则绕过缓存</text>
  <text x="770" y="370" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F3F00">calcite.bindable.cache.maxSize (默认 0 = 关闭)</text>

  <line x1="770" y1="270" x2="770" y2="298" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 6: Janino compile -->
  <rect x="320" y="300" width="240" height="78" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="2"/>
  <text x="440" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">⑥ Janino ISimpleCompiler</text>
  <text x="440" y="342" text-anchor="middle" font-size="9.5" fill="#FFF2CC">compiler.cook(s)  在 JVM 内编译</text>
  <text x="440" y="358" text-anchor="middle" font-size="9.5" fill="#FFF2CC">loadClass(name).newInstance()</text>
  <text x="440" y="372" text-anchor="middle" font-size="9" fill="#FFF2CC">缓存未命中才走这里（编译昂贵）</text>

  <line x1="598" y1="339" x2="562" y2="339" stroke="#548235" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowBack)"/>
  <text x="566" y="333" font-size="9" fill="#385723">miss → compile</text>

  <!-- Stage 7: Bindable instance -->
  <rect x="40" y="300" width="240" height="78" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="160" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">⑦ Bindable 实例</text>
  <text x="160" y="342" text-anchor="middle" font-size="9.5" fill="#595959">框架内部句柄（非用户 API）</text>
  <text x="160" y="358" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">Bindable / ArrayBindable</text>
  <text x="160" y="372" text-anchor="middle" font-size="9" fill="#595959">单字段 → Bindable+Typed；多字段 → ArrayBindable</text>

  <line x1="318" y1="339" x2="282" y2="339" stroke="#548235" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowBack)"/>

  <!-- Stage 8: bind(dataContext) -->
  <rect x="40" y="430" width="240" height="74" rx="8" fill="url(#bgBox)" stroke="#1F4E79" stroke-width="2"/>
  <text x="160" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">⑧ bind(DataContext)</text>
  <text x="160" y="472" text-anchor="middle" font-size="9.5" fill="#1a1a1a">注入运行期环境（schema/参数/线程）</text>
  <text x="160" y="488" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#7F3F00">→ Enumerable&lt;Object[]&gt;</text>

  <line x1="160" y1="378" x2="160" y2="428" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 9: enumerator pull -->
  <rect x="320" y="430" width="240" height="74" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="440" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">⑨ Enumerator 拉取</text>
  <text x="440" y="472" text-anchor="middle" font-size="9.5" fill="#595959">ResultSet.next → moveNext()/current()</text>
  <text x="440" y="488" text-anchor="middle" font-size="9.5" fill="#595959">pull-based 惰性管道，逐行产出</text>

  <line x1="280" y1="467" x2="318" y2="467" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Note box bottom -->
  <rect x="600" y="430" width="340" height="74" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="770" y="450" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">关键不变量</text>
  <text x="616" y="468" font-size="9.5" fill="#262626">· 编译期=生成代码；运行期=零反射、零解释开销</text>
  <text x="616" y="483" font-size="9.5" fill="#262626">· 缓存 key 是源码字符串：结构相同的查询复用类</text>
  <text x="616" y="498" font-size="9.5" fill="#262626">· spark.enabled 时改走 spark.compile 分支</text>

  <!-- divider line for compile-time vs run-time -->
  <line x1="20" y1="408" x2="940" y2="408" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="30" y="402" font-size="10" font-weight="700" fill="#A6A6A6">编译期（一次）</text>
  <text x="30" y="424" font-size="10" font-weight="700" fill="#A6A6A6">运行期（每次执行）</text>

  <!-- Legend -->
  <rect x="40" y="540" width="880" height="96" rx="6" fill="#FCFCFC" stroke="#BFBFBF"/>
  <text x="56" y="560" font-size="11" font-weight="700" fill="#595959">图例</text>
  <rect x="56" y="572" width="22" height="14" rx="3" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="86" y="583" font-size="10" fill="#1a1a1a">关键热点（Janino 编译）</text>
  <rect x="260" y="572" width="22" height="14" rx="3" fill="#E2EFDA" stroke="#548235"/>
  <text x="290" y="583" font-size="10" fill="#1a1a1a">缓存层（避免重复编译）</text>
  <rect x="470" y="572" width="22" height="14" rx="3" fill="url(#bgBox)" stroke="#1F4E79"/>
  <text x="500" y="583" font-size="10" fill="#1a1a1a">核心实现者 / 入口</text>
  <line x1="660" y1="579" x2="694" y2="579" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="583" font-size="10" fill="#1a1a1a">正向数据流</text>
  <line x1="56" y1="608" x2="90" y2="608" stroke="#548235" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowBack)"/>
  <text x="96" y="612" font-size="10" fill="#1a1a1a">返回 / 反向流（编译结果回传）</text>
  <line x1="300" y1="608" x2="334" y2="608" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="340" y="612" font-size="10" fill="#1a1a1a">观察钩子 / 旁路</text>

  <text x="480" y="668" text-anchor="middle" font-size="10" fill="#A6A6A6">图 16-1 — 蓝线为正向调用，绿色虚线为编译产物回传；橙色块是唯一昂贵步骤，绿色缓存把它跳过</text>
</svg>
