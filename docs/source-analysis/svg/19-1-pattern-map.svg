<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#595959"/>
    </marker>
    <linearGradient id="bgHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">设计模式 → Calcite 代码实例映射全景</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">GoF + 函数式 + 工程惯用法在 Apache Calcite 中的最佳落地点（每个模式标注主讲篇）</text>

  <!-- Column headers -->
  <g font-size="11" font-weight="700" fill="#1F4E79">
    <rect x="30"  y="70" width="150" height="30" rx="5" fill="url(#bgHead)" stroke="#1F4E79"/><text x="105" y="90" text-anchor="middle">模式 Pattern</text>
    <rect x="184" y="70" width="300" height="30" rx="5" fill="url(#bgHead)" stroke="#1F4E79"/><text x="334" y="90" text-anchor="middle">代码实例（最佳样本）</text>
    <rect x="488" y="70" width="320" height="30" rx="5" fill="url(#bgHead)" stroke="#1F4E79"/><text x="648" y="90" text-anchor="middle">解决的问题 / 工程收益</text>
    <rect x="812" y="70" width="118" height="30" rx="5" fill="url(#bgHead)" stroke="#1F4E79"/><text x="871" y="90" text-anchor="middle">主讲篇</text>
  </g>

  <!-- Rows -->
  <g font-size="10.5" fill="#1a1a1a">
    <!-- Builder -->
    <rect x="30"  y="104" width="150" height="60" fill="#FFF2CC" stroke="#BF8F00"/>
    <text x="40" y="128" font-size="11" font-weight="700" fill="#7F6000">Builder</text>
    <text x="40" y="146" font-size="9.5" fill="#7F6000">流式构造</text>
    <rect x="184" y="104" width="300" height="60" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="124" font-family="'SF Mono',Menlo,monospace" font-size="9.5">RelBuilder（ArrayDeque&lt;Frame&gt; 栈）</text>
    <text x="194" y="140" font-family="'SF Mono',Menlo,monospace" font-size="9.5">RexProgramBuilder · RelDataTypeFactory.Builder</text>
    <text x="194" y="156" font-size="9.5" fill="#595959">scan().filter().project().build() 链式</text>
    <rect x="488" y="104" width="320" height="60" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="128">把多参构造拆成可读的 fluent 步骤；隐藏 RexInputRef</text>
    <text x="498" y="146">索引、字段对齐、Project 合并等繁琐细节</text>
    <rect x="812" y="104" width="118" height="60" fill="#ED7D31" stroke="#7F3F00"/>
    <text x="871" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">19（本篇）</text>

    <!-- Abstract Factory -->
    <rect x="30"  y="166" width="150" height="50" fill="#FFF2CC" stroke="#BF8F00"/>
    <text x="40" y="188" font-size="11" font-weight="700" fill="#7F6000">Abstract Factory</text>
    <text x="40" y="204" font-size="9.5" fill="#7F6000">可替换工厂族</text>
    <rect x="184" y="166" width="300" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="186" font-family="'SF Mono',Menlo,monospace" font-size="9.5">RelFactories.{Filter,Project,Join}Factory</text>
    <text x="194" y="202" font-family="'SF Mono',Menlo,monospace" font-size="9.5">Struct 聚合 · DEFAULT_* 单例</text>
    <rect x="488" y="166" width="320" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="186">同一段构造代码换工厂即产出 Logical / Hive 等</text>
    <text x="498" y="202">不同节点族，规则与 adapter 复用同一构造逻辑</text>
    <rect x="812" y="166" width="118" height="50" fill="#ED7D31" stroke="#7F3F00"/>
    <text x="871" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">19（本篇）</text>

    <!-- Visitor -->
    <rect x="30"  y="218" width="150" height="50" fill="#E2EFDA" stroke="#548235"/>
    <text x="40" y="240" font-size="11" font-weight="700" fill="#385723">Visitor / Shuttle</text>
    <text x="40" y="256" font-size="9.5" fill="#385723">双分派遍历</text>
    <rect x="184" y="218" width="300" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="238" font-family="'SF Mono',Menlo,monospace" font-size="9.5">SqlVisitor · RelShuttle · RexShuttle</text>
    <text x="194" y="254" font-family="'SF Mono',Menlo,monospace" font-size="9.5">linq4j tree.Shuttle（四层各一套）</text>
    <rect x="488" y="218" width="320" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="238">在不可变 IR 上无侵入新增遍历/改写算法；</text>
    <text x="498" y="254">Shuttle 返回新节点保持引用相等的不变量</text>
    <rect x="812" y="218" width="118" height="50" fill="#ED7D31" stroke="#7F3F00"/>
    <text x="871" y="240" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">19 + 03/04/05</text>

    <!-- Registry -->
    <rect x="30"  y="270" width="150" height="50" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="40" y="292" font-size="11" font-weight="700" fill="#1F4E79">Registry</text>
    <text x="40" y="308" font-size="9.5" fill="#1F4E79">中央注册表</text>
    <rect x="184" y="270" width="300" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="290" font-family="'SF Mono',Menlo,monospace" font-size="9.5">StandardConvertletTable（反射注册）</text>
    <text x="194" y="306" font-family="'SF Mono',Menlo,monospace" font-size="9.5">CoreRules（162 常量）· RexImpTable</text>
    <rect x="488" y="270" width="320" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="290">算子→转换器、SqlOperator→实现，用 Map 查找</text>
    <text x="498" y="306">替代 switch；分层 fallback（instance→class）</text>
    <rect x="812" y="270" width="118" height="50" fill="#ffffff" stroke="#1F4E79"/>
    <text x="871" y="292" text-anchor="middle" font-size="10.5" fill="#1a1a1a">08 / 12 / 16</text>

    <!-- Strategy -->
    <rect x="30"  y="322" width="150" height="50" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="40" y="344" font-size="11" font-weight="700" fill="#1F4E79">Strategy</text>
    <text x="40" y="360" font-size="9.5" fill="#1F4E79">可组合算法对象</text>
    <rect x="184" y="322" width="300" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="342" font-family="'SF Mono',Menlo,monospace" font-size="9.5">ReturnTypes.chain()/cascade()</text>
    <text x="194" y="358" font-family="'SF Mono',Menlo,monospace" font-size="9.5">RelDataTypeSystem · DeriveMode · RuleDriver</text>
    <rect x="488" y="322" width="320" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="342">类型推导/方言差异/驱动算法作为对象注入，</text>
    <text x="498" y="358">用组合代替继承，避免算子类爆炸</text>
    <rect x="812" y="322" width="118" height="50" fill="#ffffff" stroke="#1F4E79"/>
    <text x="871" y="344" text-anchor="middle" font-size="10.5" fill="#1a1a1a">06 / 11 / 14</text>

    <!-- Flyweight -->
    <rect x="30"  y="374" width="150" height="50" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="40" y="396" font-size="11" font-weight="700" fill="#1F4E79">Flyweight</text>
    <text x="40" y="412" font-size="9.5" fill="#1F4E79">享元 / interning</text>
    <rect x="184" y="374" width="300" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="394" font-family="'SF Mono',Menlo,monospace" font-size="9.5">RelDataTypeFactoryImpl.DATATYPE_CACHE</text>
    <text x="194" y="410" font-family="'SF Mono',Menlo,monospace" font-size="9.5">RelTraitSet 内存池 · VolcanoCost 常量</text>
    <rect x="488" y="374" width="320" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="394">同值对象仅一份，使昂贵的 deep-equals 退化为</text>
    <text x="498" y="410">廉价的引用相等（==），优化器内大量复用</text>
    <rect x="812" y="374" width="118" height="50" fill="#ffffff" stroke="#1F4E79"/>
    <text x="871" y="396" text-anchor="middle" font-size="10.5" fill="#1a1a1a">06 / 14</text>

    <!-- Template Method -->
    <rect x="30"  y="426" width="150" height="50" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="40" y="448" font-size="11" font-weight="700" fill="#1F4E79">Template Method</text>
    <text x="40" y="464" font-size="9.5" fill="#1F4E79">骨架 + 钩子</text>
    <rect x="184" y="426" width="300" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="446" font-family="'SF Mono',Menlo,monospace" font-size="9.5">RelRule（固定骨架 + onMatch 钩子）</text>
    <text x="194" y="462" font-family="'SF Mono',Menlo,monospace" font-size="9.5">AbstractRelNode · ReflectiveConvertletTable</text>
    <rect x="488" y="426" width="320" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="446">基类固化注册/匹配流程，子类只填写变化点</text>
    <text x="498" y="462">（onMatch），框架掌控调用时序</text>
    <rect x="812" y="426" width="118" height="50" fill="#ffffff" stroke="#1F4E79"/>
    <text x="871" y="448" text-anchor="middle" font-size="10.5" fill="#1a1a1a">12</text>

    <!-- Immutables -->
    <rect x="30"  y="478" width="150" height="50" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="40" y="500" font-size="11" font-weight="700" fill="#1F4E79">Immutable Value</text>
    <text x="40" y="516" font-size="9.5" fill="#1F4E79">@Value.Immutable</text>
    <rect x="184" y="478" width="300" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="498" font-family="'SF Mono',Menlo,monospace" font-size="9.5">RelRule.Config · RelBuilder.Config</text>
    <text x="194" y="514" font-family="'SF Mono',Menlo,monospace" font-size="9.5">大量 *.Config（Immutables 注解处理器）</text>
    <rect x="488" y="478" width="320" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="498">编译期生成 equals/hashCode/builder/withXxx，</text>
    <text x="498" y="514">线程安全的不可变配置；坑：忘配注解处理器</text>
    <rect x="812" y="478" width="118" height="50" fill="#ffffff" stroke="#1F4E79"/>
    <text x="871" y="500" text-anchor="middle" font-size="10.5" fill="#1a1a1a">12 / 19</text>

    <!-- Singleton + 函数式 -->
    <rect x="30"  y="530" width="150" height="50" fill="#F2F2F2" stroke="#595959"/>
    <text x="40" y="552" font-size="11" font-weight="700" fill="#262626">Singleton / 惰性</text>
    <text x="40" y="568" font-size="9.5" fill="#262626">单例 + lazy</text>
    <rect x="184" y="530" width="300" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="194" y="550" font-family="'SF Mono',Menlo,monospace" font-size="9.5">StandardConvertletTable.INSTANCE</text>
    <text x="194" y="566" font-family="'SF Mono',Menlo,monospace" font-size="9.5">Suppliers.memoize · Holder · LoadingCache</text>
    <rect x="488" y="530" width="320" height="50" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="498" y="550">无状态注册表共享单例；昂贵计算（digest/</text>
    <text x="498" y="566">handler 编译）惰性求值并缓存</text>
    <rect x="812" y="530" width="118" height="50" fill="#ffffff" stroke="#1F4E79"/>
    <text x="871" y="552" text-anchor="middle" font-size="10.5" fill="#1a1a1a">04 / 13 / 20</text>
  </g>

  <!-- bottom note band -->
  <rect x="30" y="588" width="900" height="44" rx="6" fill="#F2F2F2" stroke="#BFBFBF"/>
  <text x="42" y="606" font-size="10.5" fill="#595959">阅读法：橙色=本篇主讲（Builder / Abstract Factory / 三层 Visitor 归纳）；其余模式机制细节由对应主讲篇展开，本篇只做"模式视角"归纳 + 指针。</text>
  <text x="42" y="624" font-size="10.5" fill="#595959">三问视角：好在哪（关注点分离/不可变/可扩展）· 为什么这么设计 · 可借鉴点与坑（如 Immutables 注解处理器、Flyweight 的 equals/hashCode 契约）。</text>

  <text x="480" y="652" text-anchor="middle" font-size="10" fill="#A6A6A6">图 19-1 — 八类模式 × 代码实例 × 收益 × 主讲篇；橙色单元格为本篇主讲</text>
</svg>
