<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="depGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <linearGradient id="coreFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">模块依赖拓扑：core 为心 · linq4j 底座 · adapter 外围</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#595959">箭头方向 = 编译期依赖（A → B 读作 "A 依赖 B"）；依赖单向收敛，无环</text>

  <!-- linq4j substrate (bottom) -->
  <rect x="120" y="500" width="660" height="56" rx="10" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
  <text x="450" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#262626">linq4j  （LINQ 表达式 + Enumerable 运行时底座）</text>
  <text x="450" y="544" text-anchor="middle" font-size="10" fill="#595959">无 Calcite 上层依赖，可独立使用；core 与多数 adapter 都建立在它之上</text>

  <!-- core (center) -->
  <rect x="300" y="250" width="300" height="150" rx="12" fill="url(#coreFill)" stroke="#1F4E79" stroke-width="2.5"/>
  <text x="450" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#1F4E79">core</text>
  <text x="450" y="296" text-anchor="middle" font-size="10" fill="#1F4E79">Parser · Validator · sql2rel</text>
  <text x="450" y="312" text-anchor="middle" font-size="10" fill="#1F4E79">RelNode/RexNode · Volcano/Hep</text>
  <text x="450" y="328" text-anchor="middle" font-size="10" fill="#1F4E79">JDBC Driver（内置）</text>
  <text x="450" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#7F3F00">内置 adapter：enumerable · jdbc</text>
  <text x="450" y="368" text-anchor="middle" font-size="9" fill="#595959">前端公共化的物理边界：所有阶段在一个 module 内</text>
  <text x="450" y="386" text-anchor="middle" font-size="9" fill="#595959">下游不可见解析/校验/优化的实现细节</text>

  <!-- testkit (left of core) -->
  <rect x="60" y="288" width="150" height="70" rx="10" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="135" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">testkit</text>
  <text x="135" y="334" text-anchor="middle" font-size="9" fill="#385723">共享测试 Fixture</text>
  <text x="135" y="348" text-anchor="middle" font-size="9" fill="#385723">SqlOperatorFixture…</text>

  <!-- adapters (top ring) -->
  <g font-size="11" font-weight="700">
    <rect x="60"  y="120" width="110" height="44" rx="8" fill="#ffffff" stroke="#C65911" stroke-width="1.5"/>
    <text x="115" y="140" text-anchor="middle" fill="#833C0C">mongodb</text>
    <text x="115" y="156" text-anchor="middle" font-size="9" fill="#595959">BSON pipeline</text>

    <rect x="185" y="120" width="110" height="44" rx="8" fill="#ffffff" stroke="#C65911" stroke-width="1.5"/>
    <text x="240" y="140" text-anchor="middle" fill="#833C0C">elasticsearch</text>
    <text x="240" y="156" text-anchor="middle" font-size="9" fill="#595959">ES DSL</text>

    <rect x="310" y="120" width="110" height="44" rx="8" fill="#ffffff" stroke="#C65911" stroke-width="1.5"/>
    <text x="365" y="140" text-anchor="middle" fill="#833C0C">druid</text>
    <text x="365" y="156" text-anchor="middle" font-size="9" fill="#595959">时序聚合</text>

    <rect x="435" y="120" width="110" height="44" rx="8" fill="#ffffff" stroke="#C65911" stroke-width="1.5"/>
    <text x="490" y="140" text-anchor="middle" fill="#833C0C">cassandra</text>
    <text x="490" y="156" text-anchor="middle" font-size="9" fill="#595959">分区裁剪</text>

    <rect x="560" y="120" width="110" height="44" rx="8" fill="#ffffff" stroke="#C65911" stroke-width="1.5"/>
    <text x="615" y="140" text-anchor="middle" fill="#833C0C">arrow / file</text>
    <text x="615" y="156" text-anchor="middle" font-size="9" fill="#595959">列存 / 多格式</text>

    <rect x="685" y="120" width="150" height="44" rx="8" fill="#ffffff" stroke="#C65911" stroke-width="1.5"/>
    <text x="760" y="140" text-anchor="middle" fill="#833C0C">example/csv</text>
    <text x="760" y="156" text-anchor="middle" font-size="9" fill="#595959">教学三态</text>
  </g>

  <!-- babel / server (right of core, grammar layer) -->
  <g>
    <rect x="690" y="270" width="150" height="44" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
    <text x="765" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">babel</text>
    <text x="765" y="305" text-anchor="middle" font-size="9" fill="#7F6000">扩展方言解析器</text>

    <rect x="690" y="330" width="150" height="44" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
    <text x="765" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">server</text>
    <text x="765" y="365" text-anchor="middle" font-size="9" fill="#7F6000">DDL（CREATE TABLE…）</text>
  </g>

  <!-- dependency edges: adapters -> core -->
  <line x1="115" y1="164" x2="320" y2="250" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>
  <line x1="240" y1="164" x2="355" y2="250" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>
  <line x1="365" y1="164" x2="410" y2="250" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>
  <line x1="490" y1="164" x2="470" y2="250" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>
  <line x1="615" y1="164" x2="540" y2="250" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>
  <line x1="760" y1="164" x2="585" y2="250" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>

  <!-- babel / server -> core -->
  <line x1="690" y1="292" x2="600" y2="300" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>
  <line x1="690" y1="352" x2="600" y2="345" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>

  <!-- testkit -> core -->
  <line x1="210" y1="323" x2="300" y2="323" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>

  <!-- core -> linq4j -->
  <line x1="450" y1="400" x2="450" y2="500" stroke="#1F4E79" stroke-width="2" marker-end="url(#dep)"/>

  <!-- adapters -> linq4j (weak dashed, via enumerable runtime) -->
  <line x1="615" y1="164" x2="700" y2="500" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#depGray)"/>
  <line x1="760" y1="164" x2="740" y2="500" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#depGray)"/>

  <!-- legend -->
  <g>
    <rect x="60" y="430" width="360" height="58" rx="6" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="72" y="448" font-size="11" font-weight="700" fill="#1a1a1a">图例</text>
    <line x1="76" y1="462" x2="116" y2="462" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#dep)"/>
    <text x="124" y="466" font-size="10" fill="#1a1a1a">编译期依赖（A 依赖 B）</text>
    <line x1="76" y1="480" x2="116" y2="480" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#depGray)"/>
    <text x="124" y="484" font-size="10" fill="#888888">经 enumerable 运行时间接依赖 linq4j</text>
  </g>

  <text x="450" y="616" text-anchor="middle" font-size="10" fill="#A6A6A6">图 01-2 — 依赖箭头全部指向中心/底座，方向单一无环；新增 adapter 只“向内”依赖，不要求 core 反向感知</text>
</svg>
