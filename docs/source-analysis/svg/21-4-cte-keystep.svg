<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="stage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
    <marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7030A0"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">CTE 关键一步：内联展开 vs 递归 RepeatUnion 的分水岭</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#595959">分水岭在 createUnion(:4150-4163)：右支是否扫描了与 CTE 同名的表 → 决定走宏展开还是不动点迭代</text>

  <!-- decision -->
  <polygon points="500,66 600,104 500,142 400,104" fill="#FBE5D6" stroke="#7F3F00" stroke-width="1.6"/>
  <text x="500" y="100" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">createUnion：</text>
  <text x="500" y="114" text-anchor="middle" font-size="8.6" fill="#833C0C">findTable(right,name)?</text>
  <text x="320" y="100" font-size="10" font-weight="700" fill="#1F4E79">否（普通 CTE）</text>
  <line x1="400" y1="104" x2="300" y2="104" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="690" y="100" font-size="10" font-weight="700" fill="#7030A0">是（自引用=递归）</text>
  <line x1="600" y1="104" x2="700" y2="104" stroke="#7030A0" stroke-width="1.4" marker-end="url(#loop)"/>

  <!-- left: inline -->
  <rect x="40" y="156" width="430" height="464" rx="8" fill="#ffffff" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="56" y="178" font-size="13" font-weight="700" fill="#1F4E79">A. 非递归：宏展开（内联）</text>
  <text x="56" y="195" font-size="9.4" fill="#595959">convertIdentifier(:3001) 发现名是 CTE → convertFrom 重转定义</text>

  <rect x="150" y="208" width="210" height="40" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="255" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">body 引用 d（第 k 次）</text>
  <text x="255" y="240" text-anchor="middle" font-size="8.4" fill="#595959">SqlIdentifier "d"</text>
  <line x1="255" y1="248" x2="255" y2="266" stroke="#7F3F00" stroke-width="1.6" marker-end="url(#stage)"/>
  <rect x="120" y="266" width="270" height="46" rx="6" fill="#FBE5D6" stroke="#C65911"/>
  <text x="255" y="285" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">fromNamespace.getNode() != null</text>
  <text x="255" y="300" text-anchor="middle" font-size="8.6" fill="#595959">→ convertFrom(bb, 定义) 递归</text>
  <line x1="255" y1="312" x2="255" y2="330" stroke="#7F3F00" stroke-width="1.6" marker-end="url(#stage)"/>

  <rect x="150" y="330" width="210" height="56" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="255" y="350" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">d 的完整算子子树（一份）</text>
  <text x="255" y="366" text-anchor="middle" font-size="8.4" fill="#FFF2CC">Aggregate → Scan(emp)</text>
  <text x="255" y="378" text-anchor="middle" font-size="8.4" fill="#FFF2CC">每次引用都新生成一份</text>

  <text x="56" y="416" font-size="10.5" font-weight="700" fill="#385723">工程取舍</text>
  <text x="56" y="434" font-size="9.4" fill="#595959">+ 实现极简：CTE 只是"命名的子查询"，</text>
  <text x="56" y="448" font-size="9.4" fill="#595959">  无需新算子，语义=纯替换。</text>
  <text x="56" y="466" font-size="9.4" fill="#595959">+ 每份副本可独立下推/裁剪。</text>
  <text x="56" y="488" font-size="9.4" fill="#888">- 坑：无自动物化复用。引用 N 次 →</text>
  <text x="56" y="502" font-size="9.4" fill="#888">  N 份相同子树，可能 N 次重复计算；</text>
  <text x="56" y="516" font-size="9.4" fill="#888">  需靠优化器（CSE/物化视图）才可能合并。</text>
  <text x="56" y="538" font-size="9.4" fill="#595959">对照 PG 的 MATERIALIZED 提示：Calcite</text>
  <text x="56" y="552" font-size="9.4" fill="#595959">默认不物化，由优化器决定是否共享。</text>
  <text x="56" y="582" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#888">SqlToRelConverter.convertFrom(WITH_ITEM):2550</text>

  <!-- right: recursive -->
  <rect x="530" y="156" width="430" height="464" rx="8" fill="#F4ECFB" stroke="#7030A0" stroke-width="1.4"/>
  <text x="546" y="178" font-size="13" font-weight="700" fill="#7030A0">B. 递归：RepeatUnion 不动点迭代</text>
  <text x="546" y="195" font-size="9.4" fill="#595959">RelBuilder.repeatUnion(:3231)：seed + iterative 各包一层 TableSpool</text>

  <rect x="552" y="208" width="180" height="42" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="642" y="226" text-anchor="middle" font-size="9.4" font-weight="700" fill="#1F4E79">seed（递归基）</text>
  <text x="642" y="240" text-anchor="middle" font-size="8" fill="#595959">UNION 左支</text>
  <rect x="758" y="208" width="184" height="42" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="850" y="226" text-anchor="middle" font-size="9.4" font-weight="700" fill="#1F4E79">iterative（递归步）</text>
  <text x="850" y="240" text-anchor="middle" font-size="8" fill="#595959">UNION 右支，含自引用</text>

  <line x1="642" y1="250" x2="642" y2="266" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="850" y1="250" x2="850" y2="266" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="552" y="266" width="180" height="38" rx="6" fill="#FFF2CC" stroke="#BF8F00"/>
  <text x="642" y="284" text-anchor="middle" font-size="9.4" font-weight="700" fill="#7F6000">TableSpool(LAZY)</text>
  <text x="642" y="297" text-anchor="middle" font-size="8" fill="#7F6000">写入 transient 表</text>
  <rect x="758" y="266" width="184" height="38" rx="6" fill="#FFF2CC" stroke="#BF8F00"/>
  <text x="850" y="284" text-anchor="middle" font-size="9.4" font-weight="700" fill="#7F6000">TableSpool(LAZY)</text>
  <text x="850" y="297" text-anchor="middle" font-size="8" fill="#7F6000">读+写 transient 表</text>

  <line x1="642" y1="304" x2="700" y2="324" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="850" y1="304" x2="792" y2="324" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="612" y="324" width="270" height="48" rx="6" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.4"/>
  <text x="747" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">LogicalRepeatUnion</text>
  <text x="747" y="360" text-anchor="middle" font-size="8.4" fill="#FFF2CC">seed, iterative, all, iterationLimit, table</text>

  <!-- loop box -->
  <rect x="600" y="388" width="320" height="120" rx="8" fill="none" stroke="#7030A0" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="612" y="404" font-size="9.6" font-weight="700" fill="#7030A0">loop（不动点）</text>
  <text x="614" y="424" font-size="9" fill="#595959">1. seed 跑一次 → 写入 ListTransientTable</text>
  <text x="614" y="442" font-size="9" fill="#595959">2. iterative 读 transient 表算出新行 → 覆盖写回</text>
  <text x="614" y="460" font-size="9" fill="#595959">3. 重复，直到本轮产 0 行（或达 iterationLimit）</text>
  <text x="614" y="482" font-size="9" fill="#7030A0">物理实现：EnumerableRepeatUnion +</text>
  <text x="614" y="496" font-size="9" fill="#7030A0">EnumerableTableSpool（→第 16 篇执行）</text>

  <text x="546" y="532" font-size="9.4" fill="#888">坑：iterative 必须真能收敛，否则无限循环；</text>
  <text x="546" y="546" font-size="9.4" fill="#888">transient 表是运行期 ArrayList，无统计/索引。</text>
  <text x="546" y="568" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#888">RepeatUnion / Spool / TableSpool</text>
  <text x="546" y="582" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#888">schema/impl/ListTransientTable</text>
  <text x="546" y="596" font-size="8.6" font-family="'SF Mono',Menlo,monospace" fill="#888">RelBuilder.repeatUnion / transientScan</text>

  <text x="500" y="644" text-anchor="middle" font-size="10" fill="#A6A6A6">图 21-4 — 紫色虚线框=运行期迭代；橙=关键产物；左路是编译期一次性宏展开，右路是运行期反复求值至不动点</text>
</svg>
