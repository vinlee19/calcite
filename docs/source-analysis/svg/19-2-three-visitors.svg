<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1F4E79" stroke-width="1"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">三层 IR 的 Visitor / Shuttle 对照</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">同一个 Visitor 模式在 SqlNode / RelNode / RexNode 三层各实现一套——结构一致，语义各异</text>

  <!-- Column 1: Sql layer -->
  <g>
    <rect x="30" y="76" width="290" height="26" rx="5" fill="#E2EFDA" stroke="#548235"/>
    <text x="175" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">① SqlNode 层（AST）</text>

    <!-- interface -->
    <rect x="50" y="116" width="250" height="78" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
    <text x="175" y="134" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187;</text>
    <text x="175" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">SqlVisitor&lt;R&gt;</text>
    <line x1="50" y1="158" x2="300" y2="158" stroke="#548235"/>
    <text x="60" y="174" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#385723">R visit(SqlCall) / visit(SqlLiteral)</text>
    <text x="60" y="187" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#385723">visit(SqlIdentifier) / visit(SqlNodeList)…</text>

    <!-- base impl -->
    <rect x="50" y="216" width="250" height="64" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="175" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">SqlBasicVisitor&lt;R&gt;</text>
    <line x1="50" y1="244" x2="300" y2="244" stroke="#1F4E79"/>
    <text x="60" y="260" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#595959">默认递归 acceptCall(...)</text>
    <text x="60" y="273" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#595959">子类只重写关心的 visit</text>

    <!-- accept side -->
    <rect x="50" y="300" width="250" height="58" rx="6" fill="#F2F2F2" stroke="#595959"/>
    <text x="60" y="318" font-size="10.5" font-weight="700" fill="#262626">被访问端</text>
    <text x="60" y="335" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#262626">SqlNode#accept(SqlVisitor)</text>
    <text x="60" y="349" font-size="9.5" fill="#595959">返回值 R（不改原树，纯遍历/收集）</text>
  </g>

  <!-- Column 2: Rel layer -->
  <g>
    <rect x="335" y="76" width="290" height="26" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="480" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">② RelNode 层（关系代数）</text>

    <rect x="355" y="116" width="250" height="78" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
    <text x="480" y="134" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187;</text>
    <text x="480" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">RelShuttle</text>
    <line x1="355" y1="158" x2="605" y2="158" stroke="#548235"/>
    <text x="365" y="174" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#385723">RelNode visit(LogicalFilter)</text>
    <text x="365" y="187" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#385723">visit(LogicalJoin)… visit(RelNode other)</text>

    <rect x="355" y="216" width="250" height="64" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="480" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">RelShuttleImpl</text>
    <line x1="355" y1="244" x2="605" y2="244" stroke="#1F4E79"/>
    <text x="365" y="260" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#595959">visitChildren() 递归 + copy()</text>
    <text x="365" y="273" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#595959">RelHomogeneousShuttle 齐次委托</text>

    <rect x="355" y="300" width="250" height="58" rx="6" fill="#F2F2F2" stroke="#595959"/>
    <text x="365" y="318" font-size="10.5" font-weight="700" fill="#262626">被访问端</text>
    <text x="365" y="335" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#262626">RelNode#accept(RelShuttle)</text>
    <text x="365" y="349" font-size="9.5" fill="#595959">返回 RelNode（变即新建，不变则原样返回）</text>
  </g>

  <!-- Column 3: Rex layer -->
  <g>
    <rect x="640" y="76" width="290" height="26" rx="5" fill="#FBE5D6" stroke="#C65911"/>
    <text x="785" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#833C0C">③ RexNode 层（行表达式）</text>

    <rect x="660" y="116" width="250" height="78" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
    <text x="785" y="134" text-anchor="middle" font-size="11" fill="#385723">&#171;interface&#187;</text>
    <text x="785" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">RexVisitor&lt;R&gt;</text>
    <line x1="660" y1="158" x2="910" y2="158" stroke="#548235"/>
    <text x="670" y="174" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#385723">R visitCall(RexCall)</text>
    <text x="670" y="187" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#385723">visitInputRef / visitLiteral / visitOver…</text>

    <rect x="660" y="216" width="250" height="64" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="785" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">RexShuttle implements RexVisitor&lt;RexNode&gt;</text>
    <line x1="660" y1="244" x2="910" y2="244" stroke="#1F4E79"/>
    <text x="670" y="260" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#595959">visitList(update[]) 脏标记</text>
    <text x="670" y="273" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#595959">未变 → return call（复用）</text>

    <rect x="660" y="300" width="250" height="58" rx="6" fill="#F2F2F2" stroke="#595959"/>
    <text x="670" y="318" font-size="10.5" font-weight="700" fill="#262626">被访问端</text>
    <text x="670" y="335" font-family="'SF Mono',Menlo,monospace" font-size="8.5" fill="#262626">RexNode#accept(RexVisitor&lt;R&gt;)</text>
    <text x="670" y="349" font-size="9.5" fill="#595959">RexShuttle 用于列重映射/条件下推</text>
  </g>

  <!-- inheritance arrows (impl -> interface) -->
  <line x1="175" y1="216" x2="175" y2="195" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <line x1="480" y1="216" x2="480" y2="195" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <line x1="785" y1="216" x2="785" y2="195" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>

  <!-- accept references (dashed weak) -->
  <line x1="175" y1="300" x2="175" y2="281" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <line x1="480" y1="300" x2="480" y2="281" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <line x1="785" y1="300" x2="785" y2="281" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>

  <!-- Comparison band -->
  <rect x="30" y="380" width="900" height="148" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="44" y="402" font-size="13" font-weight="700" fill="#7F6000">三套 Visitor 的同与异（设计取舍）</text>
  <g font-size="10.5" fill="#1a1a1a">
    <text x="44" y="424" font-weight="700" fill="#7F6000">相同</text>
    <text x="100" y="424">double-dispatch：accept(visitor) 回调 visitor.visitXxx(this)，避免在调用方写 instanceof 分支。</text>
    <text x="44" y="446" font-weight="700" fill="#7F6000">返回型</text>
    <text x="100" y="446">SqlVisitor&lt;R&gt;/RexVisitor&lt;R&gt; 泛型返回（可做收集/求值）；RelShuttle 固定返回 RelNode（专做改写）。</text>
    <text x="44" y="468" font-weight="700" fill="#7F6000">不变量</text>
    <text x="100" y="468">Shuttle 改写遵守"没变就返回原对象"——RexShuttle 用 update[] 脏标记，保证引用相等以省内存与去重。</text>
    <text x="44" y="490" font-weight="700" fill="#7F6000">基类</text>
    <text x="100" y="490">SqlBasicVisitor / RelShuttleImpl / RexShuttle 都内置默认递归（Template Method），子类只覆盖关心的节点。</text>
    <text x="44" y="512" font-weight="700" fill="#7F6000">坑</text>
    <text x="100" y="512">改写后结果类型可能变（RexShuttle 源码 REVIEW 注释明示不重算类型），CAST/NEW 等需配合 RexBuilder 重建。</text>
  </g>

  <!-- 4th layer note -->
  <rect x="30" y="540" width="900" height="50" rx="8" fill="#F2F2F2" stroke="#595959"/>
  <text x="44" y="560" font-size="11" font-weight="700" fill="#262626">第四层：linq4j tree.Shuttle</text>
  <text x="44" y="578" font-size="10.5" fill="#595959">Expression Tree 同样有一套 Shuttle（OptimizeShuttle 做常量折叠/死代码消除），模式一致——详见 15-linq4j.md。</text>

  <!-- Legend -->
  <g>
    <rect x="30" y="602" width="900" height="58" rx="6" fill="#ffffff" stroke="#BFBFBF"/>
    <text x="44" y="620" font-size="11" font-weight="700" fill="#1a1a1a">图例</text>
    <rect x="120" y="610" width="22" height="14" fill="#E2EFDA" stroke="#548235"/><text x="148" y="621" font-size="10" fill="#385723">interface</text>
    <rect x="210" y="610" width="22" height="14" fill="#FFF2CC" stroke="#BF8F00"/><text x="238" y="621" font-size="10" fill="#7F6000">abstract / 说明</text>
    <rect x="340" y="610" width="22" height="14" fill="#FFFFFF" stroke="#1F4E79"/><text x="368" y="621" font-size="10" fill="#1a1a1a">具体类</text>
    <rect x="430" y="610" width="22" height="14" fill="#F2F2F2" stroke="#595959"/><text x="458" y="621" font-size="10" fill="#262626">被访问端</text>
    <line x1="530" y1="617" x2="560" y2="617" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/><text x="566" y="621" font-size="10" fill="#1a1a1a">继承/实现</text>
    <line x1="660" y1="617" x2="690" y2="617" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/><text x="696" y="621" font-size="10" fill="#888">accept 引用</text>
    <text x="44" y="648" font-size="10" fill="#595959">三列分别对应 03 / 04 / 05 篇的本层用法；"三层对照"归本篇（19）。</text>
  </g>

  <text x="480" y="694" text-anchor="middle" font-size="10" fill="#A6A6A6">图 19-2 — 同一 Visitor 模式在四层 IR 上的统一与差异；接口绿、具体类蓝框、被访问端灰</text>
</svg>
