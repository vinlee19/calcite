<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <linearGradient id="bgCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="980" height="660" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">Parser 代码生成构建管线：FMPP → JavaCC → SqlParserImpl</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#595959">一份模板 + 一份配置，经两段构建桥接，编译期生成具体方言的解析器</text>

  <!-- Stage 1: inputs -->
  <text x="60" y="86" font-size="13" font-weight="700" fill="#7F6000">① 输入（受版本控制的源）</text>

  <rect x="60" y="96" width="210" height="64" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="165" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">Parser.jj（模板）</text>
  <text x="165" y="138" text-anchor="middle" font-size="10" fill="#595959">codegen/templates/Parser.jj</text>
  <text x="165" y="152" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">JavaCC 文法 + Freemarker 指令</text>

  <rect x="300" y="96" width="210" height="64" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="405" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">config.fmpp（方言配置）</text>
  <text x="405" y="138" text-anchor="middle" font-size="10" fill="#595959">codegen/config.fmpp</text>
  <text x="405" y="152" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">class / keywords / *ParserMethods</text>

  <rect x="540" y="96" width="210" height="64" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.3"/>
  <text x="645" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#262626">default_config.fmpp</text>
  <text x="645" y="138" text-anchor="middle" font-size="10" fill="#595959">codegen/default_config.fmpp</text>
  <text x="645" y="152" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">缺省值兜底（!default.parser.*）</text>

  <rect x="780" y="96" width="160" height="64" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.3"/>
  <text x="860" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#385723">includes/*.ftl</text>
  <text x="860" y="138" text-anchor="middle" font-size="10" fill="#595959">parserImpls.ftl</text>
  <text x="860" y="152" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#385723">自定义产生式实现</text>

  <!-- config overlays default (ref) -->
  <line x1="540" y1="128" x2="512" y2="128" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="526" y="180" text-anchor="middle" font-size="9" fill="#888">覆盖/兜底</text>
  <!-- includes pulled in by config -->
  <line x1="780" y1="128" x2="512" y2="118" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="660" y="106" text-anchor="middle" font-size="9" fill="#888">implementationFiles 引入</text>

  <!-- Stage 2: FMPP task -->
  <rect x="200" y="206" width="320" height="58" rx="8" fill="url(#bgCore)" stroke="#1F4E79" stroke-width="2"/>
  <text x="360" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">② FmppTask（calcite.fmpp 插件）</text>
  <text x="360" y="248" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1F4E79">Freemarker 渲染：变量替换 + &lt;#list&gt;/&lt;#if&gt; 展开</text>

  <line x1="165" y1="160" x2="300" y2="205" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="405" y1="160" x2="380" y2="205" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- intermediate artifact -->
  <rect x="220" y="296" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="360" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">具化的 Parser.jj（中间产物）</text>
  <text x="360" y="336" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">core/build/fmpp/javaCCMain/javacc/Parser.jj</text>
  <line x1="360" y1="264" x2="360" y2="295" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="328" font-size="9.5" fill="#A6A6A6">纯 JavaCC，已无 Freemarker</text>

  <!-- Stage 3: JavaCC task -->
  <rect x="200" y="384" width="320" height="58" rx="8" fill="url(#bgCore)" stroke="#1F4E79" stroke-width="2"/>
  <text x="360" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">③ JavaCCTask（calcite.javacc 插件）</text>
  <text x="360" y="426" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1F4E79">javacc -OUTPUT_DIRECTORY=…/&lt;package&gt; Parser.jj</text>
  <line x1="360" y1="352" x2="360" y2="383" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: generated java -->
  <rect x="170" y="476" width="380" height="74" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="2"/>
  <text x="360" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">④ 生成的解析器（不入库，build/ 下）</text>
  <text x="360" y="518" text-anchor="middle" font-size="10" fill="#FFF2CC">SqlParserImpl.java · SqlParserImplTokenManager · ParseException …</text>
  <text x="360" y="536" text-anchor="middle" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#FFF2CC">extends SqlAbstractParserImpl  ·  implements FACTORY</text>
  <line x1="360" y1="442" x2="360" y2="475" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- runtime consumer -->
  <rect x="610" y="384" width="330" height="166" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
  <text x="775" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">运行期消费方（手写、稳定 API）</text>
  <rect x="630" y="420" width="290" height="34" rx="5" fill="#ffffff" stroke="#548235"/>
  <text x="775" y="441" text-anchor="middle" font-size="11" fill="#262626">SqlParser.create(sql, config) → parseQuery()</text>
  <rect x="630" y="462" width="290" height="34" rx="5" fill="#ffffff" stroke="#548235"/>
  <text x="775" y="483" text-anchor="middle" font-size="11" fill="#262626">SqlParserImplFactory.getParser(reader)</text>
  <rect x="630" y="504" width="290" height="34" rx="5" fill="#ffffff" stroke="#548235"/>
  <text x="775" y="525" text-anchor="middle" font-size="11" fill="#262626">SqlAbstractParserImpl（抽象基类）</text>
  <line x1="550" y1="513" x2="628" y2="513" stroke="#548235" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="589" y="506" text-anchor="middle" font-size="9" fill="#385723">多态调用</text>

  <!-- Gradle wiring note -->
  <rect x="60" y="576" width="880" height="58" rx="6" fill="#F2F2F2" stroke="#BFBFBF"/>
  <text x="74" y="596" font-size="11" font-weight="700" fill="#262626">构建依赖（core/build.gradle.kts）</text>
  <text x="74" y="613" font-size="10" font-family="'SF Mono',Menlo,monospace" fill="#595959">fmppMain → javaCCMain（dependsOn）→ compileKotlin/compileJava；@CacheableTask 支持增量与构建缓存；测试有独立的 fmppTest/javaCCTest 生成第二套扩展语法解析器。</text>

  <text x="490" y="652" text-anchor="middle" font-size="10" fill="#A6A6A6">图 09-1 — 蓝色实线为正向数据流；绿色虚线为运行期多态调用；灰色虚线为配置覆盖/包含关系；橙色块为关键产物</text>
</svg>
