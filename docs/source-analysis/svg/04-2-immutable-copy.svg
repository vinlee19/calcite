<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="share" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">copy() 不可变变换: 改一个节点 = 生成一条新脊线</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">FilterIntoScan 把 Filter 下推: 只复制受影响路径上的节点, 未变子树原样共享 (结构共享)</text>

  <!-- BEFORE column -->
  <text x="180" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">变换前 (原树 v1)</text>

  <rect x="100" y="100" width="160" height="44" rx="6" fill="#2E75B6" stroke="#1F4E79"/>
  <text x="180" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Project#3</text>
  <text x="180" y="135" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#DEEBF7">name=[$1]</text>

  <rect x="100" y="172" width="160" height="44" rx="6" fill="#70AD47" stroke="#385723"/>
  <text x="180" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Filter#2</text>
  <text x="180" y="207" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#E2EFDA">sal &gt; 1000</text>

  <rect x="100" y="244" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="180" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">TableScan#1</text>
  <text x="180" y="279" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">emp</text>

  <line x1="180" y1="144" x2="180" y2="172" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="180" y1="216" x2="180" y2="244" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- transform middle -->
  <rect x="320" y="300" width="320" height="40" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.3"/>
  <text x="480" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7F6000">规则调用 rel.copy(traitSet, newInputs)</text>
  <text x="480" y="333" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">每个受影响节点 new 一份, 旧对象不动</text>

  <line x1="270" y1="190" x2="320" y2="306" stroke="#BF8F00" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- AFTER column -->
  <text x="780" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#C65911">变换后 (新树 v2, 与 v1 共存)</text>

  <rect x="700" y="100" width="160" height="44" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="780" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Project#5 (新)</text>
  <text x="780" y="135" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#FFF2CC">name=[$1]</text>

  <rect x="700" y="172" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="780" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">TableScan#1</text>
  <text x="780" y="207" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#595959">emp (复用!)</text>

  <rect x="700" y="244" width="160" height="44" rx="6" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="780" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Filter#4 (新)</text>
  <text x="780" y="279" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#FFF2CC">sal &gt; 1000 (下推后)</text>

  <line x1="780" y1="144" x2="780" y2="172" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- v2 Filter#4 also points to TableScan? Show pushdown reorders: Project->TableScan? Keep simple: new Project on new ordering -->
  <line x1="700" y1="266" x2="600" y2="266" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="610" y="262" font-size="9" fill="#888" text-anchor="start"> </text>

  <!-- structural sharing arrow: both trees reference SAME TableScan#1 -->
  <path d="M260,266 C440,440 600,200 700,194" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="6,3" marker-end="url(#share)"/>
  <text x="480" y="392" text-anchor="middle" font-size="10" fill="#888">结构共享: 旧树 TableScan#1 与新树同一实例, 未变子树零拷贝</text>

  <!-- key properties panel -->
  <rect x="60" y="420" width="840" height="170" rx="8" fill="#F8F8F8" stroke="#BFBFBF" stroke-width="1"/>
  <text x="76" y="442" font-size="13" font-weight="700" fill="#1F4E79">不可变 + copy() 带来的三个工程红利</text>

  <rect x="80" y="456" width="260" height="118" rx="6" fill="#ffffff" stroke="#548235" stroke-width="1.2"/>
  <text x="96" y="476" font-size="11" font-weight="700" fill="#385723">① 可回溯 / 可对比</text>
  <text x="96" y="496" font-size="9.5" fill="#262626">v1 与 v2 同时存活, 优化器可</text>
  <text x="96" y="510" font-size="9.5" fill="#262626">"记下两版本、按 cost 取优",</text>
  <text x="96" y="524" font-size="9.5" fill="#262626">变换失败也能丢弃新树回退。</text>
  <text x="96" y="544" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#548235">Memo 存等价类 → 见第 11 篇</text>
  <text x="96" y="562" font-size="9" fill="#595959">软件工程: 无副作用 = 易推理</text>

  <rect x="350" y="456" width="260" height="118" rx="6" fill="#ffffff" stroke="#BF8F00" stroke-width="1.2"/>
  <text x="366" y="476" font-size="11" font-weight="700" fill="#7F6000">② 可去重 (digest)</text>
  <text x="366" y="496" font-size="9.5" fill="#262626">不可变 → digest 一旦算出即稳定,</text>
  <text x="366" y="510" font-size="9.5" fill="#262626">可缓存。两个语义相同的节点</text>
  <text x="366" y="524" font-size="9.5" fill="#262626">digest 相等 → 合并为一份。</text>
  <text x="366" y="544" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#BF8F00">deepEquals / deepHashCode</text>
  <text x="366" y="562" font-size="9" fill="#595959">避免重复优化同一子计划</text>

  <rect x="620" y="456" width="260" height="118" rx="6" fill="#ffffff" stroke="#1F4E79" stroke-width="1.2"/>
  <text x="636" y="476" font-size="11" font-weight="700" fill="#1F4E79">③ 可缓存 / 可共享</text>
  <text x="636" y="496" font-size="9.5" fill="#262626">不变对象天然线程安全, 子树</text>
  <text x="636" y="510" font-size="9.5" fill="#262626">能被多个父节点 / 多个候选</text>
  <text x="636" y="524" font-size="9.5" fill="#262626">计划共享, 内存与计算双省。</text>
  <text x="636" y="544" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1F4E79">rowType / digest 惰性缓存</text>
  <text x="636" y="562" font-size="9" fill="#595959">坑: copy() 漏写会退化为深拷贝</text>

  <text x="480" y="618" text-anchor="middle" font-size="10" fill="#A6A6A6">图 04-2 — 蓝线为输入边, 灰虚线为跨版本结构共享; 橙色=本次变换新建的节点, 白底=被新旧两版共用的旧节点</text>
</svg>
