<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#1F4E79" stroke-width="1"/>
    </marker>
    <linearGradient id="bgBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="940" height="700" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">PhysType + JavaRowFormat：逻辑行类型如何映射到 Java 物理表示</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#595959">PhysType 封装 SQL 行类型↔Java 类型的映射；JavaRowFormat 是行的物理布局策略</text>

  <!-- PhysType interface -->
  <rect x="60" y="80" width="320" height="150" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
  <text x="220" y="102" text-anchor="middle" font-size="12" fill="#385723">&#171;interface&#187;</text>
  <text x="220" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#385723">PhysType</text>
  <line x1="72" y1="130" x2="368" y2="130" stroke="#548235" stroke-width="1"/>
  <text x="78" y="148" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">getJavaRowType() : Type</text>
  <text x="78" y="164" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">fieldReference(expr, i) : Expression</text>
  <text x="78" y="180" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">record(exprs) : Expression</text>
  <text x="78" y="196" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">project(fields, format) : PhysType</text>
  <text x="78" y="212" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">generateSelector(..) / convertTo(..)</text>
  <text x="78" y="226" font-size="9" fill="#595959">把"取第 i 个字段""造一行"翻译成 Expression</text>

  <!-- PhysTypeImpl -->
  <rect x="60" y="262" width="320" height="92" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="220" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">PhysTypeImpl</text>
  <line x1="72" y1="294" x2="368" y2="294" stroke="#1F4E79" stroke-width="1"/>
  <text x="78" y="312" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">- rowType : RelDataType</text>
  <text x="78" y="328" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">- javaRowClass : Type</text>
  <text x="78" y="344" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">- format : JavaRowFormat</text>

  <line x1="220" y1="262" x2="220" y2="230" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <text x="232" y="250" font-size="9" fill="#595959">implements</text>

  <!-- holds format -->
  <line x1="380" y1="332" x2="560" y2="332" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="404" y="326" font-size="9" fill="#888">持有 format（策略对象）</text>

  <!-- JavaRowFormat enum -->
  <rect x="560" y="262" width="320" height="92" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="720" y="282" text-anchor="middle" font-size="12" fill="#7F6000">&#171;enum / strategy&#187;</text>
  <text x="720" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#7F6000">JavaRowFormat</text>
  <line x1="572" y1="310" x2="868" y2="310" stroke="#BF8F00" stroke-width="1"/>
  <text x="578" y="328" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">abstract record(..) / field(..) / copy(..)</text>
  <text x="578" y="344" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">optimize(rowType) : JavaRowFormat</text>

  <!-- Variant boxes -->
  <text x="470" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">五种行布局（每种自带一套 record/field/copy 代码生成实现）</text>

  <!-- ARRAY -->
  <rect x="40" y="408" width="270" height="118" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="175" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">ARRAY</text>
  <text x="56" y="446" font-size="9.5" fill="#595959">行 = Object[]，按下标取字段</text>
  <text x="56" y="464" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">javaRowClass = Object[].class</text>
  <text x="56" y="480" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">record  = new Object[]{e0, e1, ...}</text>
  <text x="56" y="496" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">field   = row[i]</text>
  <text x="56" y="514" font-size="9" fill="#385723">通用、装箱、无需合成类（默认主力）</text>

  <!-- CUSTOM -->
  <rect x="335" y="408" width="270" height="118" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="470" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">CUSTOM</text>
  <text x="351" y="446" font-size="9.5" fill="#595959">行 = 合成 POJO（SyntheticRecordType）</text>
  <text x="351" y="464" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">javaRowClass = getJavaClass(type)</text>
  <text x="351" y="480" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">record  = new Foo(e0, e1, ...)</text>
  <text x="351" y="496" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">field   = row.f{i}</text>
  <text x="351" y="514" font-size="9" fill="#385723">可存原始类型，省装箱（&gt;1 字段时）</text>

  <!-- SCALAR / LIST / ROW -->
  <rect x="630" y="408" width="270" height="118" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="765" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#262626">SCALAR · LIST · ROW</text>
  <text x="646" y="448" font-size="9.5" fill="#262626">SCALAR：单字段，行就是裸值</text>
  <text x="646" y="466" font-size="9.5" fill="#262626">LIST：FlatLists（可比较、可作 key）</text>
  <text x="646" y="484" font-size="9.5" fill="#262626">ROW：interpreter.Row 桥接解释器</text>
  <text x="646" y="506" font-size="9" fill="#595959">optimize()：0 字段→LIST，1 字段→SCALAR</text>

  <!-- arrows enum to variants -->
  <line x1="660" y1="354" x2="200" y2="406" stroke="#BF8F00" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="720" y1="354" x2="470" y2="406" stroke="#BF8F00" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="780" y1="354" x2="760" y2="406" stroke="#BF8F00" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Prefer note -->
  <rect x="40" y="544" width="860" height="58" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="1.5"/>
  <text x="56" y="564" font-size="11" font-weight="700" fill="#833C0C">EnumerableRel.Prefer：父算子表达对子行格式的偏好</text>
  <text x="56" y="582" font-size="9.5" fill="#7F3F00">ARRAY / ARRAY_NICE / CUSTOM / CUSTOM_NICE / ANY  —  prefer(format) 在"硬性要求"与"可接受"之间协商</text>
  <text x="56" y="596" font-size="9.5" fill="#7F3F00">设计意图：把"用哪种物理布局"做成可协商的策略，而非硬编码，让相邻算子尽量复用同一表示、减少 convertTo 转换</text>

  <!-- Legend -->
  <rect x="40" y="616" width="860" height="58" rx="6" fill="#FCFCFC" stroke="#BFBFBF"/>
  <text x="56" y="636" font-size="11" font-weight="700" fill="#595959">图例</text>
  <rect x="56" y="648" width="22" height="14" rx="3" fill="#E2EFDA" stroke="#548235"/>
  <text x="86" y="659" font-size="10" fill="#1a1a1a">interface</text>
  <rect x="180" y="648" width="22" height="14" rx="3" fill="#FFF2CC" stroke="#BF8F00"/>
  <text x="210" y="659" font-size="10" fill="#1a1a1a">enum / 策略对象</text>
  <rect x="340" y="648" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="370" y="659" font-size="10" fill="#1a1a1a">具体类 / 实例</text>
  <line x1="500" y1="655" x2="530" y2="655" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <text x="540" y="659" font-size="10" fill="#1a1a1a">实现 (implements)</text>
  <line x1="690" y1="655" x2="720" y2="655" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="730" y="659" font-size="10" fill="#1a1a1a">持有 / 引用</text>

  <text x="470" y="690" text-anchor="middle" font-size="10" fill="#A6A6A6">图 16-2 — PhysType 把"逻辑类型→Java 表示"的差异收敛到 format；同一 RelNode 换 format 即换布局，无需改算子代码</text>
</svg>
