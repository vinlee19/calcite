<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1F4E79" stroke-width="1"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="920" height="700" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">RexNode 子类层次与 operands 结构</text>
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#595959">行表达式（row expression）— 每个节点必有类型；不可变；equals/hashCode 基于内容</text>

  <!-- Abstract root: RexNode -->
  <rect x="350" y="74" width="220" height="64" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.8" stroke-dasharray="4,2"/>
  <text x="460" y="95" text-anchor="middle" font-size="12" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="460" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#7F6000">RexNode</text>
  <text x="460" y="130" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">getType() / getKind() / accept(visitor) / nodeCount()</text>

  <!-- Second-level abstract: RexVariable -->
  <rect x="120" y="200" width="190" height="58" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.6" stroke-dasharray="4,2"/>
  <text x="215" y="220" text-anchor="middle" font-size="11" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="215" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7F6000">RexVariable</text>
  <text x="215" y="252" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">name : String  type : RelDataType</text>

  <!-- RexCall (concrete, the composite) -->
  <rect x="560" y="190" width="280" height="86" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.8"/>
  <text x="700" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">RexCall</text>
  <text x="574" y="230" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">op : SqlOperator</text>
  <text x="574" y="245" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">operands : ImmutableList&lt;RexNode&gt;</text>
  <text x="574" y="260" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">type : RelDataType   nodeCount : int</text>
  <text x="574" y="272" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F3F00">= 操作符调用：递归组合（Composite）</text>

  <!-- RexLiteral -->
  <rect x="350" y="190" width="190" height="58" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="445" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">RexLiteral</text>
  <text x="445" y="233" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">value : Comparable</text>

  <!-- RexSubQuery (subclass of RexCall) -->
  <rect x="620" y="312" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="710" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">RexSubQuery</text>
  <text x="710" y="348" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#595959">extends RexCall · 含 RelNode</text>

  <!-- RexOver (subclass of RexCall) -->
  <rect x="620" y="368" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="710" y="386" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">RexOver</text>
  <text x="710" y="400" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#595959">extends RexCall · 窗口</text>

  <!-- RexSlot (abstract, child of RexVariable) -->
  <rect x="120" y="320" width="190" height="54" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.6" stroke-dasharray="4,2"/>
  <text x="215" y="339" text-anchor="middle" font-size="11" fill="#7F6000">&#171;abstract&#187;</text>
  <text x="215" y="356" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7F6000">RexSlot</text>
  <text x="215" y="369" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">index : int</text>

  <!-- RexCorrelVariable (child of RexVariable) -->
  <rect x="330" y="320" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="415" y="343" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">RexCorrelVariable</text>
  <text x="415" y="360" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#595959">相关子查询变量</text>

  <!-- RexInputRef (child of RexSlot) -->
  <rect x="60" y="440" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="150" y="463" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">RexInputRef</text>
  <text x="150" y="480" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">$N  = 引用输入第 N 列</text>
  <text x="150" y="492" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#7F3F00">hashCode()=index</text>

  <!-- RexLocalRef (child of RexSlot) — HIGHLIGHT -->
  <rect x="260" y="440" width="200" height="58" rx="8" fill="#ED7D31" stroke="#7F3F00" stroke-width="1.8"/>
  <text x="360" y="463" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">RexLocalRef</text>
  <text x="360" y="480" text-anchor="middle" font-size="8.5" font-family="'SF Mono',Menlo,monospace" fill="#FFF2CC">$tN = 引用 exprs[N]（DAG 边）</text>
  <text x="360" y="492" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#FFF2CC">RexProgram 复用的关键</text>

  <!-- RexPatternFieldRef / RexTableInputRef leaves -->
  <rect x="60" y="516" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.2"/>
  <text x="150" y="535" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">RexPatternFieldRef</text>
  <text x="150" y="549" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#595959">MATCH_RECOGNIZE 字段</text>

  <rect x="260" y="516" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.2"/>
  <text x="360" y="535" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">RexTableInputRef</text>
  <text x="360" y="549" text-anchor="middle" font-size="8" font-family="'SF Mono',Menlo,monospace" fill="#595959">物化视图血缘字段</text>

  <!-- RexDynamicParam (leaf, direct child of RexVariable) -->
  <rect x="330" y="392" width="170" height="36" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.2"/>
  <text x="415" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">RexDynamicParam (?)</text>

  <!-- Inheritance edges (open triangle pointing to parent) -->
  <!-- RexVariable -> RexNode -->
  <path d="M215,200 L215,170 L420,170 L420,138" fill="none" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <!-- RexLiteral -> RexNode -->
  <path d="M445,190 L445,138" fill="none" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <!-- RexCall -> RexNode -->
  <path d="M700,190 L700,170 L500,170 L500,138" fill="none" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <!-- RexSlot -> RexVariable -->
  <path d="M215,320 L215,258" fill="none" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <!-- RexCorrelVariable -> RexVariable -->
  <path d="M380,320 L380,290 L290,290 L290,258" fill="none" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <!-- RexDynamicParam -> RexVariable -->
  <path d="M415,392 L415,290 L300,290 L255,258" fill="none" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>
  <!-- RexInputRef -> RexSlot -->
  <path d="M150,440 L150,400 L195,400 L195,374" fill="none" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <!-- RexLocalRef -> RexSlot -->
  <path d="M360,440 L360,400 L235,400 L235,374" fill="none" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
  <!-- RexPatternFieldRef -> RexSlot -->
  <path d="M150,516 L150,505 L195,505 L195,498" fill="none" stroke="#1F4E79" stroke-width="1.1" marker-end="url(#inh)"/>
  <!-- RexTableInputRef -> RexSlot -->
  <path d="M360,516 L360,505 L235,505 L235,498" fill="none" stroke="#1F4E79" stroke-width="1.1" marker-end="url(#inh)"/>
  <!-- RexSubQuery -> RexCall -->
  <path d="M710,312 L710,276" fill="none" stroke="#1F4E79" stroke-width="1.2" marker-end="url(#inh)"/>

  <!-- operands self-reference (RexCall holds RexNode children) -->
  <path d="M840,210 C895,210 895,260 700,266 L702,266" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="852" y="200" font-size="9" fill="#888">operands :</text>
  <text x="852" y="212" font-size="9" fill="#888">0..n RexNode</text>
  <text x="852" y="226" font-size="9" fill="#888">(递归组合)</text>

  <!-- Legend -->
  <g>
    <rect x="540" y="450" width="350" height="118" rx="6" fill="#F8F8F8" stroke="#BFBFBF"/>
    <text x="556" y="470" font-size="11" font-weight="700" fill="#262626">图例</text>
    <rect x="556" y="480" width="22" height="13" fill="#FFF2CC" stroke="#BF8F00" stroke-dasharray="4,2"/>
    <text x="586" y="491" font-size="10" fill="#595959">abstract（抽象基类）</text>
    <rect x="556" y="500" width="22" height="13" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="586" y="511" font-size="10" fill="#595959">具体叶子节点</text>
    <rect x="556" y="520" width="22" height="13" fill="#ED7D31" stroke="#7F3F00"/>
    <text x="586" y="531" font-size="10" fill="#595959">DAG 共享热点（RexLocalRef）</text>
    <line x1="556" y1="546" x2="582" y2="546" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#inh)"/>
    <text x="592" y="550" font-size="10" fill="#595959">继承（空心三角指向父类）</text>
    <line x1="730" y1="546" x2="756" y2="546" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
    <text x="766" y="550" font-size="10" fill="#595959">持有/引用</text>
  </g>

  <text x="460" y="688" text-anchor="middle" font-size="10" fill="#A6A6A6">图 05-1 — RexNode 抽象基类（黄虚框）派生出 RexLiteral / RexCall / RexVariable；RexCall.operands 递归持有 RexNode 形成表达式树</text>
</svg>
