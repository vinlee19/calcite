<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="stage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F3F00"/>
    </marker>
  </defs>

  <rect width="1080" height="660" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">总览：三个 SQL 特性在五阶段流水线上的全链路与关键一步</text>
  <text x="540" y="50" text-anchor="middle" font-size="12" fill="#595959">同一条 SQL→可运行结果的产线；每行一个特性，第三列（橙）是各自把"句法形态"显式化为中间表示的关键一步</text>

  <!-- stage headers -->
  <rect x="24" y="68" width="96" height="30" rx="5" fill="#F2F2F2" stroke="#595959"/>
  <text x="72" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">特性 \ 阶段</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="124" y="68" width="180" height="30" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="312" y="68" width="180" height="30" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="500" y="68" width="180" height="30" rx="5" fill="#ED7D31" stroke="#7F3F00"/>
    <rect x="688" y="68" width="180" height="30" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <rect x="876" y="68" width="180" height="30" rx="5" fill="#DEEBF7" stroke="#1F4E79"/>
    <text x="214" y="88" fill="#1F4E79">① Parse（SqlNode）</text>
    <text x="402" y="88" fill="#1F4E79">② Validate</text>
    <text x="590" y="88" fill="#ffffff">③ Convert ★</text>
    <text x="778" y="88" fill="#1F4E79">④ Optimize（RelNode）</text>
    <text x="966" y="88" fill="#1F4E79">⑤ Execute</text>
  </g>

  <!-- stage advance arrows (top band) -->
  <line x1="304" y1="83" x2="312" y2="83" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="492" y1="83" x2="500" y2="83" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="680" y1="83" x2="688" y2="83" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>
  <line x1="868" y1="83" x2="876" y2="83" stroke="#7F3F00" stroke-width="2" marker-end="url(#stage)"/>

  <!-- ===== Row 1: 子查询 ===== -->
  <rect x="24" y="106" width="96" height="120" rx="6" fill="#DEEBF7" stroke="#1F4E79"/>
  <text x="72" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">子查询</text>
  <text x="72" y="180" text-anchor="middle" font-size="8.4" fill="#595959">IN/EXISTS</text>
  <text x="72" y="192" text-anchor="middle" font-size="8.4" fill="#595959">/标量</text>

  <rect x="124" y="106" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="214" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">SqlBasicCall(IN)</text>
  <text x="214" y="146" text-anchor="middle" font-size="8.6" fill="#595959">[ 左表达式, 嵌套 SqlSelect ]</text>
  <text x="214" y="160" text-anchor="middle" font-size="8.6" fill="#595959">operator=SqlInOperator</text>
  <text x="214" y="184" text-anchor="middle" font-size="8" fill="#888">子查询=树里的嵌套查询节点</text>

  <rect x="312" y="106" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="402" y="128" text-anchor="middle" font-size="9.6" font-weight="700" fill="#385723">SelectScope 链</text>
  <text x="402" y="146" text-anchor="middle" font-size="8.6" fill="#595959">子查询父 scope=外层</text>
  <text x="402" y="160" text-anchor="middle" font-size="8.6" fill="#595959">DelegatingScope 解析</text>
  <text x="402" y="174" text-anchor="middle" font-size="8.6" fill="#595959">相关列 e.x（→第 07 篇）</text>

  <rect x="500" y="106" width="180" height="120" rx="6" fill="#FBE5D6" stroke="#7F3F00" stroke-width="1.6"/>
  <text x="590" y="126" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">convertExists</text>
  <rect x="512" y="134" width="156" height="44" rx="5" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="590" y="153" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">RexSubQuery</text>
  <text x="590" y="168" text-anchor="middle" font-size="8" fill="#FFF2CC">行内嵌一棵 RelNode</text>
  <text x="590" y="194" text-anchor="middle" font-size="8" fill="#833C0C">findSubQueries→substitute</text>
  <text x="590" y="206" text-anchor="middle" font-size="8" fill="#833C0C">SubQuery→convertExists</text>

  <rect x="688" y="106" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="778" y="126" text-anchor="middle" font-size="9.4" font-weight="700" fill="#1F4E79">SubQueryRemoveRule</text>
  <rect x="700" y="134" width="156" height="34" rx="5" fill="#1F4E79"/>
  <text x="778" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Join / SemiJoin</text>
  <text x="778" y="184" text-anchor="middle" font-size="8.2" fill="#595959">相关：+RelDecorrelator</text>
  <text x="778" y="197" text-anchor="middle" font-size="8" fill="#888">去关联（→第 08 篇）</text>

  <rect x="876" y="106" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <rect x="888" y="124" width="156" height="36" rx="5" fill="#E2EFDA" stroke="#548235"/>
  <text x="966" y="146" text-anchor="middle" font-size="9.6" font-weight="700" fill="#385723">EnumerableHashJoin</text>
  <text x="966" y="178" text-anchor="middle" font-size="8.4" fill="#595959">Janino→Bindable</text>
  <text x="966" y="194" text-anchor="middle" font-size="8.4" fill="#595959">→结果行</text>

  <!-- ===== Row 2: CTE ===== -->
  <rect x="24" y="234" width="96" height="120" rx="6" fill="#DEEBF7" stroke="#1F4E79"/>
  <text x="72" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">CTE</text>
  <text x="72" y="308" text-anchor="middle" font-size="8.4" fill="#595959">WITH</text>
  <text x="72" y="320" text-anchor="middle" font-size="8.4" fill="#595959">[RECURSIVE]</text>

  <rect x="124" y="234" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="214" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">SqlWith</text>
  <text x="214" y="274" text-anchor="middle" font-size="8.6" fill="#595959">{ withList=[SqlWithItem], body }</text>
  <text x="214" y="290" text-anchor="middle" font-size="8.6" fill="#595959">SqlWithItem.recursive 标志</text>
  <text x="214" y="314" text-anchor="middle" font-size="8" fill="#888">每个 CTE = 命名的子查询</text>

  <rect x="312" y="234" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="402" y="256" text-anchor="middle" font-size="9.6" font-weight="700" fill="#385723">registerWith</text>
  <text x="402" y="274" text-anchor="middle" font-size="8.6" fill="#595959">WithScope 渐进可见</text>
  <text x="402" y="288" text-anchor="middle" font-size="8.6" fill="#595959">递归→WithRecursiveScope</text>
  <text x="402" y="302" text-anchor="middle" font-size="8.6" fill="#595959">自引用合法（→第 07 篇）</text>

  <rect x="500" y="234" width="180" height="120" rx="6" fill="#FBE5D6" stroke="#7F3F00" stroke-width="1.6"/>
  <text x="590" y="254" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">convertWith：只转 body</text>
  <rect x="512" y="262" width="156" height="30" rx="5" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="590" y="282" text-anchor="middle" font-size="9.2" font-weight="700" fill="#ffffff">引用即内联展开</text>
  <text x="590" y="306" text-anchor="middle" font-size="8" fill="#833C0C">convertIdentifier→convertFrom</text>
  <rect x="512" y="312" width="156" height="30" rx="5" fill="#FFF2CC" stroke="#BF8F00"/>
  <text x="590" y="331" text-anchor="middle" font-size="8.6" font-weight="700" fill="#7F6000">递归：createUnion→RepeatUnion</text>

  <rect x="688" y="234" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="778" y="256" text-anchor="middle" font-size="9.2" font-weight="700" fill="#1F4E79">CTE 已消失</text>
  <text x="778" y="274" text-anchor="middle" font-size="8.6" fill="#595959">普通：N 份相同子树</text>
  <text x="778" y="288" text-anchor="middle" font-size="8.6" fill="#595959">（可被 CSE/物化视图去重）</text>
  <rect x="700" y="298" width="156" height="30" rx="5" fill="#1F4E79"/>
  <text x="778" y="318" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">递归：LogicalRepeatUnion</text>

  <rect x="876" y="234" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <rect x="888" y="252" width="156" height="36" rx="5" fill="#E2EFDA" stroke="#548235"/>
  <text x="966" y="274" text-anchor="middle" font-size="9.4" font-weight="700" fill="#385723">普通：复用算子执行</text>
  <text x="966" y="306" text-anchor="middle" font-size="8.4" fill="#595959">递归：EnumerableRepeatUnion</text>
  <text x="966" y="320" text-anchor="middle" font-size="8.4" fill="#595959">+ TableSpool 迭代至不动点</text>

  <!-- ===== Row 3: 开窗 ===== -->
  <rect x="24" y="362" width="96" height="120" rx="6" fill="#DEEBF7" stroke="#1F4E79"/>
  <text x="72" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">开窗</text>
  <text x="72" y="436" text-anchor="middle" font-size="8.4" fill="#595959">OVER /</text>
  <text x="72" y="448" text-anchor="middle" font-size="8.4" fill="#595959">WINDOW</text>

  <rect x="124" y="362" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="214" y="384" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">SqlBasicCall(OVER)</text>
  <text x="214" y="402" text-anchor="middle" font-size="8.6" fill="#595959">[ SUM(sal), SqlWindow ]</text>
  <text x="214" y="416" text-anchor="middle" font-size="8.6" fill="#595959">SqlWindow: partition/order</text>
  <text x="214" y="430" text-anchor="middle" font-size="8.6" fill="#595959">/frame bounds</text>
  <text x="214" y="454" text-anchor="middle" font-size="8" fill="#888">SqlOverOperator</text>

  <rect x="312" y="362" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="402" y="384" text-anchor="middle" font-size="9.6" font-weight="700" fill="#385723">validateWindow</text>
  <text x="402" y="402" text-anchor="middle" font-size="8.6" fill="#595959">SqlWindow.validate</text>
  <text x="402" y="416" text-anchor="middle" font-size="8.6" fill="#595959">ROWS vs RANGE 帧校验</text>
  <text x="402" y="430" text-anchor="middle" font-size="8.6" fill="#595959">resolveWindow 合并命名窗口</text>

  <rect x="500" y="362" width="180" height="120" rx="6" fill="#FBE5D6" stroke="#7F3F00" stroke-width="1.6"/>
  <text x="590" y="382" text-anchor="middle" font-size="9.6" font-weight="700" fill="#833C0C">convertOver + HistogramShuttle</text>
  <rect x="512" y="390" width="156" height="44" rx="5" fill="#ED7D31" stroke="#7F3F00"/>
  <text x="590" y="409" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">RexOver</text>
  <text x="590" y="424" text-anchor="middle" font-size="8" fill="#FFF2CC">行级 + 带 RexWindow 规格</text>
  <text x="590" y="450" text-anchor="middle" font-size="8" fill="#833C0C">逐个 agg 调用包成 RexOver</text>
  <text x="590" y="462" text-anchor="middle" font-size="8" fill="#833C0C">（AVG→SUM/COUNT 也处理）</text>

  <rect x="688" y="362" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <text x="778" y="384" text-anchor="middle" font-size="9.4" font-weight="700" fill="#1F4E79">ProjectToWindowRule</text>
  <rect x="700" y="392" width="156" height="44" rx="5" fill="#1F4E79"/>
  <text x="778" y="411" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">LogicalWindow</text>
  <text x="778" y="426" text-anchor="middle" font-size="8" fill="#DEEBF7">Window.Group(keys/order/frame)</text>
  <text x="778" y="454" text-anchor="middle" font-size="8" fill="#595959">行级 RexOver→关系级算子</text>
  <text x="778" y="466" text-anchor="middle" font-size="8" fill="#888">同窗口聚合归一组</text>

  <rect x="876" y="362" width="180" height="120" rx="6" fill="#ffffff" stroke="#1F4E79"/>
  <rect x="888" y="380" width="156" height="36" rx="5" fill="#E2EFDA" stroke="#548235"/>
  <text x="966" y="402" text-anchor="middle" font-size="9.6" font-weight="700" fill="#385723">EnumerableWindow</text>
  <text x="966" y="434" text-anchor="middle" font-size="8.4" fill="#595959">分桶→排序→滑帧累加</text>
  <text x="966" y="448" text-anchor="middle" font-size="8.4" fill="#595959">行数不变，逐行给值</text>

  <!-- recap band -->
  <rect x="24" y="498" width="1032" height="118" rx="8" fill="#F2F2F2" stroke="#595959"/>
  <text x="40" y="520" font-size="13" font-weight="700" fill="#262626">三个"关键一步"一句话总结（都发生在第三阶段 SqlToRel：把句法形态显式化为可被优化器处理的中间表示）</text>
  <text x="40" y="546" font-size="10.5" fill="#1F4E79">• 子查询：</text>
  <text x="116" y="546" font-size="10.5" fill="#262626">findSubQueries → substituteSubQuery → convertExists，产出 RexSubQuery（行表达式内嵌一棵 RelNode）。</text>
  <text x="40" y="572" font-size="10.5" fill="#1F4E79">• CTE：</text>
  <text x="116" y="572" font-size="10.5" fill="#262626">convertWith 只转 body；每次引用经 convertIdentifier 内联展开定义；递归则 createUnion 改建 RepeatUnion。</text>
  <text x="40" y="598" font-size="10.5" fill="#1F4E79">• 开窗：</text>
  <text x="116" y="598" font-size="10.5" fill="#262626">convertOver + HistogramShuttle 把聚合调用包成 RexOver；ProjectToWindowRule 再提升为关系级 LogicalWindow。</text>

  <text x="540" y="640" text-anchor="middle" font-size="10" fill="#A6A6A6">图 21-8 — 三特性并置在五阶段泳道；橙列=关键一步，其产物（RexSubQuery / 内联或 RepeatUnion / RexInner→Window）决定了后续能否被优化器有效处理</text>
</svg>
