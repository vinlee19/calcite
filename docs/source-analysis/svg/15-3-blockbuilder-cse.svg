<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#548235"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C65911"/>
    </marker>
  </defs>

  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">expressionForReuse：用 HashMap 做公共子表达式消除</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#595959">append 同一个表达式两次：第一次声明变量并登记，第二次靠结构化 equals 命中、复用变量</text>

  <!-- ===== Left column: two append calls ===== -->
  <text x="170" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">codegen 调用方</text>

  <!-- append #1 -->
  <rect x="40" y="104" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="56" y="124" font-size="11" font-weight="700" fill="#1a1a1a">第 1 次 append</text>
  <text x="56" y="142" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">append("t", row[5] + row[6])</text>
  <text x="56" y="158" font-size="9" fill="#595959">（例：两处用到同一加法）</text>

  <!-- append #2 -->
  <rect x="40" y="400" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="56" y="420" font-size="11" font-weight="700" fill="#1a1a1a">第 2 次 append</text>
  <text x="56" y="438" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#262626">append("t", row[5] + row[6])</text>
  <text x="56" y="454" font-size="9" fill="#595959">（结构相同的新 BinaryExpression 对象）</text>

  <!-- ===== Middle: append_ logic ===== -->
  <rect x="360" y="96" width="280" height="200" rx="8" fill="#FBE5D6" stroke="#C65911" stroke-width="2"/>
  <text x="500" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#833C0C">append_(name, expr, optimize)</text>
  <text x="375" y="140" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">if (isSimpleExpression(expr))</text>
  <text x="389" y="154" font-size="9" fill="#595959">参数/常量/简单 cast → 直接返回（内联）</text>
  <text x="375" y="176" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">if (optimizing &amp;&amp; optimize)</text>
  <text x="389" y="190" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#C65911">decl = getComputedExpression(expr)</text>
  <text x="389" y="204" font-size="9" fill="#595959">→ 查 expressionForReuse（并递归父级）</text>
  <text x="375" y="226" font-size="9" fill="#1a1a1a">命中：return decl.parameter（复用）</text>
  <text x="375" y="244" font-size="9" fill="#1a1a1a">未命中：declare FINAL 变量 + add()</text>
  <text x="375" y="262" font-size="9" fill="#595959">add() 内部调 addExpressionForReuse()</text>
  <text x="375" y="282" font-size="9" fill="#595959">仅 isSafeForReuse（final 且不以 _ 开头）才登记</text>

  <!-- ===== Right: the HashMap ===== -->
  <rect x="700" y="96" width="220" height="200" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2"/>
  <text x="810" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">expressionForReuse</text>
  <text x="810" y="134" text-anchor="middle" font-size="9" fill="#1F4E79">HashMap&lt;Expression, Declaration&gt;</text>
  <line x1="712" y1="142" x2="908" y2="142" stroke="#1F4E79" stroke-width="0.8"/>
  <text x="712" y="160" font-size="9" font-weight="700" fill="#385723">key（结构化 equals/hashCode）</text>
  <rect x="712" y="168" width="196" height="34" rx="4" fill="#E2EFDA" stroke="#548235"/>
  <text x="720" y="182" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">BinaryExpression(Add,</text>
  <text x="720" y="195" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">  row[5], row[6])</text>
  <text x="712" y="222" font-size="9" font-weight="700" fill="#385723">value</text>
  <rect x="712" y="230" width="196" height="32" rx="4" fill="#FFFFFF" stroke="#1F4E79"/>
  <text x="720" y="250" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">final … t = row[5]+row[6];</text>
  <text x="712" y="282" font-size="8.5" fill="#888888">两个内容相同的节点 hashCode 相同、equals 为真 → 同一 key</text>

  <!-- ===== Bottom: generated code comparison ===== -->
  <rect x="360" y="480" width="280" height="150" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.4"/>
  <text x="500" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">无 CSE（朴素拼字符串）</text>
  <text x="375" y="522" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">use1 = row[5] + row[6];</text>
  <text x="375" y="540" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">use2 = row[5] + row[6];</text>
  <text x="375" y="566" font-size="9" fill="#C65911">同一加法算了两次（重复计算）</text>

  <rect x="660" y="480" width="280" height="150" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.6"/>
  <text x="800" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#385723">有 CSE（BlockBuilder 产出）</text>
  <text x="675" y="522" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">final … t = row[5] + row[6];</text>
  <text x="675" y="540" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">use1 = t;</text>
  <text x="675" y="558" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#385723">use2 = t;</text>
  <text x="675" y="582" font-size="9" fill="#548235">加法只算一次，两处复用变量 t</text>

  <!-- ===== Pitfall box ===== -->
  <rect x="40" y="500" width="290" height="130" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.6" stroke-dasharray="4,2"/>
  <text x="56" y="520" font-size="11" font-weight="700" fill="#7F6000">关键：两种相等语义并存</text>
  <text x="56" y="540" font-size="9.5" fill="#7F6000">值表达式（Constant/Binary…）→ 结构相等</text>
  <text x="70" y="554" font-size="9" fill="#595959">→ 内容相同即可去重</text>
  <text x="56" y="574" font-size="9.5" fill="#7F6000">ParameterExpression（变量）→ 身份相等</text>
  <text x="70" y="588" font-size="9" fill="#595959">equals(o){ return this==o; }</text>
  <text x="70" y="602" font-size="9" fill="#595959">→ 不同变量绝不被误合并</text>
  <text x="56" y="622" font-size="9" fill="#C65911">混用二者 = CSE 失效或逻辑出错（坑）</text>

  <!-- ===== arrows ===== -->
  <!-- append1 -> append_ -->
  <line x1="300" y1="135" x2="358" y2="160" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="304" y="126" font-size="8.5" fill="#1F4E79">①</text>
  <!-- append_ -> map put (未命中→登记) -->
  <line x1="640" y1="200" x2="698" y2="245" stroke="#548235" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="650" y="232" font-size="8.5" font-weight="700" fill="#548235">②首次未命中→put</text>
  <!-- append2 -> append_ -->
  <line x1="300" y1="430" x2="500" y2="298" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="356" y="380" font-size="8.5" fill="#1F4E79">③</text>
  <!-- append_ -> map get (命中) -->
  <line x1="640" y1="186" x2="710" y2="180" stroke="#C65911" stroke-width="1.6" marker-end="url(#arrowO)"/>
  <text x="648" y="172" font-size="8.5" font-weight="700" fill="#C65911">④再次 get→命中</text>
  <!-- map -> append2 result (return parameter) -->
  <path d="M 700 262 C 360 320, 320 360, 302 412" fill="none" stroke="#C65911" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>
  <text x="360" y="350" font-size="8.5" font-weight="700" fill="#C65911">⑤return 已有变量 t（复用，不重复声明）</text>

  <text x="480" y="666" text-anchor="middle" font-size="10" fill="#A6A6A6">图 15-3 — 蓝色调用、绿色首次登记、橙色二次命中复用；CSE 成立的前提是值节点结构相等、变量节点身份相等</text>
</svg>
