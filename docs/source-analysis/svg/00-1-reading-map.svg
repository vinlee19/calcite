<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <linearGradient id="bgCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="960" height="720" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">Calcite 源码工程鉴赏 · 阅读路线图</text>
  <text x="480" y="55" text-anchor="middle" font-size="12" fill="#595959">20 篇按主题分组；四条推荐路线（IR / 优化器 / 数据工程 / 质量与设计）穿行其间</text>

  <!-- ===== 总览组 ===== -->
  <rect x="40" y="78" width="880" height="64" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.4"/>
  <text x="56" y="98" font-size="12" font-weight="700" fill="#262626">总览（先读）</text>
  <rect x="180" y="86" width="150" height="44" rx="6" fill="#ffffff" stroke="#595959"/>
  <text x="255" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">01 工程定位</text>
  <text x="255" y="122" text-anchor="middle" font-size="9" fill="#595959">无存储 · 关注点分离</text>
  <rect x="350" y="86" width="160" height="44" rx="6" fill="url(#bgCore)" stroke="#1F4E79"/>
  <text x="430" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">02 四层 IR 总论</text>
  <text x="430" y="122" text-anchor="middle" font-size="9" fill="#1F4E79">Sql/Rel/Rex/Expression</text>
  <line x1="330" y1="108" x2="350" y2="108" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== IR 组 ===== -->
  <rect x="40" y="158" width="880" height="78" rx="8" fill="#FFF7E6" stroke="#BF8F00" stroke-width="1.4"/>
  <text x="56" y="178" font-size="12" font-weight="700" fill="#7F6000">IR 重心（★ 用户主攻方向）</text>
  <g font-size="10.5">
    <rect x="120" y="188" width="140" height="40" rx="6" fill="#FFF2CC" stroke="#BF8F00"/><text x="190" y="206" text-anchor="middle" font-weight="700" fill="#7F6000">03 SqlNode</text><text x="190" y="221" text-anchor="middle" font-size="8.5" fill="#7F6000">数据/行为分离</text>
    <rect x="290" y="188" width="140" height="40" rx="6" fill="#FFF2CC" stroke="#BF8F00"/><text x="360" y="206" text-anchor="middle" font-weight="700" fill="#7F6000">04 RelNode</text><text x="360" y="221" text-anchor="middle" font-size="8.5" fill="#7F6000">不可变/copy/digest</text>
    <rect x="460" y="188" width="140" height="40" rx="6" fill="#FFF2CC" stroke="#BF8F00"/><text x="530" y="206" text-anchor="middle" font-weight="700" fill="#7F6000">05 RexNode</text><text x="530" y="221" text-anchor="middle" font-size="8.5" fill="#7F6000">DAG/化简</text>
    <rect x="630" y="188" width="150" height="40" rx="6" fill="#FFF2CC" stroke="#BF8F00"/><text x="705" y="206" text-anchor="middle" font-weight="700" fill="#7F6000">06 类型系统</text><text x="705" y="221" text-anchor="middle" font-size="8.5" fill="#7F6000">Flyweight/策略</text>
  </g>
  <line x1="260" y1="208" x2="290" y2="208" stroke="#BF8F00" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="430" y1="208" x2="460" y2="208" stroke="#BF8F00" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="208" x2="630" y2="208" stroke="#BF8F00" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 前端组 ===== -->
  <rect x="40" y="252" width="430" height="78" rx="8" fill="#F3F7FB" stroke="#1F4E79" stroke-width="1.2"/>
  <text x="56" y="272" font-size="12" font-weight="700" fill="#1F4E79">前端流水线</text>
  <g font-size="10">
    <rect x="56" y="282" width="125" height="40" rx="6" fill="#ffffff" stroke="#1F4E79"/><text x="118" y="300" text-anchor="middle" font-weight="700" fill="#1F4E79">07 Validator</text><text x="118" y="315" text-anchor="middle" font-size="8.5" fill="#595959">Scope/Namespace</text>
    <rect x="190" y="282" width="125" height="40" rx="6" fill="#ffffff" stroke="#1F4E79"/><text x="252" y="300" text-anchor="middle" font-weight="700" fill="#1F4E79">08 SqlToRel</text><text x="252" y="315" text-anchor="middle" font-size="8.5" fill="#595959">Blackboard</text>
    <rect x="324" y="282" width="135" height="40" rx="6" fill="#ffffff" stroke="#1F4E79"/><text x="391" y="300" text-anchor="middle" font-weight="700" fill="#1F4E79">09 Parser 生成</text><text x="391" y="315" text-anchor="middle" font-size="8.5" fill="#595959">FMPP+JavaCC</text>
  </g>

  <!-- ===== 优化器组 ===== -->
  <rect x="40" y="344" width="880" height="78" rx="8" fill="#FDF0E6" stroke="#C65911" stroke-width="1.4"/>
  <text x="56" y="364" font-size="12" font-weight="700" fill="#833C0C">优化器内核</text>
  <g font-size="10">
    <rect x="150" y="374" width="130" height="40" rx="6" fill="#ffffff" stroke="#C65911"/><text x="215" y="392" text-anchor="middle" font-weight="700" fill="#833C0C">10 HepPlanner</text><text x="215" y="407" text-anchor="middle" font-size="8.5" fill="#595959">启发式 DSL</text>
    <rect x="290" y="374" width="130" height="40" rx="6" fill="#ED7D31" stroke="#7F3F00"/><text x="355" y="392" text-anchor="middle" font-weight="700" fill="#ffffff">11 Volcano</text><text x="355" y="407" text-anchor="middle" font-size="8.5" fill="#ffffff">Cascades CBO</text>
    <rect x="430" y="374" width="130" height="40" rx="6" fill="#ffffff" stroke="#C65911"/><text x="495" y="392" text-anchor="middle" font-weight="700" fill="#833C0C">12 规则体系</text><text x="495" y="407" text-anchor="middle" font-size="8.5" fill="#595959">RelRule/Operand</text>
    <rect x="570" y="374" width="140" height="40" rx="6" fill="#ffffff" stroke="#C65911"/><text x="640" y="392" text-anchor="middle" font-weight="700" fill="#833C0C">13 元数据/代价</text><text x="640" y="407" text-anchor="middle" font-size="8.5" fill="#595959">Janino provider</text>
    <rect x="720" y="374" width="150" height="40" rx="6" fill="#ffffff" stroke="#C65911"/><text x="795" y="392" text-anchor="middle" font-weight="700" fill="#833C0C">14 Trait/Convention</text><text x="795" y="407" text-anchor="middle" font-size="8.5" fill="#595959">物理属性传播</text>
  </g>
  <line x1="280" y1="394" x2="290" y2="394" stroke="#C65911" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="420" y1="394" x2="430" y2="394" stroke="#C65911" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 后端组 ===== -->
  <rect x="40" y="434" width="430" height="78" rx="8" fill="#EEF6EA" stroke="#548235" stroke-width="1.2"/>
  <text x="56" y="454" font-size="12" font-weight="700" fill="#385723">执行后端</text>
  <g font-size="10">
    <rect x="70" y="464" width="180" height="40" rx="6" fill="#ffffff" stroke="#548235"/><text x="160" y="482" text-anchor="middle" font-weight="700" fill="#385723">15 linq4j / Expression</text><text x="160" y="497" text-anchor="middle" font-size="8.5" fill="#595959">第四层 IR · CSE</text>
    <rect x="260" y="464" width="195" height="40" rx="6" fill="#ffffff" stroke="#548235"/><text x="357" y="482" text-anchor="middle" font-weight="700" fill="#385723">16 codegen / 双引擎</text><text x="357" y="497" text-anchor="middle" font-size="8.5" fill="#595959">Janino + Interpreter</text>
  </g>
  <line x1="250" y1="484" x2="260" y2="484" stroke="#548235" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 数据工程组 ===== -->
  <rect x="490" y="434" width="430" height="78" rx="8" fill="#EEF6EA" stroke="#548235" stroke-width="1.2"/>
  <text x="506" y="454" font-size="12" font-weight="700" fill="#385723">数据工程 / 扩展性</text>
  <g font-size="10">
    <rect x="510" y="464" width="180" height="40" rx="6" fill="#ffffff" stroke="#548235"/><text x="600" y="482" text-anchor="middle" font-weight="700" fill="#385723">17 扩展性 / Schema SPI</text><text x="600" y="497" text-anchor="middle" font-size="8.5" fill="#595959">能力分层</text>
    <rect x="700" y="464" width="200" height="40" rx="6" fill="#ffffff" stroke="#548235"/><text x="800" y="482" text-anchor="middle" font-weight="700" fill="#385723">18 Adapter 生态对比</text><text x="800" y="497" text-anchor="middle" font-size="8.5" fill="#595959">pushdown / 方言</text>
  </g>
  <line x1="690" y1="484" x2="700" y2="484" stroke="#548235" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== 设计/质量组 ===== -->
  <rect x="40" y="524" width="880" height="64" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.4"/>
  <text x="56" y="544" font-size="12" font-weight="700" fill="#262626">设计与质量（贯穿全书的归纳）</text>
  <rect x="330" y="534" width="180" height="44" rx="6" fill="#ffffff" stroke="#595959"/><text x="420" y="554" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">19 设计模式全景</text><text x="420" y="570" text-anchor="middle" font-size="8.5" fill="#595959">Builder/Visitor/Flyweight…</text>
  <rect x="530" y="534" width="220" height="44" rx="6" fill="#ffffff" stroke="#595959"/><text x="640" y="554" text-anchor="middle" font-size="11" font-weight="700" fill="#262626">20 工程质量 + 全模块巡礼</text><text x="640" y="570" text-anchor="middle" font-size="8.5" fill="#595959">构建/测试/util · 所有模块</text>

  <!-- 路线说明 -->
  <rect x="40" y="602" width="880" height="80" rx="8" fill="#ffffff" stroke="#BFBFBF" stroke-width="1"/>
  <text x="56" y="622" font-size="11" font-weight="700" fill="#262626">四条阅读路线</text>
  <text x="56" y="641" font-size="10" fill="#262626">· IR 路线（推荐）：02 → 03 → 04 → 05 → 06</text>
  <text x="56" y="658" font-size="10" fill="#262626">· 优化器路线：10 → 11 → 12 → 13 → 14</text>
  <text x="500" y="641" font-size="10" fill="#262626">· 数据工程路线：01 → 17 → 18 → 14</text>
  <text x="500" y="658" font-size="10" fill="#262626">· 质量与设计路线：19 → 20 → 09</text>
  <text x="56" y="675" font-size="9.5" fill="#595959">建议先读 01、02 建立全局观，再按兴趣选一条主线；每篇结尾的"对照阅读建议"给出可调试断点。</text>

  <text x="480" y="706" text-anchor="middle" font-size="10" fill="#A6A6A6">图 0-1 — 按主题分组的 20 篇与四条推荐阅读路线；橙色 11 为优化器核心、黄色 03-06 为 IR 重心</text>
</svg>
