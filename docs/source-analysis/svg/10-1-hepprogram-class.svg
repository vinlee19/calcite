<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="inh" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M1,1 L13,7 L1,13 z" fill="#ffffff" stroke="#1F4E79" stroke-width="1.2"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEEBF7"/>
      <stop offset="100%" stop-color="#BDD7EE"/>
    </linearGradient>
  </defs>

  <rect width="940" height="720" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">HepProgram / HepInstruction：组合模式构成的优化 DSL</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#595959">叶子指令 + 容器程序统一为 HepInstruction；运行态 State 与定义态分离，程序得以 re-entrant</text>

  <!-- abstract HepInstruction -->
  <g>
    <rect x="370" y="78" width="210" height="76" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.6" stroke-dasharray="4,2"/>
    <text x="475" y="98" text-anchor="middle" font-size="11" fill="#7F6000">&#171;abstract&#187;</text>
    <text x="475" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">HepInstruction</text>
    <line x1="370" y1="124" x2="580" y2="124" stroke="#BF8F00" stroke-width="0.8"/>
    <text x="382" y="142" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#7F6000">abstract HepState prepare(PrepareContext)</text>
  </g>

  <!-- Composite: HepProgram -->
  <g>
    <rect x="40" y="220" width="250" height="120" rx="8" fill="url(#bgC)" stroke="#1F4E79" stroke-width="2"/>
    <text x="165" y="240" text-anchor="middle" font-size="11" fill="#1F4E79">&#171;composite&#187;</text>
    <text x="165" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">HepProgram extends HepInstruction</text>
    <line x1="40" y1="266" x2="290" y2="266" stroke="#1F4E79" stroke-width="0.8"/>
    <text x="52" y="284" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">final ImmutableList&lt;HepInstruction&gt;</text>
    <text x="52" y="297" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">    instructions;  // 不可变</text>
    <text x="52" y="313" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">MATCH_UNTIL_FIXPOINT = MAX_VALUE</text>
    <text x="52" y="326" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">State prepare(px) { new State(...) }</text>
  </g>

  <!-- Builder -->
  <g>
    <rect x="40" y="372" width="250" height="92" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
    <text x="165" y="391" text-anchor="middle" font-size="11" fill="#595959">&#171;builder&#187;</text>
    <text x="165" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#1F4E79">HepProgramBuilder</text>
    <line x1="40" y1="416" x2="290" y2="416" stroke="#1F4E79" stroke-width="0.8"/>
    <text x="52" y="433" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">addRuleInstance / addRuleClass</text>
    <text x="52" y="445" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">addMatchOrder / addMatchLimit</text>
    <text x="52" y="457" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">addGroupBegin/End  build()</text>
  </g>
  <line x1="165" y1="372" x2="165" y2="340" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="172" y="360" font-size="9" fill="#1F4E79">build() &#8594;</text>

  <!-- Leaf instructions container -->
  <g>
    <rect x="350" y="220" width="560" height="312" rx="10" fill="#F7FBFF" stroke="#9DC3E6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="364" y="240" font-size="12" font-weight="700" fill="#1F4E79">叶子指令（HepInstruction 的 static 内部类）</text>

    <!-- RuleInstance -->
    <rect x="364" y="252" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="444" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">RuleInstance</text>
    <text x="444" y="286" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">final RelOptRule rule</text>
    <text x="444" y="299" text-anchor="middle" font-size="9" fill="#595959">执行单条规则</text>

    <!-- RuleClass -->
    <rect x="538" y="252" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="618" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">RuleClass</text>
    <text x="618" y="286" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">Class&lt;? extends RelOptRule&gt;</text>
    <text x="618" y="299" text-anchor="middle" font-size="9" fill="#595959">按类筛规则集</text>

    <!-- RuleCollection -->
    <rect x="712" y="252" width="180" height="56" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="802" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">RuleCollection</text>
    <text x="802" y="286" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">List&lt;RelOptRule&gt; rules</text>
    <text x="802" y="299" text-anchor="middle" font-size="9" fill="#595959">执行一组规则</text>

    <!-- MatchOrder -->
    <rect x="364" y="320" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="444" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">MatchOrder</text>
    <text x="444" y="354" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">HepMatchOrder order</text>

    <!-- MatchLimit -->
    <rect x="538" y="320" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="618" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">MatchLimit</text>
    <text x="618" y="354" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">int limit</text>

    <!-- ConverterRules -->
    <rect x="712" y="320" width="180" height="50" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="802" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">ConverterRules</text>
    <text x="802" y="354" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">boolean guaranteed</text>

    <!-- RuleLookup -->
    <rect x="364" y="382" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="444" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4E79">RuleLookup</text>
    <text x="444" y="416" text-anchor="middle" font-size="9" font-family="'SF Mono',Menlo,monospace" fill="#595959">String ruleDescription</text>

    <!-- CommonRelSubExprRules -->
    <rect x="538" y="382" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="618" y="397" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">CommonRelSub-</text>
    <text x="618" y="409" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">ExprRules</text>
    <text x="618" y="424" text-anchor="middle" font-size="9" fill="#595959">CSE 识别</text>

    <!-- BeginGroup/EndGroup -->
    <rect x="712" y="382" width="180" height="50" rx="6" fill="#E2EFDA" stroke="#548235"/>
    <text x="802" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#385723">BeginGroup / EndGroup</text>
    <text x="802" y="416" text-anchor="middle" font-size="9" fill="#385723">分组：成对出现，可嵌套</text>

    <!-- SubProgram (composite leaf) -->
    <rect x="364" y="444" width="334" height="50" rx="6" fill="#FBE5D6" stroke="#C65911"/>
    <text x="531" y="462" text-anchor="middle" font-size="11" font-weight="700" fill="#833C0C">SubProgram  →  持有 HepProgram subProgram（递归组合）</text>
    <text x="531" y="478" text-anchor="middle" font-size="9" fill="#833C0C">循环执行子程序直到不再变化（嵌套 fixpoint）</text>

    <!-- Placeholder -->
    <rect x="712" y="444" width="180" height="50" rx="6" fill="#F2F2F2" stroke="#595959" stroke-dasharray="3,2"/>
    <text x="802" y="462" text-anchor="middle" font-size="11" font-weight="700" fill="#595959">Placeholder</text>
    <text x="802" y="478" text-anchor="middle" font-size="9" fill="#595959">建组期占位，prepare 抛异常</text>

    <text x="628" y="514" text-anchor="middle" font-size="9" fill="#9DC3E6">每个叶子各有内部类 State（运行态），实现 execute()，回调 planner.executeXxx(...)</text>
  </g>

  <!-- inheritance arrows leaves -> abstract -->
  <line x1="475" y1="220" x2="475" y2="156" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#inh)"/>
  <!-- HepProgram -> abstract -->
  <path d="M165,220 L165,180 L370,180 L370,156" fill="none" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#inh)"/>
  <text x="220" y="174" font-size="9" fill="#1F4E79">HepProgram 本身也是一种 HepInstruction</text>

  <!-- HepProgram aggregates instructions -->
  <line x1="290" y1="280" x2="350" y2="300" stroke="#888888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
  <text x="296" y="276" font-size="9" fill="#888">0..* instructions</text>

  <!-- State separation box -->
  <g>
    <rect x="40" y="556" width="540" height="118" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
    <text x="54" y="576" font-size="12" font-weight="700" fill="#262626">运行态：HepState（定义不可变，状态可变 &#8594; re-entrant）</text>
    <text x="54" y="596" font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1a1a1a">abstract class HepState { final HepPlanner planner; ... abstract void execute(); }</text>
    <text x="54" y="613" font-size="10" fill="#262626">prepare(px) 自顶向下递归为每条指令分配一份 State；</text>
    <text x="54" y="629" font-size="10" fill="#262626">同一个 HepProgram（不可变）可被多个 planner 复用，互不污染。</text>
    <text x="54" y="649" font-size="10" fill="#262626">HepProgram.State 持有 matchLimit / matchOrder / group 等运行游标，</text>
    <text x="54" y="665" font-size="10" fill="#262626">init() 在每轮执行前重置 —— "程序"与"程序计数器"彻底解耦。</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="600" y="556" width="310" height="118" rx="8" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/>
    <text x="614" y="575" font-size="11" font-weight="700" fill="#262626">图例</text>
    <rect x="614" y="585" width="22" height="14" rx="3" fill="#FFF2CC" stroke="#BF8F00" stroke-dasharray="4,2"/>
    <text x="644" y="596" font-size="10" fill="#262626">abstract（抽象基类）</text>
    <rect x="614" y="604" width="22" height="14" rx="3" fill="url(#bgC)" stroke="#1F4E79"/>
    <text x="644" y="615" font-size="10" fill="#262626">composite（容器型）</text>
    <rect x="614" y="623" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#1F4E79"/>
    <text x="644" y="634" font-size="10" fill="#262626">具体叶子指令</text>
    <line x1="616" y1="648" x2="636" y2="648" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#inh)"/>
    <text x="644" y="652" font-size="10" fill="#262626">继承（空心三角）</text>
    <line x1="754" y1="648" x2="774" y2="648" stroke="#888888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ref)"/>
    <text x="782" y="652" font-size="10" fill="#262626">持有/聚合</text>
  </g>

  <text x="470" y="704" text-anchor="middle" font-size="10" fill="#A6A6A6">图 10-1 — 组合模式：SubProgram 让程序可嵌套，HepProgram 自身即指令；定义态（不可变）与运行态 State（可变）分离</text>
</svg>
