<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>

  <rect width="1100" height="360" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">SQL 查询的五阶段流水线</text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#595959">从一行 SQL 到 Java 字节码执行 — 每一阶段都有清晰的输入/输出与可插拔扩展点</text>

  <!-- Source: SQL text -->
  <rect x="20" y="120" width="110" height="80" rx="10" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="75" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#262626">SQL Text</text>
  <text x="75" y="170" text-anchor="middle" font-size="10" fill="#595959">"SELECT ..."</text>
  <text x="75" y="186" text-anchor="middle" font-size="10" fill="#595959">String / Reader</text>

  <!-- Stage 1: Parse -->
  <rect x="160" y="100" width="160" height="120" rx="10" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2"/>
  <text x="240" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">① Parse</text>
  <text x="240" y="148" text-anchor="middle" font-size="10" fill="#595959">SqlParser.parse()</text>
  <text x="240" y="164" text-anchor="middle" font-size="10" fill="#595959">SqlParserImpl (JavaCC)</text>
  <line x1="180" y1="174" x2="300" y2="174" stroke="#1F4E79" stroke-dasharray="2,2"/>
  <text x="240" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">产出: SqlNode 树</text>
  <text x="240" y="206" text-anchor="middle" font-size="10" fill="#595959">SqlSelect/SqlIdentifier</text>

  <!-- Stage 2: Validate -->
  <rect x="345" y="100" width="160" height="120" rx="10" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2"/>
  <text x="425" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">② Validate</text>
  <text x="425" y="148" text-anchor="middle" font-size="10" fill="#595959">SqlValidator.validate()</text>
  <text x="425" y="164" text-anchor="middle" font-size="10" fill="#595959">类型推导 / 作用域</text>
  <line x1="365" y1="174" x2="485" y2="174" stroke="#1F4E79" stroke-dasharray="2,2"/>
  <text x="425" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">产出: 已校验 SqlNode</text>
  <text x="425" y="206" text-anchor="middle" font-size="10" fill="#595959">带类型 + 命名空间</text>

  <!-- Stage 3: SqlToRel -->
  <rect x="530" y="100" width="160" height="120" rx="10" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2"/>
  <text x="610" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">③ SqlToRel</text>
  <text x="610" y="148" text-anchor="middle" font-size="10" fill="#595959">SqlToRelConverter</text>
  <text x="610" y="164" text-anchor="middle" font-size="10" fill="#595959">convertQuery()</text>
  <line x1="550" y1="174" x2="670" y2="174" stroke="#1F4E79" stroke-dasharray="2,2"/>
  <text x="610" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">产出: 逻辑 RelNode 树</text>
  <text x="610" y="206" text-anchor="middle" font-size="10" fill="#595959">Convention.NONE</text>

  <!-- Stage 4: Optimize -->
  <rect x="715" y="100" width="160" height="120" rx="10" fill="#FBE5D6" stroke="#C65911" stroke-width="2"/>
  <text x="795" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#833C0C">④ Optimize</text>
  <text x="795" y="148" text-anchor="middle" font-size="10" fill="#595959">VolcanoPlanner</text>
  <text x="795" y="164" text-anchor="middle" font-size="10" fill="#595959">findBestExp()</text>
  <line x1="735" y1="174" x2="855" y2="174" stroke="#C65911" stroke-dasharray="2,2"/>
  <text x="795" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#833C0C">产出: 物理 RelNode 树</text>
  <text x="795" y="206" text-anchor="middle" font-size="10" fill="#595959">EnumerableConvention / JDBC / ...</text>

  <!-- Stage 5: Implement -->
  <rect x="900" y="100" width="160" height="120" rx="10" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
  <text x="980" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#385723">⑤ Implement</text>
  <text x="980" y="148" text-anchor="middle" font-size="10" fill="#595959">EnumerableRel.implement</text>
  <text x="980" y="164" text-anchor="middle" font-size="10" fill="#595959">linq4j Expr → Janino</text>
  <line x1="920" y1="174" x2="1040" y2="174" stroke="#548235" stroke-dasharray="2,2"/>
  <text x="980" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#385723">产出: 可执行 Java</text>
  <text x="980" y="206" text-anchor="middle" font-size="10" fill="#595959">Enumerable&lt;Object[]&gt;</text>

  <!-- Arrows between stages -->
  <line x1="130" y1="160" x2="158" y2="160" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="320" y1="160" x2="343" y2="160" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="505" y1="160" x2="528" y2="160" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="160" x2="713" y2="160" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="875" y1="160" x2="898" y2="160" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Below pipeline: source files labels -->
  <g font-size="10" fill="#595959">
    <text x="240" y="248" text-anchor="middle">core/.../sql/parser/SqlParser.java</text>
    <text x="425" y="248" text-anchor="middle">core/.../sql/validate/SqlValidatorImpl.java</text>
    <text x="610" y="248" text-anchor="middle">core/.../sql2rel/SqlToRelConverter.java</text>
    <text x="795" y="248" text-anchor="middle">core/.../plan/volcano/VolcanoPlanner.java</text>
    <text x="980" y="248" text-anchor="middle">core/.../adapter/enumerable/EnumerableRel.java</text>
  </g>

  <!-- Bottom band: feedback -->
  <rect x="20" y="278" width="1060" height="48" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-dasharray="4,3"/>
  <text x="40" y="300" font-size="12" font-weight="700" fill="#7F6000">扩展点 (二次开发常见接入位置)</text>
  <text x="40" y="318" font-size="11" fill="#595959">①FMPP 模板加语法  ②SqlOperator/UDF  ③SqlToRelConverter Hook  ④RelOptRule 注册  ⑤自定义 Convention + Enumerable*</text>

  <text x="550" y="350" text-anchor="middle" font-size="10" fill="#A6A6A6">图 2 — 流水线下方为对应实现类的源码路径；橙色框为可被自定义 Adapter / Rule 替换的关键阶段</text>
</svg>
