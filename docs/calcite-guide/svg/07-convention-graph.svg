<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="cArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">Convention 转换关系图</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#595959">每条有向边 = 一个 ConverterRule；逻辑算子最终必须进入某个执行 Convention 才能被执行</text>

  <!-- Center: NONE / Logical -->
  <g>
    <rect x="370" y="100" width="160" height="68" rx="34" fill="#1F4E79" stroke="#0F2C44" stroke-width="2"/>
    <text x="450" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Convention.NONE</text>
    <text x="450" y="148" text-anchor="middle" font-size="11" fill="#DEEBF7">LogicalProject/Filter/Join/...</text>
    <text x="450" y="162" text-anchor="middle" font-size="10" fill="#FFC000">逻辑算子的起点</text>
  </g>

  <!-- Enumerable (default execution) -->
  <g>
    <rect x="370" y="240" width="160" height="60" rx="30" fill="#ED7D31" stroke="#7F3F00" stroke-width="2"/>
    <text x="450" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ENUMERABLE</text>
    <text x="450" y="284" text-anchor="middle" font-size="10" fill="#FFF2CC">in-process (Janino + linq4j)</text>
  </g>

  <!-- Bindable -->
  <g>
    <rect x="370" y="340" width="160" height="50" rx="25" fill="#A5A5A5" stroke="#595959" stroke-width="1.5"/>
    <text x="450" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BINDABLE</text>
    <text x="450" y="378" text-anchor="middle" font-size="10" fill="#F2F2F2">解释器执行 (interpreter)</text>
  </g>

  <!-- Adapter conventions: left column -->
  <g>
    <rect x="40" y="180" width="150" height="46" rx="23" fill="#5B9BD5" stroke="#1F4E79"/>
    <text x="115" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">JDBC</text>

    <rect x="40" y="240" width="150" height="46" rx="23" fill="#70AD47" stroke="#385723"/>
    <text x="115" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MONGO</text>

    <rect x="40" y="300" width="150" height="46" rx="23" fill="#7030A0" stroke="#3F1D5C"/>
    <text x="115" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CASSANDRA</text>

    <rect x="40" y="360" width="150" height="46" rx="23" fill="#FFC000" stroke="#7F6000"/>
    <text x="115" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#262626">DRUID</text>
  </g>

  <!-- Adapter conventions: right column -->
  <g>
    <rect x="710" y="180" width="150" height="46" rx="23" fill="#9E480E" stroke="#5F2B08"/>
    <text x="785" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ARROW</text>

    <rect x="710" y="240" width="150" height="46" rx="23" fill="#264478" stroke="#0F1F3D"/>
    <text x="785" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ELASTICSEARCH</text>

    <rect x="710" y="300" width="150" height="46" rx="23" fill="#43682B" stroke="#1F3015"/>
    <text x="785" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SPLUNK</text>

    <rect x="710" y="360" width="150" height="46" rx="23" fill="#806000" stroke="#403000"/>
    <text x="785" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GEODE</text>
  </g>

  <!-- Edges from NONE to adapters (left) -->
  <line x1="370" y1="148" x2="190" y2="200" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>
  <line x1="370" y1="152" x2="190" y2="260" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>
  <line x1="370" y1="156" x2="190" y2="320" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>
  <line x1="370" y1="160" x2="190" y2="380" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>

  <!-- Edges from NONE to adapters (right) -->
  <line x1="530" y1="148" x2="710" y2="200" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>
  <line x1="530" y1="152" x2="710" y2="260" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>
  <line x1="530" y1="156" x2="710" y2="320" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>
  <line x1="530" y1="160" x2="710" y2="380" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>

  <!-- Edges NONE → Enumerable / Bindable (vertical) -->
  <line x1="450" y1="168" x2="450" y2="240" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#cArr)"/>
  <line x1="430" y1="300" x2="430" y2="340" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>
  <line x1="470" y1="340" x2="470" y2="300" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#cArr)"/>

  <!-- Edges from adapters back to ENUMERABLE (when a piece must be executed locally) -->
  <line x1="190" y1="220" x2="370" y2="260" stroke="#ED7D31" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#cArr)"/>
  <line x1="190" y1="280" x2="370" y2="270" stroke="#ED7D31" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#cArr)"/>
  <line x1="710" y1="220" x2="530" y2="260" stroke="#ED7D31" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#cArr)"/>
  <line x1="710" y1="280" x2="530" y2="270" stroke="#ED7D31" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#cArr)"/>

  <!-- Legend -->
  <g>
    <rect x="40" y="440" width="820" height="50" rx="6" fill="#F2F2F2" stroke="#BFBFBF"/>
    <text x="56" y="460" font-size="11" font-weight="700" fill="#262626">图例</text>
    <line x1="56" y1="476" x2="106" y2="476" stroke="#1F4E79" stroke-width="2" marker-end="url(#cArr)"/>
    <text x="116" y="480" font-size="11" fill="#595959">ConverterRule (LogicalRel → 物理 Rel)</text>
    <line x1="356" y1="476" x2="406" y2="476" stroke="#ED7D31" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#cArr)"/>
    <text x="416" y="480" font-size="11" fill="#595959">回退到 Enumerable (Calcite 在本地执行剩余算子)</text>
    <text x="720" y="480" font-size="11" fill="#595959">主线 NONE → ENUMERABLE 是兜底路径</text>
  </g>

  <text x="450" y="510" text-anchor="middle" font-size="10" fill="#A6A6A6">图 7 — Calcite 通过这张「Convention 网」让一个查询的不同部分在不同引擎执行 (federated execution)</text>
</svg>
