<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="seqArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="seqArrBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#548235"/>
    </marker>
  </defs>

  <rect width="1000" height="820" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F4E79">JDBC 查询调用时序图</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#595959">从 DriverManager.getConnection 到 ResultSet.next 的内部调用链 — 重点关注五阶段如何被串起来</text>

  <!-- Actors (column headers) -->
  <g font-size="11" font-weight="700" fill="#ffffff">
    <rect x="30"  y="70" width="110" height="32" rx="6" fill="#595959"/><text x="85"  y="91" text-anchor="middle">Client / App</text>
    <rect x="155" y="70" width="110" height="32" rx="6" fill="#1F4E79"/><text x="210" y="91" text-anchor="middle">Driver</text>
    <rect x="280" y="70" width="130" height="32" rx="6" fill="#1F4E79"/><text x="345" y="91" text-anchor="middle">CalcitePrepareImpl</text>
    <rect x="425" y="70" width="105" height="32" rx="6" fill="#1F4E79"/><text x="477" y="91" text-anchor="middle">SqlParser</text>
    <rect x="545" y="70" width="115" height="32" rx="6" fill="#1F4E79"/><text x="602" y="91" text-anchor="middle">SqlValidator</text>
    <rect x="675" y="70" width="130" height="32" rx="6" fill="#1F4E79"/><text x="740" y="91" text-anchor="middle">SqlToRelConverter</text>
    <rect x="820" y="70" width="130" height="32" rx="6" fill="#ED7D31"/><text x="885" y="91" text-anchor="middle">VolcanoPlanner</text>
  </g>

  <!-- Lifeline vertical dashed lines -->
  <g stroke="#BFBFBF" stroke-dasharray="3,4" stroke-width="1">
    <line x1="85"  y1="102" x2="85"  y2="780"/>
    <line x1="210" y1="102" x2="210" y2="780"/>
    <line x1="345" y1="102" x2="345" y2="780"/>
    <line x1="477" y1="102" x2="477" y2="780"/>
    <line x1="602" y1="102" x2="602" y2="780"/>
    <line x1="740" y1="102" x2="740" y2="780"/>
    <line x1="885" y1="102" x2="885" y2="780"/>
  </g>

  <!-- Second row for Enumerable/Janino -->
  <g font-size="11" font-weight="700" fill="#ffffff">
    <rect x="820" y="430" width="160" height="28" rx="6" fill="#548235"/>
    <text x="900" y="449" text-anchor="middle">Enumerable + Janino</text>
  </g>
  <line x1="900" y1="458" x2="900" y2="780" stroke="#BFBFBF" stroke-dasharray="3,4"/>

  <!-- Activation bars (subtle highlights) -->
  <rect x="206" y="125" width="8" height="640" fill="#DEEBF7"/>
  <rect x="341" y="155" width="8" height="600" fill="#DEEBF7"/>

  <!-- Message lines -->
  <g font-size="11" fill="#1F4E79">
    <!-- 1. getConnection -->
    <line x1="85"  y1="130" x2="206" y2="130" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="100" y="124" fill="#262626">1. DriverManager.getConnection("jdbc:calcite:", info)</text>

    <!-- 2. createPrepare -->
    <line x1="214" y1="160" x2="341" y2="160" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="222" y="154" fill="#262626">2. createPrepare() / new CalcitePrepareImpl()</text>

    <!-- 3. executeQuery -->
    <line x1="85"  y1="200" x2="206" y2="200" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="100" y="194" fill="#262626">3. Statement.executeQuery("SELECT ...")</text>

    <!-- 4. prepareSql -->
    <line x1="214" y1="228" x2="341" y2="228" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="222" y="222" fill="#262626">4. prepareSql(context, sql, ...)</text>

    <!-- 5. parse -->
    <line x1="349" y1="262" x2="476" y2="262" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="358" y="256" fill="#262626">5. parser.parseQuery(sql)</text>
    <line x1="476" y1="286" x2="349" y2="286" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="358" y="280" fill="#385723">← SqlNode 树</text>

    <!-- 6. validate -->
    <line x1="349" y1="316" x2="600" y2="316" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="358" y="310" fill="#262626">6. validator.validate(sqlNode)</text>
    <line x1="600" y1="340" x2="349" y2="340" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="358" y="334" fill="#385723">← validated SqlNode (含类型 / namespace)</text>

    <!-- 7. convertQuery -->
    <line x1="349" y1="376" x2="738" y2="376" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="358" y="370" fill="#262626">7. sql2rel.convertQuery(sqlNode, needsValidation=false, top=true)</text>
    <line x1="738" y1="400" x2="349" y2="400" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="358" y="394" fill="#385723">← RelRoot { LogicalProject → LogicalFilter → LogicalTableScan }</text>

    <!-- 8. setRoot + addRule -->
    <line x1="349" y1="436" x2="884" y2="436" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="358" y="430" fill="#262626">8. planner.setRoot(rel) + planner.changeTraits(rel, EnumerableConvention)</text>

    <!-- 9. findBestExp -->
    <line x1="349" y1="478" x2="884" y2="478" stroke="#ED7D31" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="358" y="472" fill="#833C0C">9. planner.findBestExp() — Cascades Memo + RuleQueue 迭代</text>
    <line x1="884" y1="502" x2="349" y2="502" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="358" y="496" fill="#385723">← 物理 RelNode (Enumerable* with best cost)</text>

    <!-- 10. implement -->
    <line x1="349" y1="540" x2="898" y2="540" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="358" y="534" fill="#262626">10. EnumerableRelImplementor.implementRoot() → linq4j Expression</text>
    <line x1="898" y1="564" x2="349" y2="564" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="358" y="558" fill="#385723">← Bindable&lt;Object[]&gt; class (Janino compiled)</text>

    <!-- 11. return ResultSet -->
    <line x1="341" y1="598" x2="214" y2="598" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="222" y="592" fill="#385723">11. ← CalcitePreparedStatement (含 bindable)</text>

    <line x1="206" y1="624" x2="85"  y2="624" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="100" y="618" fill="#385723">12. ← ResultSet</text>

    <!-- 12. rs.next loop -->
    <line x1="85"  y1="658" x2="898" y2="658" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="100" y="652" fill="#262626">13. while (rs.next()) — 驱动 Enumerator.moveNext()</text>

    <line x1="898" y1="684" x2="85" y2="684" stroke="#548235" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seqArrBack)"/>
    <text x="100" y="678" fill="#385723">14. ← current row (Object[])</text>

    <!-- close -->
    <line x1="85" y1="722" x2="206" y2="722" stroke="#1F4E79" stroke-width="1.4" marker-end="url(#seqArr)"/>
    <text x="100" y="716" fill="#262626">15. conn.close() → 释放 Bindable / planner</text>
  </g>

  <!-- Loop frame around steps 13-14 -->
  <rect x="70" y="640" width="850" height="58" fill="none" stroke="#7030A0" stroke-width="1.2" stroke-dasharray="6,3" rx="6"/>
  <text x="78" y="648" font-size="10" font-weight="700" fill="#7030A0">loop  [每一行]</text>

  <text x="500" y="800" text-anchor="middle" font-size="10" fill="#A6A6A6">图 3 — 蓝色为正向调用，绿色虚线为返回；橙色突出优化阶段；紫色虚线框标识迭代区</text>
</svg>
